<style>
  .ds{--bg:#f3ece1;--fg:#123f4c;--panel:#cfe7e9;--card:#fbf6ee;--line:rgba(0,0,0,.08);background:var(--bg);color:var(--fg);border-radius:44px;padding:clamp(16px,3vw,32px);transition:background .6s,color .6s;box-shadow:var(--ch-raise)}
  .ds h1{color:var(--fg);margin:8px 0 0;font-size:clamp(34px,5vw,60px);line-height:1}
  .ds-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .ds-clock{font:800 34px var(--ch-display);min-width:3.2em}
  .ds-bar input{flex:1;min-width:160px}
  .ds-prog{height:4px;border-radius:999px;background:var(--line);margin:12px 0 18px;overflow:hidden}
  .ds-prog i{display:block;height:100%;width:0;background:var(--ch-yellow)}
  .ds-main{display:grid;gap:clamp(16px,3vw,32px);grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:start}
  @media (max-width:820px){.ds-main{grid-template-columns:1fr}}
  .ds-tag{font:500 12px var(--ch-mono);letter-spacing:.1em;opacity:.8}
  .ds-body{font-size:17px;line-height:1.65;margin-top:14px;max-width:34em}
  .ds-art{position:relative;border-radius:36px;background:var(--panel);padding:12px;transition:background .6s}
  .ds-art img{display:block;width:100%;height:auto;border-radius:28px;aspect-ratio:924/540;object-fit:cover}
  .ds-dots{margin-top:12px;padding:12px 14px;border-radius:22px;background:var(--card)}
  .ds-dots .top,.ds-dots .leg{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700;flex-wrap:wrap}
  .ds-dots .row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .ds-dots .row i{width:16px;height:16px;border-radius:50%;transition:opacity .4s}
  .ds-cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));margin-top:22px}
  .ds-cards div{padding:16px 18px;border-radius:24px;background:var(--card);box-shadow:inset 0 -4px 0 var(--line)}
  .ds-cards .k{font:500 11.5px var(--ch-mono);letter-spacing:.06em;text-transform:uppercase;opacity:.75}
  .ds-cards .v{font:800 26px/1.1 var(--ch-display);margin:4px 0}
  .ds-cards .d{font-size:13.5px;line-height:1.45;opacity:.85}
  .ds-nav{display:flex;gap:6px;overflow-x:auto;margin-top:22px;padding:4px}
  .ds-nav button{flex:1;min-width:84px;border:0;border-radius:18px;padding:10px 8px;background:var(--card);color:var(--fg);cursor:pointer;font:inherit;text-align:center}
  .ds-nav button[aria-current="true"]{background:var(--ch-yellow);color:#3a2a00;box-shadow:inset -3px -4px 8px rgba(150,100,0,.35),inset 3px 3px 6px rgba(255,255,255,.5)}
  .ds-nav b{display:block;font:800 16px var(--ch-display)}
  .ds-nav small{font:500 10px var(--ch-mono);letter-spacing:.06em}
  .ds-foot{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
  .ds .ch-btn.soft{background:var(--card);color:var(--fg)}
  .ds-anim{animation:dsIn .52s cubic-bezier(.2,.7,.2,1) both}
  @keyframes dsIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
</style>
</head>
<body class="clay cham">

<main class="ch-wrap ch-stack">
  <nav class="ch-crumb" aria-label="Breadcrumb"><a href="./" data-en="CHAM project">Dự án CHAM</a> / <span data-en="A day on Tân Lộc">Một ngày ở Tân Lộc</span></nav>
  <section class="ds" id="ds">
    <div class="ds-bar">
      <span class="ds-clock" id="ds-clock" aria-hidden="true">05:00</span>
      <label class="ch-sr" for="ds-range" data-en="Time of day">Giờ trong ngày</label>
      <input class="ch-range" type="range" id="ds-range" min="0" max="6" step="1" value="0">
      <button type="button" class="ch-btn sm soft" id="ds-sound" aria-pressed="false">Âm thanh: tắt</button>
      <button type="button" class="ch-btn sm" id="ds-play" aria-pressed="false">Chạy cả ngày</button>
    </div>
    <div class="ds-prog" aria-hidden="true"><i id="ds-prog"></i></div>
    <div class="ds-main">
      <div id="ds-text" aria-live="polite"></div>
      <div>
        <div class="ds-art"><img id="ds-img" src="../assets/cham/clay/islet-overview.png" width="924" height="540" alt=""></div>
        <div class="ds-dots" id="ds-dots"></div>
      </div>
    </div>
    <div class="ds-cards" id="ds-cards"></div>
    <div class="ds-nav" id="ds-nav" role="group" aria-label="Chương" data-en-aria="Chapters"></div>
    <div class="ds-foot"><button type="button" class="ch-btn soft" id="ds-prev" data-en="← Earlier">← Sớm hơn</button><button type="button" class="ch-btn yellow" id="ds-next">Muộn hơn →</button></div>
  </section>
