<!DOCTYPE html>
<!-- BizOn Bật Nghiệp 2026 – © Đỗ Thùy Hương & PGS.TS. Phan Anh Tú -->
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Thư viện Sáng tạo · BizOn Bật Nghiệp</title>
<meta name="description" content="Thư viện Sáng tạo BizOn: toàn bộ tài sản sáng tạo – tạo hình nhân vật đất nặn 3D, dàn nhân vật Hộ Chiếu Thương Hiệu, bối cảnh minh họa, âm nhạc gốc và quà tặng.">
<meta name="copyright" content="© 2026 Đỗ Thùy Hương & PGS.TS. Phan Anh Tú">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/bizon-clay-fonts.css">
<link rel="stylesheet" href="css/bizon-clay.css">
<style>
  /* Bố cục riêng trang Thư viện */
  .lib-hero{position:relative;overflow:hidden;margin:28px 0 48px;border-radius:40px;background:var(--clay-cream-deep);box-shadow:inset 0 -10px 0 rgba(140,80,20,.1),inset 0 6px 0 rgba(255,255,255,.7),0 30px 44px -30px rgba(110,70,30,.6)}
  .lib-hero .sun{position:absolute;right:-8%;top:-34%;width:min(520px,60%);aspect-ratio:1;border-radius:50%;background:url(assets/brand/trong-dong.svg) center/contain no-repeat;box-shadow:inset 0 -16px 0 rgba(200,110,20,.2);opacity:.85;pointer-events:none}
  .lib-hero .grid{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding:clamp(24px,4vw,44px) clamp(20px,4vw,44px) 0}
  .lib-hero h1{margin:18px 0 0;font-size:clamp(40px,5.4vw,68px);text-wrap:balance}
  .lib-hero .art{width:min(22vw,200px);aspect-ratio:760/1100;position:relative;margin-bottom:26px}
  .lib-hero .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 18px 14px rgba(110,70,30,.35));animation:clayFloat 6s ease-in-out infinite}
  .lib-hero .wave{position:relative;z-index:3;height:44px;margin-top:-44px;background:radial-gradient(circle at 36px 0,transparent 35px,var(--clay-teal-2) 36px) 0 0/72px 36px repeat-x,linear-gradient(var(--clay-teal-2),var(--clay-teal-2)) 0 36px/100% 100% no-repeat}
  .lib-bar{position:sticky;top:88px;z-index:40;margin:-8px 0 28px;padding:12px;border-radius:26px;background:rgba(255,251,244,.92);backdrop-filter:blur(10px);box-shadow:0 14px 26px -18px rgba(110,70,30,.55)}
  .lib-bar .row{display:flex;align-items:center;gap:12px}
  .lib-bar input{flex:1;min-width:0;border:0;outline:none;border-radius:999px;padding:12px 18px;font:600 14px var(--clay-head);color:var(--clay-ink);background:var(--clay-tray);box-shadow:inset 3px 4px 8px rgba(110,70,30,.18),inset -3px -3px 6px rgba(255,255,255,.7)}
  .lib-bar #lib-count{flex:none;font-size:13px;font-weight:800;color:var(--clay-sub)}
  #lib-chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
  #lib-lb{position:fixed;inset:0;z-index:120;background:rgba(2,20,24,.92);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  @media (max-width:560px){ .lib-hero .grid{grid-template-columns:1fr} .lib-hero .art{display:none} .lib-bar{top:76px} }
</style>
<meta property="og:type" content="website">
<meta property="og:title" content="Thư viện Sáng tạo · BizOn Bật Nghiệp">
<meta property="og:description" content="Tạo hình nhân vật đất nặn 3D, bối cảnh, âm nhạc gốc và quà tặng của BizOn.">
<meta name="twitter:card" content="summary_large_image">
</head>
<body class="clay">

<main class="clay-main">
  <section class="lib-hero">
    <div class="sun" aria-hidden="true"></div>
    <div class="grid">
      <div style="padding-bottom:clamp(28px,5vw,64px)">
        <span class="clay-eyebrow" data-en="Creative Library">Thư viện Sáng tạo</span>
        <h1 data-en="BizOn creative assets">Tài sản sáng tạo của BizOn</h1>
        <p style="margin:18px 0 0;max-width:34em;font-size:17px;line-height:1.65;color:var(--clay-sub);text-wrap:pretty" data-en="Every creative asset of BizOn Bật Nghiệp – 3D clay character designs, original music, lyrics and merchandise.">Toàn bộ tài sản sáng tạo của BizOn Bật Nghiệp – tạo hình nhân vật đất nặn 3D, âm nhạc gốc, lời bài hát và sản phẩm quà tặng.</p>
      </div>
      <div class="art"><img src="assets/character/advisors/lumina-nghe-nhac-dung-cut.webp" alt="" loading="lazy"></div>
    </div>
    <div class="wave" aria-hidden="true"></div>
  </section>

  <!-- Thanh tìm kiếm + lọc nhóm (dính) -->
  <section class="lib-bar">
    <div class="row">
      <input id="lib-q" type="search" placeholder="Tìm trong thư viện…" aria-label="Tìm trong thư viện" data-en-ph="Search the library…">
      <span id="lib-count"></span>
    </div>
    <div id="lib-chips"></div>
  </section>

  <div id="lib-sections" aria-live="polite"></div>

  <noscript><p style="text-align:center;color:var(--clay-sub);margin:40px 0">Cần bật JavaScript để duyệt Thư viện. · Enable JavaScript to browse the Library.</p></noscript>
</main>

<!-- Lightbox -->
<div id="lib-lb" role="dialog" aria-modal="true" aria-label="Xem ảnh"></div>

<script src="js/site-vnmap.js" defer></script>
<script src="js/bizon-clay-i18n.js" defer></script>
<script src="js/thu-vien-data.js" defer></script>
<script src="js/thu-vien-clay.js" defer></script>
<script src="js/bizon-clay-nav.js" defer></script>
<script src="js/bizon-clay-footer.js" defer></script>
</body>
</html>
