<!DOCTYPE html>
<!-- BizOn Bật Nghiệp 2026 – © Đỗ Thùy Hương & PGS.TS. Phan Anh Tú -->
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kịch bản lớp học · BizOn Bật Nghiệp</title>
<meta name="description" content="Kịch bản lớp học BizOn cho 40–60 sinh viên: buổi 90 phút, giải đấu cả học kỳ 15 tuần, sự kiện «Đại hội Cổ đông & Pitch xin vốn», rubric chấm điểm và bộ công cụ tương tác.">
<meta name="copyright" content="© 2026 Đỗ Thùy Hương & PGS.TS. Phan Anh Tú">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/bizon-clay-fonts.css">
<link rel="stylesheet" href="css/bizon-clay.css">
<style>
  /* Bố cục riêng trang Kịch bản lớp học */
  .lop-hero{position:relative;overflow:hidden;margin:28px 0 48px;border-radius:40px;background:var(--clay-cream-deep);box-shadow:inset 0 -10px 0 rgba(140,80,20,.1),inset 0 6px 0 rgba(255,255,255,.7),0 30px 44px -30px rgba(110,70,30,.6)}
  .lop-hero .sun{position:absolute;right:-8%;top:-34%;width:min(520px,60%);aspect-ratio:1;border-radius:50%;background:url(assets/brand/trong-dong.svg) center/contain no-repeat;box-shadow:inset 0 -16px 0 rgba(200,110,20,.2);opacity:.85;pointer-events:none}
  .lop-hero .grid{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding:clamp(24px,4vw,44px) clamp(20px,4vw,44px) 0}
  .lop-hero h1{margin:18px 0 0;font-size:clamp(40px,5.4vw,68px);text-wrap:balance}
  .lop-hero .art{width:min(24vw,220px);aspect-ratio:3/4;position:relative;margin-bottom:26px}
  .lop-hero .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 18px 14px rgba(110,70,30,.35));animation:clayFloat 6s ease-in-out infinite}
  .lop-hero .wave{position:relative;z-index:3;height:44px;margin-top:-44px;background:radial-gradient(circle at 36px 0,transparent 35px,var(--clay-teal-2) 36px) 0 0/72px 36px repeat-x,linear-gradient(var(--clay-teal-2),var(--clay-teal-2)) 0 36px/100% 100% no-repeat}
  .lop-actionbar{margin:-8px 0 36px;display:flex;flex-direction:column;gap:16px}
  #lop-actions{display:flex;flex-wrap:wrap;gap:10px}
  #lop-toc{display:flex;flex-wrap:wrap;gap:8px}
  #lop-sections{display:flex;flex-direction:column;gap:22px;margin-bottom:40px}
  .lop-cta{margin-bottom:72px;padding:36px 28px;border-radius:36px;background:var(--clay-teal);color:#fff;text-align:center;box-shadow:inset 0 -12px 0 rgba(0,0,0,.18),inset 0 6px 0 rgba(255,255,255,.18),0 30px 40px -26px rgba(0,60,80,.8)}
  @media (max-width:560px){ .lop-hero .grid{grid-template-columns:1fr} .lop-hero .art{display:none} }
  @media print{ #clay-nav,#lop-actionbar,.lop-hero .art,.lop-cta{display:none!important} #lop-sections article{box-shadow:none;break-inside:avoid} }
</style>
<meta property="og:type" content="website">
<meta property="og:title" content="Kịch bản lớp học · BizOn Bật Nghiệp">
<meta property="og:description" content="Buổi 90 phút, giải đấu 15 tuần, sự kiện pitch xin vốn, rubric chấm điểm.">
<meta name="twitter:card" content="summary_large_image">
</head>
<body class="clay">

<main class="clay-main">
  <section class="lop-hero">
    <div class="sun" aria-hidden="true"></div>
    <div class="grid">
      <div style="padding-bottom:clamp(28px,5vw,64px)">
        <span class="clay-eyebrow" id="lop-eyebrow">Dành cho giảng viên</span>
        <h1 id="lop-h1">Kịch bản lớp học 40–60 sinh viên</h1>
        <p id="lop-lead" style="margin:18px 0 0;max-width:38em;font-size:17px;line-height:1.65;color:var(--clay-sub);text-wrap:pretty"></p>
      </div>
      <div class="art"><img src="assets/character/lumina-ao-dai-present.webp" alt="" loading="lazy"></div>
    </div>
    <div class="wave" aria-hidden="true"></div>
  </section>

  <section class="lop-actionbar" id="lop-actionbar">
    <div id="lop-actions"></div>
    <nav id="lop-toc" aria-label="Mục lục"></nav>
  </section>

  <section id="lop-sections" aria-live="polite"></section>

  <section class="lop-cta" id="lop-cta"></section>

  <noscript><p style="text-align:center;color:var(--clay-sub);margin:40px 0">Cần bật JavaScript để xem Kịch bản lớp học. · Enable JavaScript to view the classroom playbook.</p></noscript>
</main>

<script src="js/site-vnmap.js" defer></script>
<script src="js/bizon-clay-i18n.js" defer></script>
<script src="js/lop-hoc-data.js" defer></script>
<script src="js/lop-hoc-data-en.js" defer></script>
<script src="js/lop-hoc-clay.js" defer></script>
<script src="js/bizon-clay-nav.js" defer></script>
<script src="js/bizon-clay-footer.js" defer></script>
</body>
</html>
