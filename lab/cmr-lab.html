<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMR Lab</title>
<!-- Phông tự host (không Google Fonts CDN) để chạy offline & hợp CSP như phần còn lại của BizOn. Plus Jakarta Sans (chữ chính, đủ tiếng Việt), IBM Plex Mono (số/nhãn). -->
<!-- Phông tự host (không Google Fonts CDN) để chạy offline & hợp CSP như phần còn lại của BizOn. -->
<style>
@font-face{font-family:'Plus Jakarta Sans';font-weight:400 800;font-display:swap;src:url(../assets/fonts/PlusJakartaSans-var-vietnamese.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+1EA0-1EF9,U+20AB}
@font-face{font-family:'Plus Jakarta Sans';font-weight:400 800;font-display:swap;src:url(../assets/fonts/PlusJakartaSans-var-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:'JetBrains Mono';font-weight:400 500;font-display:swap;src:url(../assets/fonts/IBMPlexMono-400-vietnamese.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+1EA0-1EF9,U+20AB}
@font-face{font-family:'JetBrains Mono';font-weight:400 500;font-display:swap;src:url(../assets/fonts/IBMPlexMono-400-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2212}
:root{--ink:#1F2A44;--muted:#5F6675;--page:#F4F1EA;--canvas:#E4E0D6;--card:#FBF9F4;--field:#ECE7DC;--track:#E9E4D8;--locked:#ECE7DE;--burg:#8C2F39;--burg-d:#6B1F28;--burg-t:#F1E1E1;--gold:#C9A24A;--gold-d:#6E5520;--gold-t:#F3EAD3;--sage:#8FAF98;--sage-d:#3F6E52;--sage-t:#E3ECE4;--slate:#A9B4CF;--slate-d:#3E5C8A;--slate-t:#E4E8F1;--clay:0 12px 20px -14px rgba(31,42,68,.45),inset 0 -6px 10px rgba(0,0,0,.06),inset 0 4px 8px rgba(255,255,255,.8)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
.wrap{max-width:1280px;margin:0 auto;padding:28px 48px 40px}
.mono{font-family:'JetBrains Mono',monospace}
[hidden]{display:none!important}
/* nav */
.nav{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:999px;padding:10px 12px 10px 10px;box-shadow:var(--clay)}
.logo{width:46px;height:46px;border-radius:14px;background:var(--burg);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;box-shadow:inset 0 -5px 8px rgba(0,0,0,.25),0 8px 14px -8px rgba(31,42,68,.5)}
.nav .ttl{font-weight:800;font-size:17px;line-height:1.1}
.nav .sub{font-size:12px;color:var(--muted);font-weight:600}
.nav .back{margin-left:auto;font-weight:700;font-size:14px;color:var(--muted);text-decoration:none;padding:8px 12px}
.seg{display:flex;background:var(--field);border-radius:999px;padding:4px;box-shadow:inset 0 4px 10px rgba(31,42,68,.18)}
.seg button{padding:7px 12px;border-radius:999px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 4px 8px -3px rgba(31,42,68,.4)}
.xp-pill{display:flex;align-items:center;gap:8px;background:var(--gold);color:var(--gold-d);border-radius:999px;padding:8px 14px 8px 8px;font-weight:800;box-shadow:inset 0 -4px 6px rgba(110,85,30,.35),inset 0 3px 6px rgba(250,240,215,.9)}
.tbadge{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;box-shadow:inset 0 -3px 5px rgba(0,0,0,.2)}
/* hero */
.hero{display:grid;grid-template-columns:1fr 240px 460px;gap:28px;align-items:center;margin:28px 0 22px}
.eyebrow{display:inline-block;background:var(--card);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--burg);box-shadow:var(--clay)}
h1{font-size:64px;line-height:.95;margin:14px 0 14px;font-weight:800;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--burg);text-shadow:0 6px 0 var(--burg-d)}
.intro{font-size:17px;line-height:1.5;color:var(--muted);max-width:520px;margin:0}
.hero-dragon{width:240px;height:240px;object-fit:contain;mix-blend-mode:multiply}
.team-card{border-radius:36px;padding:24px;color:#fff;box-shadow:0 22px 30px -18px rgba(31,42,68,.55),inset 0 -8px 14px rgba(0,0,0,.2),inset 0 6px 10px rgba(255,255,255,.25);transition:background .3s}
.team-card .row{display:flex;align-items:center;gap:16px}
.lvl-coin{width:78px;height:78px;border-radius:50%;background:var(--gold);color:var(--gold-d);display:grid;place-items:center;align-content:center;text-align:center;box-shadow:inset 0 -8px 10px rgba(110,85,30,.35),inset 0 6px 8px rgba(250,240,215,.9),0 12px 16px -8px rgba(0,0,0,.4)}
.lvl-coin small{font-size:10px;font-weight:800;letter-spacing:.1em}
.lvl-coin b{font-size:30px;line-height:1}
.tc-name{font-size:14px;font-weight:800;letter-spacing:.08em;opacity:.9}
.tc-level{font-size:28px;font-weight:800}
.xp-bar{height:22px;border-radius:999px;background:rgba(0,0,0,.2);box-shadow:inset 0 4px 8px rgba(0,0,0,.3);margin:18px 0 6px;overflow:hidden}
.xp-bar i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .6s;box-shadow:inset 0 -3px 5px rgba(110,85,30,.4)}
.xp-txt{font-size:13px;font-weight:700;opacity:.9}
.badges{display:flex;gap:10px;margin-top:16px}
.bdg{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;transition:all .3s}
.bdg.on{background:var(--gold);color:var(--ink);box-shadow:0 8px 12px -5px rgba(0,0,0,.35),inset 0 -5px 8px rgba(110,85,30,.35),inset 0 5px 8px rgba(250,240,215,.9)}
.bdg.off{background:rgba(0,0,0,.14);color:rgba(255,255,255,.75);box-shadow:inset 0 4px 8px rgba(0,0,0,.2)}
/* cards */
.card{background:var(--card);border-radius:36px;padding:26px;box-shadow:var(--clay);margin-bottom:22px}
.card h2,.card h3{margin:0 0 6px;font-size:26px;font-weight:800}
.card .hint{font-size:13px;font-weight:600;color:var(--muted);margin:4px 0 0}
.step{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--burg)}
.teams{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;margin-top:18px}
.team-tile{height:104px;border-radius:24px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:0 14px 18px -12px rgba(31,42,68,.5),inset 0 -6px 10px rgba(0,0,0,.18),inset 0 4px 8px rgba(255,255,255,.3);transition:transform .2s}
.team-tile:hover{transform:translateY(-6px)}
.team-tile.on{outline:4px solid var(--ink);outline-offset:5px;transform:translateY(-6px)}
.team-tile b{font-size:22px;font-weight:800}
.team-tile span{font-size:12px;font-weight:700;opacity:.9}
.row2{display:grid;grid-template-columns:420px 1fr;gap:22px}
.row3{display:grid;grid-template-columns:1fr 440px;gap:22px}
label.f{display:block;font-size:14px;font-weight:800;margin:16px 0 6px}
.inp{width:100%;background:var(--field);border:0;border-radius:22px;padding:14px 18px;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:500;color:var(--ink);box-shadow:inset 0 4px 10px rgba(31,42,68,.18);outline:none}
.inp:focus{box-shadow:inset 0 4px 10px rgba(31,42,68,.18),0 0 0 3px rgba(140,47,57,.35)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:18px;background:var(--burg);color:#fff;border-radius:999px;padding:16px;font-weight:800;font-size:20px;box-shadow:0 14px 18px -10px rgba(107,31,40,.8),inset 0 -6px 10px rgba(0,0,0,.25),inset 0 4px 8px rgba(255,255,255,.2)}
.btn:active{transform:scale(.97)}
.tagp{display:inline-block;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:800;background:var(--gold);color:var(--ink);margin-top:10px}
.pocket-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.pocket{height:230px;background:var(--burg);border-radius:36px 36px 130px 130px/36px 36px 100px 100px;padding:18px;color:#fff;box-shadow:inset 0 -10px 16px rgba(0,0,0,.25),inset 0 8px 12px rgba(255,255,255,.12);display:flex;flex-wrap:wrap;align-content:flex-end;gap:6px;justify-content:center}
.tray{height:230px;background:var(--track);border-radius:30px;padding:18px;box-shadow:inset 0 4px 10px rgba(31,42,68,.18);display:flex;flex-wrap:wrap;align-content:flex-end;gap:6px;justify-content:center}
.coin{width:34px;height:34px;border-radius:50%;background:var(--gold);box-shadow:inset 0 -4px 6px rgba(110,85,30,.4),inset 0 3px 5px rgba(250,240,215,.9)}
.coin.g{background:#B9B5AC;box-shadow:inset 0 -4px 6px rgba(0,0,0,.15),inset 0 3px 5px rgba(255,255,255,.6)}
.pocket .cap,.tray .cap{width:100%;text-align:center;font-size:14px;font-weight:700}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.metric{border-radius:30px;padding:18px;box-shadow:var(--clay)}
.metric small{font-size:12px;font-weight:800;letter-spacing:.06em}
.metric b{display:block;font-size:40px;font-weight:800;line-height:1.05;margin-top:6px;font-family:'Plus Jakarta Sans',sans-serif}
.metric span{font-size:13px;font-weight:700;opacity:.8}
.gauge{margin-top:22px;position:relative;height:52px;border-radius:999px;overflow:hidden;background:var(--track);box-shadow:inset 0 4px 10px rgba(31,42,68,.18)}
.gauge .seg3{position:absolute;top:0;bottom:0}
.knob{position:absolute;top:-4px;width:52px;height:52px;border-radius:50%;background:var(--card);box-shadow:0 8px 14px -6px rgba(31,42,68,.6),inset 0 -5px 8px rgba(0,0,0,.1);transform:translateX(-50%);transition:left .6s}
.zone{font-size:16px;font-weight:800;margin-top:12px}
.glab{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted);margin-top:6px}
/* lenses */
.lenses{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.lens{border-radius:30px;padding:20px;min-height:240px;box-shadow:var(--clay);display:flex;flex-direction:column;gap:10px}
.lens .chip{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;box-shadow:inset 0 -4px 6px rgba(0,0,0,.2)}
.lens h4{margin:0;font-size:19px;font-weight:800}
.lens p{margin:0;font-size:15px;line-height:1.5;font-weight:600;color:var(--ink)}
.lens .tag{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
/* challenges */
.chal{border-radius:26px;padding:18px;background:var(--card);box-shadow:var(--clay);margin-top:14px}
.chal .q{font-weight:800;font-size:17px;line-height:1.35;margin:0 0 12px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{border-radius:20px;padding:12px 8px;font-weight:800;font-size:16px;box-shadow:inset 0 -4px 8px rgba(0,0,0,.08),inset 0 3px 6px rgba(255,255,255,.7)}
.opt:disabled{opacity:.8}
.ctag{display:inline-block;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;margin-bottom:8px}
/* leaderboard */
.board{background:var(--ink);color:#fff;border-radius:36px;padding:24px;box-shadow:var(--clay)}
.board h3{color:#fff}
.brow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:20px;margin-top:8px}
.rank{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:inset 0 -3px 5px rgba(0,0,0,.25)}
.bbar{height:10px;border-radius:999px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
.bbar i{display:block;height:100%;border-radius:999px;transition:width .6s}
.bname{font-weight:800;font-size:15px}
.bxp{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 18px;font-size:13px;color:var(--muted);font-weight:600;padding:12px 6px 0}
footer a{color:var(--muted);text-decoration:none;white-space:nowrap}
.tabbar{display:none}
/* modal & toast */
.scrim{position:fixed;inset:0;background:rgba(31,42,68,.5);display:grid;place-items:center;z-index:50;padding:20px}
.modal{width:440px;max-width:100%;background:var(--card);border-radius:44px;padding:40px 30px 28px;text-align:center;position:relative;box-shadow:0 30px 40px -20px rgba(31,42,68,.6)}
.modal img{width:220px;margin-top:-100px;object-fit:contain;mix-blend-mode:multiply}
.modal .lvlc{width:120px;height:120px;border-radius:50%;background:var(--gold);color:var(--gold-d);margin:-40px auto 0;display:grid;place-items:center;box-shadow:inset 0 -10px 14px rgba(110,85,30,.35),inset 0 8px 10px rgba(250,240,215,.9)}
.modal h3{font-size:36px;font-weight:800;margin:14px 0 4px}
.modal p{color:var(--muted);font-weight:600;margin:0 0 14px}
.modal .xpgain{display:inline-block;background:var(--burg);color:#fff;border-radius:999px;padding:8px 18px;font-weight:800;margin-bottom:18px}
.modal .btn{margin-top:4px}
.toast{position:fixed;top:20px;right:20px;background:var(--sage);color:var(--sage-d);border-radius:22px;padding:14px 20px;font-weight:800;z-index:60;box-shadow:0 14px 20px -10px rgba(31,42,68,.5)}
/* teacher */
.teacher{background:#1F2A44;color:#fff;min-height:100vh;padding:56px 64px;display:grid;grid-template-columns:1fr 560px;gap:40px}
.teacher h2{font-size:84px;font-weight:800;margin:6px 0 20px;line-height:.95}
.tstats{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:26px}
.tstat{background:rgba(255,255,255,.08);border-radius:30px;padding:22px;box-shadow:inset 0 4px 10px rgba(0,0,0,.3)}
.tstat small{font-size:13px;font-weight:800;letter-spacing:.08em;color:#C3C8D4}
.tstat b{display:block;font-size:56px;font-weight:800;line-height:1.05}
.chart{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;align-items:end;height:360px;background:rgba(255,255,255,.05);border-radius:36px;padding:26px 26px 14px}
.cbar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:8px}
.cbar .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px}
.cbar .fill{width:100%;border-radius:18px 18px 8px 8px;transition:height .6s;box-shadow:inset 0 -6px 10px rgba(0,0,0,.25),inset 0 4px 8px rgba(255,255,255,.2)}
.cbar .tn{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block}
.tcol{background:rgba(255,255,255,.06);border-radius:36px;padding:26px}
.tcol h3{font-size:24px;margin:0 0 12px}
.rel{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.08);border-radius:22px;padding:14px 18px;margin-bottom:10px;width:100%;font-weight:800;font-size:17px;color:#fff;text-align:left}
.track{width:64px;height:34px;border-radius:999px;background:#B9B5AC;padding:4px;display:flex;box-shadow:inset 0 3px 6px rgba(0,0,0,.25)}
.knob2{width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 3px 6px rgba(0,0,0,.3)}
.award{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.award button{border-radius:20px;padding:14px 8px;font-weight:800;color:#fff;box-shadow:inset 0 -5px 8px rgba(0,0,0,.2)}
.award button small{display:block;font-size:12px;font-weight:700;opacity:.9}
.reset{width:100%;margin-top:18px;border-radius:999px;padding:16px;background:transparent;border:2px solid rgba(255,255,255,.4);color:#fff;font-weight:800;font-size:17px}
.tlink{color:#C3C8D4;font-weight:700;font-size:14px;text-decoration:none}
/* responsive */
@media (max-width: 1100px){
  .hero{grid-template-columns:1fr 200px}
  .team-card{grid-column:1/-1}
  .row2,.row3{grid-template-columns:minmax(0,1fr)}
  .teams{grid-template-columns:repeat(4,1fr)}
  .lenses{grid-template-columns:repeat(2,1fr)}
  .teacher{grid-template-columns:1fr}
}
@media (max-width: 720px){
  .wrap{padding:16px 16px 110px}
  .nav .sub,.nav .back{display:none}
  .nav .ttl,.xp-pill{white-space:nowrap}
  .hero{grid-template-columns:1fr;gap:16px;margin:16px 0}
  .hero-dragon{display:none}
  h1{font-size:44px}
  .intro{font-size:15px}
  .teams{grid-template-columns:repeat(4,1fr);gap:10px}
  .team-tile{height:88px}
  .row2,.row3,.lenses{grid-template-columns:minmax(0,1fr);gap:14px}
  .inp{font-size:18px;padding:12px 14px}
  .wrap>*{min-width:0}
  .card,.team-card,.board{border-radius:28px;padding:20px}
  .pocket-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .metrics{grid-template-columns:minmax(0,1fr)}
  .pocket,.tray{height:180px}
  .metric b{font-size:30px}
  [data-tab]{display:none}
  [data-tab].on{display:block}
  .tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;background:var(--ink);border-radius:999px;padding:6px;gap:4px;z-index:40;box-shadow:0 12px 24px -10px rgba(0,0,0,.6)}
  .tabbar button{flex:1;min-height:48px;border-radius:999px;color:#C3C8D4;font-weight:800;font-size:14px}
  .tabbar button.on{background:var(--burg);color:#fff;box-shadow:inset 0 -4px 6px rgba(60,10,20,.3),inset 0 4px 6px rgba(240,205,205,.6)}
  .opt{min-height:44px}
  .teacher{padding:24px 16px}
  .teacher h2{font-size:48px}
  .chart{height:260px;gap:6px;padding:16px 10px}
  .tstat b{font-size:36px}
}
</style>
<script src="../js/capture-guard.js"></script>
</head>
<body>
<div class="wrap" id="student">
  <header class="nav">
    <div class="logo">B</div>
    <div>
      <div class="ttl">CMR Lab</div>
      <div class="sub">Workshop CM &amp; CMR</div>
    </div>
    <a class="back" id="clsLink" href="../lop-hoc.html"></a>
    <div class="seg" style="margin-left:auto">
      <button type="button" data-act="lang" data-v="vi">VI</button>
      <button type="button" data-act="lang" data-v="en">EN</button>
    </div>
    <div class="xp-pill"><span class="tbadge" id="navBadge"></span><span id="navXp"></span></div>
  </header>

  <section class="hero">
    <div>
      <span class="eyebrow" id="eyebrow">LAB · CM &amp; CMR</span>
      <h1><span id="hero1"></span><br><em id="hero2"></em></h1>
      <p class="intro" id="intro"></p>
    </div>
    <img class="hero-dragon" src="../assets/cmr-lab/dragon-wave.jpg" alt="">
    <div class="team-card" id="teamCard">
      <div class="row">
        <div class="lvl-coin"><small>LVL</small><b id="lvlNo">1</b></div>
        <div>
          <div class="tc-name" id="tcName"></div>
          <div class="tc-level" id="tcLevel"></div>
        </div>
      </div>
      <div class="xp-bar"><i id="xpFill" style="width:0%"></i></div>
      <div class="xp-txt" id="xpTxt"></div>
      <div class="badges" id="badges"></div>
    </div>
  </section>

  <section class="card" data-tab="0">
    <div class="step" id="pickStep"></div>
    <h2 id="pickTitle"></h2>
    <p class="hint" id="pickSub"></p>
    <div class="teams" id="teams"></div>
  </section>

  <div class="row2">
    <section class="card" data-tab="0">
      <div class="step" id="bizStep"></div>
      <h3 id="bizTitle"></h3>
      <label class="f" id="lName"></label><input class="inp" id="inName" type="text" style="font-size:18px">
      <label class="f" id="lP"></label><input class="inp" id="inP" inputmode="numeric">
      <div class="hint" id="hP"></div>
      <label class="f" id="lV"></label><input class="inp" id="inV" inputmode="numeric">
      <div class="hint" id="hV"></div>
      <label class="f" id="lFC"></label><input class="inp" id="inFC" inputmode="numeric">
      <div class="hint" id="hFC"></div>

<script>
const T = {
  en: { cls: '← Class script', hero1: 'Master the', hero2: 'Contribution Margin', intro: 'Pick your team, enter Price & Variable cost, and uncover the Contribution Margin story. Every discovery = XP.', xpp: 'Experience points', badges: 'Badges earned', pick: 'Pick your team', teamSub: 'Each team has its own progress, XP and badges.', biz: 'Business numbers', step: 'STEP', name: 'Business / Product name', price: 'Selling price P (₫/unit)', priceHint: 'e.g. 35,000₫ for one cup of coffee', vc: 'Variable cost v (₫/unit)', vcHint: 'Direct cost of one unit (ingredients, cup, straw)', fc: 'Fixed cost FC (₫/month)', fcHint: 'Rent, salaries, depreciation… (per month)', calc: 'Calculate & earn XP', vis: 'Contribution Margin — visualised', sell: 'Sell 1 unit =', coins: '= 10 coins', cmCap: 'CM → covers fixed cost, then profit', vCap: 'Variable cost — spent right away', ratios: 'Calculated ratios', unitCM: 'Unit CM', perUnit: '₫ / unit', perMonth: 'units / month', lev: 'Leverage position', levS: 'Leverage', safeL: 'SAFE (CMR <40%)', fragL: 'FRAGILE BALANCE (CMR >70%)', lenses: 'Four lenses', chal: 'Challenges', board: 'Class leaderboard', boardS: 'Leaderboard', uni: 'Universe →', unlocked: "You've unlocked a new level", cont: 'Continue', done: 'Completed!', priceS: 'Price P', vcS: 'Var. cost v', classView: 'CMR LAB · CLASS VIEW', race: 'Team race', total: 'Total XP', live: 'Challenges live', release: 'Release challenges', award: 'Award bonus XP', reset: 'Reset class', safe: 'Safe', frag: 'Fragile balance', bal: 'Balanced', unlock: 'Enter your numbers to unlock.', unl: 'UNLOCKED', lock: 'LOCKED', wait: 'Waiting for teacher', notq: 'Not quite', q1: 'Raise the selling price by 10%. What is the new BEP (units/month)?', q2: 'Variable cost rises by 3,000₫/unit. What is the new CMR?', q3: 'To earn 10,000,000₫ profit per month, how many units must you sell?', team: 'Team', tabs: ['Numbers', 'Lenses', 'Challenges', 'Ranking'], rel: ['Challenge 1 · Price +10%', 'Challenge 2 · v +3,000₫', 'Challenge 3 · Target profit'] },
  vi: { cls: '← Kịch bản lớp học', hero1: 'Làm chủ', hero2: 'Số dư đảm phí', intro: 'Chọn nhóm của bạn, nhập Giá bán & Biến phí, và khám phá câu chuyện Số dư đảm phí. Mỗi khám phá = XP.', xpp: 'Điểm kinh nghiệm', badges: 'Huy hiệu đạt được', pick: 'Chọn nhóm của bạn', teamSub: 'Mỗi nhóm có tiến độ, XP và huy hiệu riêng.', biz: 'Số liệu doanh nghiệp', step: 'BƯỚC', name: 'Tên DN / Sản phẩm', price: 'Giá bán P (đ/SP)', priceHint: 'VD: 35.000đ cho 1 ly cà phê', vc: 'Biến phí v (đ/SP)', vcHint: 'Chi phí trực tiếp 1 SP (nguyên liệu, ly, ống hút)', fc: 'Định phí FC (đ/tháng)', fcHint: 'Thuê, lương, khấu hao... (mỗi tháng)', calc: 'Tính toán & Nhận XP', vis: 'Số dư đảm phí — hình ảnh hóa', sell: 'Bán 1 SP =', coins: '= 10 xu', cmCap: 'CM → trả định phí, rồi tạo lãi', vCap: 'Biến phí — mất ngay', ratios: 'Chỉ số tính được', unitCM: 'CM đơn vị', perUnit: 'đ/SP', perMonth: 'SP/tháng', lev: 'Vị trí đòn bẩy', levS: 'Đòn bẩy', safeL: 'AN TOÀN (CMR <40%)', fragL: 'CÂN BẰNG MONG MANH (CMR >70%)', lenses: 'Bốn lăng kính', chal: 'Thử thách', board: 'Bảng xếp hạng lớp', boardS: 'Xếp hạng', uni: 'Vũ trụ →', unlocked: 'Bạn đã mở khóa cấp mới', cont: 'Tiếp tục', done: 'Hoàn thành!', priceS: 'Giá bán P', vcS: 'Biến phí v', classView: 'CMR LAB · MÀN HÌNH LỚP', race: 'Đua nhóm', total: 'Tổng XP', live: 'Thử thách đang mở', release: 'Mở thử thách', award: 'Thưởng XP', reset: 'Đặt lại lớp', safe: 'An toàn', frag: 'Cân bằng mong manh', bal: 'Cân bằng', unlock: 'Nhập số liệu để mở khóa.', unl: 'ĐÃ MỞ', lock: 'KHÓA', wait: 'Chờ giảng viên mở', notq: 'Chưa đúng', q1: 'Tăng giá bán 10%. BEP mới là bao nhiêu SP/tháng?', q2: 'Biến phí tăng thêm 3.000đ/SP. CMR mới là bao nhiêu?', q3: 'Muốn lãi 10.000.000đ/tháng, cần bán bao nhiêu SP?', team: 'Nhóm', tabs: ['Số liệu', 'Lăng kính', 'Thử thách', 'Xếp hạng'], rel: ['Thử thách 1 · Giá +10%', 'Thử thách 2 · v +3.000đ', 'Thử thách 3 · Lãi mục tiêu'] },
};


const COLORS = ['#8C2F39', '#A8703A', '#C9A24A', '#8FAF98', '#3E5C8A', '#5B6C9A', '#7E5E77', '#4E8A8C'];
const DARK = [false, false, true, true, false, false, false, false];
const START_XP = [60, 140, 95, 210, 30, 175, 120, 80];
const RELEASE_DEFAULT = [true, true, false];
const LEVELS = ['Apprentice', 'Analyst', 'Strategist', 'Master'];
const STORE = 'cmrlab-v3';

const DEFAULT_STATE = { team: 0, lang: 'en', name: 'Bizon Coffee', P: '35000', v: '12000', FC: '18000000', xp: START_XP.slice(), claimed: false, modal: false, toast: false, answers: {}, edited: false, tab: 0, released: RELEASE_DEFAULT.slice() };
let S = Object.assign({}, DEFAULT_STATE);
let toastTimer = null;
let view = 'student';

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (d) S = Object.assign({}, DEFAULT_STATE, d, { modal: false, toast: false });
  } catch (e) {}
}
function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify({ team: S.team, lang: S.lang, name: S.name, P: S.P, v: S.v, FC: S.FC, xp: S.xp, claimed: S.claimed, answers: S.answers, released: S.released, edited: S.edited }));
  } catch (e) {}
}
function num(s) { return Number(String(s).replace(/[^\d]/g, '')) || 0; }
function fmt(n) { return Math.round(n).toLocaleString(S.lang === 'vi' ? 'vi-VN' : 'en-US'); }
function no(i) { return String(i + 1).padStart(2, '0'); }
function fg(i) { return DARK[i] ? '#1F2A44' : '#fff'; }
function lvName(x) { return LEVELS[Math.min(3, Math.floor(x / 100))]; }
function $(id) { return document.getElementById(id); }
function addXp(i, n) { S.xp[i] += n; }

function calc() {
  const t = T[S.lang];
  const P = num(S.P), v = num(S.v), FC = num(S.FC);
  const ok = P > 0 && v >= 0 && v < P;
  const CM = ok ? P - v : 0, CMR = ok ? CM / P * 100 : 0, BEP = ok ? Math.ceil(FC / CM) : 0;
  return { t, P, v, FC, ok, CM, CMR, BEP };
}

function render() {
  if (view === 'teacher') { renderTeacher(); return; }
  const c = calc(), t = c.t, vi = S.lang === 'vi', f = fmt;
  const { P, v, FC, ok, CM, CMR, BEP } = c;
  const xp = S.xp[S.team], lvl = Math.floor(xp / 100), max = Math.max(...S.xp, 1);

  document.documentElement.lang = vi ? 'vi' : 'en';
  document.querySelectorAll('[data-act="lang"]').forEach(b => b.classList.toggle('on', b.dataset.v === S.lang));
  $('clsLink').textContent = t.cls;
  $('navBadge').textContent = no(S.team);
  $('navBadge').style.background = COLORS[S.team];
  $('navBadge').style.color = fg(S.team);
  $('navXp').textContent = xp + ' XP';
  $('eyebrow').textContent = 'LAB · CM & CMR';
  $('hero1').textContent = t.hero1;
  $('hero2').textContent = t.hero2;
  $('intro').textContent = t.intro;
  $('lvlNo').textContent = lvl + 1;
  $('tcName').textContent = t.team.toUpperCase() + ' ' + no(S.team);
  $('tcLevel').textContent = LEVELS[Math.min(3, lvl)];
  $('teamCard').style.background = COLORS[S.team];
  $('teamCard').style.color = fg(S.team);
  $('xpFill').style.width = (xp % 100) + '%';
  $('xpTxt').textContent = t.xpp + ': ' + xp + ' XP · ' + (xp % 100) + '/100';
  const earned = [S.claimed, S.claimed && ok, ok && S.claimed, Object.values(S.answers).filter(a => a === 0).length === 3];
  const bnames = [['CM', 'Found the contribution margin'], ['BEP', 'Calculated break-even point'], ['4L', 'Unlocked four lenses'], ['3C', 'Solved 3 challenges']];
  $('badges').innerHTML = bnames.map((b, i) => `<div class="bdg ${earned[i] ? 'on' : 'off'}" title="${b[1]}">${b[0]}</div>`).join('');

  $('pickStep').textContent = t.pick.toUpperCase();
  $('pickTitle').textContent = t.pick;
  $('pickSub').textContent = t.teamSub;
  $('teams').innerHTML = S.xp.map((x, i) => `<button type="button" class="team-tile ${i === S.team ? 'on' : ''}" data-act="team" data-i="${i}" style="background:${COLORS[i]};color:${fg(i)}"><b>${no(i)}</b><span>XP ${x}</span></button>`).join('');

  $('bizStep').textContent = t.step + ' 1';
  $('bizTitle').textContent = t.biz;
  $('lName').textContent = t.name;
  $('lP').textContent = t.price; $('hP').textContent = t.priceHint;
  $('lV').textContent = t.vc; $('hV').textContent = t.vcHint;
  $('lFC').textContent = t.fc; $('hFC').textContent = t.fcHint;
  setVal('inName', S.name); setVal('inP', S.P); setVal('inV', S.v); setVal('inFC', S.FC);
  $('calc').textContent = t.calc + '  ' + (S.claimed ? '✓' : '+50 XP');
  $('calc').disabled = S.claimed || !ok;
  $('calcTag').hidden = true;

  $('visStep').textContent = t.step + ' 2';
  $('visTitle').textContent = t.vis;
  $('sellNote').textContent = t.sell + ' ' + (ok ? f(P) : '?') + '₫ · ' + t.coins;
  const coinsCM = ok ? Math.max(1, Math.round(CMR / 10)) : 0;
  $('pocket').innerHTML = Array.from({ length: coinsCM }, () => '<span class="coin"></span>').join('') + `<div class="cap">${t.unitCM}: ${ok ? f(CM) : '—'}₫ · ${t.cmCap}</div>`;
  $('tray').innerHTML = Array.from({ length: ok ? 10 - coinsCM : 0 }, () => '<span class="coin g"></span>').join('') + `<div class="cap">${t.vcS}: ${ok ? f(v) : '—'}₫ · ${t.vCap}</div>`;
  const cmrTxt = ok ? CMR.toFixed(1).replace('.', vi ? ',' : '.') + '%' : '—';
  $('metrics').innerHTML = `
    <div class="metric" style="background:var(--sage-t);color:var(--sage-d)"><small>${t.unitCM}</small><b>${ok ? f(CM) : '—'}</b><span>${t.perUnit}</span></div>
    <div class="metric" style="background:var(--burg);color:#fff"><small>CMR</small><b>${cmrTxt}</b><span>${t.ratios}</span></div>
    <div class="metric" style="background:var(--slate-t);color:var(--slate-d)"><small>BEP</small><b>${ok ? f(BEP) : '—'}</b><span>${t.perMonth}</span></div>`;
  const zone = !ok ? ['—', '#5F6675'] : CMR < 40 ? [t.safe, '#3F6E52'] : CMR > 70 ? [t.frag, '#8C2F39'] : [t.bal, '#9A7A2E'];
  $('zoneTitle').innerHTML = `${t.lev} — <span style="color:${zone[1]}">${zone[0]}</span>`;
  $('knob').style.left = (ok ? Math.max(4, Math.min(96, CMR)) : 50) + '%';

  const levelsLenses = lensCopy(c, vi);
  const LS = [['#F1E1E1', '#8C2F39'], ['#F3EAD3', '#A8703A'], ['#E3ECE4', '#3F6E52'], ['#E4E8F1', '#5B6C9A']];
  $('lenses').innerHTML = levelsLenses.map((l, i) => `
    <div class="lens" style="background:${ok ? LS[i][0] : '#ECE7DE'}">
      <div class="chip" style="background:${ok ? LS[i][1] : '#B9B5AC'}">${i + 1}</div>
      <div class="tag">${ok ? t.unl : t.lock}</div>
      <h4>${l[0]}</h4>
      <p>${ok ? l[1] : t.unlock}</p>
    </div>`).join('');

  $('chalStep').textContent = t.step + ' 4';
  $('chalTitle').textContent = t.chal;
  $('chals').innerHTML = challengeCopy(c, vi).map((ch, ci) => {
    const a = S.answers[ci], done = a !== undefined, live = ok && S.released[ci];
    const tag = !S.released[ci] ? t.wait : !ok ? t.lock : done ? (a === 0 ? '+10 XP ✓' : t.notq) : '+10 XP';
    const tagBg = done ? (a === 0 ? '#3F6E52' : '#8C2F39') : !live ? '#B9B5AC' : '#C9A24A';
    const tagFg = done ? '#fff' : '#1F2A44';
    const opts = ch.order.map(oi => {
      const bg = done && oi === 0 ? '#8FAF98' : a === oi ? '#8C2F39' : '#ECE7DC';
      const col = a === oi && oi !== 0 ? '#fff' : '#1F2A44';
      const label = live ? ch.opts[oi] : '—';
      return `<button type="button" class="opt" style="background:${bg};color:${col};opacity:${S.released[ci] ? 1 : .55}" ${!live || done ? 'disabled' : ''} data-act="answer" data-ci="${ci}" data-oi="${oi}">${label}</button>`;
    }).join('');
    return `<div class="chal" style="opacity:${S.released[ci] ? 1 : .55}"><span class="ctag" style="background:${tagBg};color:${tagFg}">${tag}</span><p class="q">${ch.q}</p><div class="opts">${opts}</div></div>`;
  }).join('');

  $('boardStep').textContent = t.boardS.toUpperCase();
  $('boardTitle').textContent = t.board;
  $('boardRows').innerHTML = S.xp.map((x, i) => ({ i, x })).sort((a, b) => b.x - a.x).map((r, k) => `
    <div class="brow" style="background:${r.i === S.team ? 'rgba(255,255,255,.12)' : 'transparent'}">
      <div class="rank" style="background:${COLORS[r.i]};color:${fg(r.i)}">${k + 1}</div>
      <div><div class="bname">${t.team} ${no(r.i)} · ${lvName(r.x)}</div><div class="bbar"><i style="width:${r.x / max * 100}%;background:${COLORS[r.i]}"></i></div></div>
      <div class="bxp">${r.x} XP</div>
    </div>`).join('');

  $('uniLink').textContent = t.uni;
  $('uniLink').href = '../universe.html';

  const tabs = t.tabs;
  $('tabbar').innerHTML = tabs.map((l, i) => `<button type="button" class="${S.tab === i ? 'on' : ''}" data-act="tab" data-i="${i}">${l}</button>`).join('');
  document.querySelectorAll('#student [data-tab]').forEach(el => el.classList.toggle('on', Number(el.dataset.tab) === S.tab));
  $('tabbar').hidden = false;

  $('modal').hidden = !S.modal;
  $('mTitle').textContent = t.done;
  $('mText').textContent = t.unlocked;
  $('mCont').textContent = t.cont;
  $('toast').hidden = !S.toast;
  $('toast').textContent = t.done + ' +10 XP';
  save();
}

function setVal(id, val) {
  const el = $(id);
  if (document.activeElement !== el && el.value !== String(val)) el.value = val;
}

function lensCopy(c, vi) {
  const { CM, CMR, BEP, FC, P } = c, f = fmt;
  if (vi) return [
    ['Lăng kính Kế toán', `Mỗi SP bán ra đóng góp ${f(CM)}đ. ${CMR.toFixed(1)}% doanh thu dùng để trả định phí, phần còn lại là lãi.`],
    ['Lăng kính Kinh doanh', `Cần bán ${f(BEP)} SP/tháng — khoảng ${f(BEP / 30)} SP/ngày — để bù ${f(FC)}đ định phí.`],
    ['Lăng kính Rủi ro', CMR > 70 ? 'CMR cao: lãi tăng nhanh khi doanh số tăng và giảm cũng nhanh khi doanh số giảm. Đòn bẩy hoạt động mạnh.' : CMR < 40 ? 'CMR thấp: lợi nhuận ít nhạy với doanh số, nhưng cần sản lượng lớn để hòa vốn.' : 'CMR trung bình: cân bằng giữa tốc độ hòa vốn và độ nhạy với doanh số.'],
    ['Lăng kính Chiến lược', CMR >= 50 ? 'Ưu tiên tăng sản lượng: mỗi SP tăng thêm đóng góp lớn. Khuyến mãi theo số lượng có thể hiệu quả.' : 'Tăng giá hoặc giảm biến phí trước khi mở rộng quy mô.'],
  ];
  return [
    ['Accounting lens', `Each unit sold contributes ${f(CM)}₫. ${CMR.toFixed(1)}% of revenue goes toward fixed cost, then profit.`],
    ['Business lens', `You must sell ${f(BEP)} units/month — about ${f(BEP / 30)} per day — to cover ${f(FC)}₫ fixed cost.`],
    ['Risk lens', CMR > 70 ? 'High CMR: profit rises fast as sales grow, and falls just as fast when sales drop. Strong operating leverage.' : CMR < 40 ? 'Low CMR: profit is less sensitive to sales, but you need large volume to break even.' : 'Mid CMR: a balance between break-even speed and sensitivity to sales.'],
    ['Strategy lens', CMR >= 50 ? 'Push volume: every extra unit contributes a lot. Volume promotions can pay off.' : 'Raise price or cut variable cost before scaling up.'],
  ];
}

function challengeCopy(c, vi) {
  const { t, P, v, FC, ok, CM, CMR, BEP } = c, f = fmt;
  const bep2 = ok ? Math.ceil(FC / (P * 1.1 - v)) : 0, cmr3 = ok ? (P - v - 3000) / P * 100 : 0, q4 = ok ? Math.ceil((FC + 10000000) / CM) : 0;
  return [
    { q: t.q1, opts: [f(bep2), f(BEP * 0.9), f(BEP * 1.1)], order: [1, 0, 2] },
    { q: t.q2, opts: [cmr3, CMR - 3, CMR * 0.9].map(x => x.toFixed(1) + '%'), order: [2, 1, 0] },
    { q: t.q3, opts: [f(q4), f(BEP + 10000000 / P), f(10000000 / CM)], order: [0, 2, 1] },
  ];
}

function renderTeacher() {
  const t = T[S.lang], max = Math.max(...S.xp, 1);
  document.querySelectorAll('[data-act="lang"]').forEach(b => b.classList.toggle('on', b.dataset.v === S.lang));
  $('tClass').textContent = t.classView;
  $('tRace').textContent = t.race;
  $('tTotalL').textContent = t.total;
  $('tTotal').textContent = S.xp.reduce((a, b) => a + b, 0);
  $('tLiveL').textContent = t.live;
  $('tLive').textContent = S.released.filter(Boolean).length + '/3';
  $('chart').innerHTML = S.xp.map((x, i) => `
    <div class="cbar">
      <div class="v">${x} XP</div>
      <div class="fill" style="height:${Math.max(6, x / max * 100)}%;background:${COLORS[i]}"></div>
      <div class="tn"><span class="dot" style="background:${COLORS[i]}"></span>${t.team} ${no(i)}</div>
    </div>`).join('');
  $('tRel').textContent = t.release;
  $('relCtl').innerHTML = t.rel.map((l, i) => `
    <button type="button" class="rel" data-act="rel" data-i="${i}" style="background:rgba(255,255,255,.08)"><span>${l}</span>
      <span class="track" style="background:${S.released[i] ? '#8FAF98' : '#B9B5AC'};justify-content:${S.released[i] ? 'flex-end' : 'flex-start'}"><span class="knob2"></span></span></button>`).join('');
  $('tAward').textContent = t.award;
  $('awardCtl').innerHTML = S.xp.map((x, i) => `<button type="button" data-act="award" data-i="${i}" style="background:${COLORS[i]};color:${fg(i)}">${no(i)}<small>+10 XP</small></button>`).join('');
  $('tReset').textContent = t.reset;
  $('tBack').textContent = '← ' + (S.lang === 'vi' ? 'Quay lại màn hình sinh viên' : 'Back to student view');
  $('teacher').hidden = false;
  $('student').hidden = true;
  $('tabbar').hidden = true;
  $('modal').hidden = true;
  $('toast').hidden = true;
  save();
}

function applyView() {
  view = location.hash === '#teacher' ? 'teacher' : 'student';
  $('student').hidden = view === 'teacher';
  $('teacher').hidden = view !== 'teacher';
  render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  const act = el.dataset.act;
  if (act === 'lang') { S.lang = el.dataset.v; }
  else if (act === 'team') { const i = Number(el.dataset.i); S.team = i; S.claimed = false; S.answers = {}; }
  else if (act === 'tab') { S.tab = Number(el.dataset.i); }
  else if (act === 'calc') {
    const c = calc(); S.edited = true;
    if (!S.claimed && c.ok) { addXp(S.team, 50); S.claimed = true; S.modal = true; }
  }
  else if (act === 'answer') {
    const ci = Number(el.dataset.ci), oi = Number(el.dataset.oi);
    const c = calc();
    if (!c.ok || !S.released[ci] || S.answers[ci] !== undefined) return;
    S.answers = Object.assign({}, S.answers, { [ci]: oi });
    if (oi === 0) {
      addXp(S.team, 10); S.toast = true;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { S.toast = false; render(); }, 1800);
    }
  }
  else if (act === 'close') { S.modal = false; }
  else if (act === 'rel') { const i = Number(el.dataset.i); S.released = S.released.slice(); S.released[i] = !S.released[i]; }
  else if (act === 'award') { addXp(Number(el.dataset.i), 10); }
  else if (act === 'reset') { S.xp = START_XP.slice(); S.claimed = false; S.answers = {}; S.released = RELEASE_DEFAULT.slice(); }
  else if (act === 'student') { history.replaceState(null, '', location.pathname); applyView(); return; }
  else return;
  render();
});

['inName', 'inP', 'inV', 'inFC'].forEach(id => {
  $(id).addEventListener('input', e => {
    const key = { inName: 'name', inP: 'P', inV: 'v', inFC: 'FC' }[id];
    S[key] = e.target.value; S.edited = true;
    const c = calc();
    $('calc').disabled = S.claimed || !c.ok;
    render();
  });
});
window.addEventListener('hashchange', applyView);

load();
applyView();
</script>
</body>
</html>
