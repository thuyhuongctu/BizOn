.logo .sub{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.spacer{flex:1}

.muted{color:var(--muted)} .small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px} .grid2>*{min-width:0}

.prov::before{content:'';width:8px;height:8px;border-radius:50%}

  const pct = x => nf(x * 100) + '%';
  const money = x => nf(x, 2) + ' ' + t('bn');
  const fact = k => { const f = D.facts[k]; return f ? `${nm(f)} <span class="src">[${f.src}]</span>` : ''; };

  let ROLE = 'exporter', COHORT = '', GAME = null, DEC = null;
  const freshDec = () => ({ priority: 'area', linked: 0.3, induce: true, alloc: { CN: 40, BORDER: 30, FROZEN: 0, TW: 5, JP: 0, DOM: 25 }, intel: [], option: 0 });

  function chrome() {
    $('brandSub').textContent = t('brandSub'); $('backLink').textContent = t('back');
    const th = document.documentElement.getAttribute('data-theme');
    $('themeBtn').textContent = (th === 'dark' ? '☀️ ' + t('light') : '🌙 ' + t('dark'));
    $('langVI').classList.toggle('on', LANG === 'vi'); $('langEN').classList.toggle('on', LANG === 'en');
    document.documentElement.lang = LANG; $('footSrc').textContent = t('foot');
  }
  $('langVI').onclick = () => { LANG = 'vi'; store.set('durian_lang', 'vi'); render(); };
  $('langEN').onclick = () => { LANG = 'en'; store.set('durian_lang', 'en'); render(); };
  $('themeBtn').onclick = () => { const n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); store.set('durian_theme', n); render(); };

  function render() {
    chrome();
    if (!GAME) return renderSetup();
    if (GAME.n > D.seasons.length) return renderEnd();
    renderPlay();
  }

  function formulaHTML() {
    return Object.entries(D.scoreWeights).map(([k, w]) => `<b>${w}%</b> ${T[LANG].parts[k]}`).join(' + ');
  }

  // ---------- màn 1 ----------
  function renderSetup() {
    $('app').innerHTML = `
      <section class="hero"><span class="eyebrow">${t('eyebrow')}</span><h1>${t('title')}</h1><p class="lead">${t('lead')}</p>
        <span class="prov pub">${t('provFact')}</span><span class="prov sim">${t('provSim')}</span></section>
      <div class="card"><h2>${t('chooseRole')}</h2>
        <div class="pick">${Object.entries(D.roles).map(([id, r]) => `<button type="button" data-role="${id}" class="${id === ROLE ? 'on' : ''}"><b>${r.emoji} ${nm(r)}</b>
          <span class="small muted">${LANG === 'en' ? r.descEn : r.descVi}</span></button>`).join('')}</div>
        <p class="small" style="margin-top:8px">${t('formula')}: ${formulaHTML()}</p>
        <label class="ctl" for="cohort">${t('cohort')}</label><input type="text" id="cohort" maxlength="24" value="${esc(COHORT)}" autocomplete="off">
        <p class="hint">${t('cohortHint')}</p>
        <p style="margin-top:14px"><button class="btn" id="startBtn" type="button">${t('start')}</button></p>
      </div>`;
    document.querySelectorAll('[data-role]').forEach(b => b.onclick = () => { ROLE = b.dataset.role; COHORT = $('cohort').value; renderSetup(); });
    $('startBtn').onclick = () => {
      COHORT = $('cohort').value.trim();
      GAME = E.newGame(D, ROLE, COHORT ? E.seedFrom(COHORT + '|' + ROLE) : (Date.now() >>> 0));
      DEC = freshDec(); render(); window.scrollTo(0, 0);
    };
  }

  // ---------- màn 2 ----------
  function renderPlay() {
    const role = D.roles[GAME.roleId], s = D.seasons[GAME.n - 1], ev = E.eventFor(D, GAME);
    const last = GAME.history[GAME.history.length - 1];
    const sig = E.intelSignals(D, GAME, DEC.intel);
    const norm = E.normalizeAlloc(DEC.alloc, D.channels.map(c => c.id));
    const a = GAME.assets;
    const ok = id => E.eligible(D, GAME, D.channels.find(c => c.id === id));
    $('app').innerHTML = `
      <section class="hero" style="padding-bottom:6px"><span class="eyebrow">${role.emoji} ${nm(role)}</span>
        <h1 style="font-size:clamp(22px,3.6vw,30px)">${t('season')} ${GAME.n}${t('of')}${D.seasons.length} · ${s.label}</h1>
        <div class="prog">${D.seasons.map((_, i) => `<span class="${i + 1 < GAME.n ? 'done' : i + 1 === GAME.n ? 'now' : ''}"></span>`).join('')}</div></section>
      <div class="grid2">
        <div class="card event"><span class="tag">${t('anchor')}</span><h2>${nm(s)}</h2><p>${LANG === 'en' ? s.textEn : s.textVi}</p>
          <p class="hint" style="margin-top:6px">${fact(s.anchor)}</p></div>
        ${ev ? `<div class="card event"><span class="tag">${t('event')}</span><h2>${nm(ev)}</h2><p>${LANG === 'en' ? ev.textEn : ev.textVi}</p>
          <p class="hint">${fact(ev.src)}</p><h3>${t('chooseOpt')}</h3>
          ${ev.options.map((o, i) => `<button type="button" class="opt ${DEC.option === i ? 'on' : ''}" data-opt="${i}">${nm(o)}</button>`).join('')}</div>` : '<div></div>'}
      </div>
      <div class="card"><h2>${t('assets')}</h2>
        <div class="chips">${Object.keys(T[LANG].have).map(k => `<span class="chip ${(k === 'test' ? a.test > 0 : a[k]) ? 'on' : ''}">${(k === 'test' ? a.test > 0 : a[k]) ? '✓' : '○'} ${T[LANG].have[k]}${k === 'test' && a.test ? ' ×' + a.test : ''}</span>`).join('')}</div>
        ${GAME.suspendedUntil >= GAME.n ? `<p class="note">${t('suspended')}</p>` : ''}
        <div class="kpis" style="margin-top:8px">
          <div class="kpi"><small>${t('cash')}</small><b class="num ${GAME.cash >= 0 ? 'pos' : 'neg'}">${money(GAME.cash)}</b></div>
          <div class="kpi"><small>${t('rep')}</small><b class="num">${nf(GAME.rep)}</b></div>
          <div class="kpi"><small>${t('adapt')}</small><b class="num">${nf(GAME.adapt)}</b></div>
          <div class="kpi"><small>${role.ownFarm ? t('tree') : t('sus')}</small><b class="num">${nf(role.ownFarm ? GAME.treeHealth : GAME.sus)}</b></div></div></div>
      <div class="grid2">
        <div class="card"><h2>${t('intel')}</h2>
          <div class="chips">${D.intel.map(i => `<button type="button" class="chip ${DEC.intel.includes(i.id) ? 'on' : ''}" data-intel="${i.id}" ${!DEC.intel.includes(i.id) && DEC.intel.length >= 2 ? 'disabled' : ''}>${nm(i)} · ${i.cost ? money(i.cost) : t('free')}</button>`).join('')}</div>
          ${sig.map(x => { const src = D.intel.find(i => i.id === x.id); return `<p class="small">• <b>${nm(src)}</b>: ${t('priceSig')} ≈ <b class="num">${nf(x.price)}</b> ${LANG === 'en' ? 'VND k/kg' : 'nghìn đ/kg'}${x.risk !== undefined ? ` · ${t('riskSig')}: <b>${T[LANG].riskLv[x.risk]}</b>` : ''}${src.warnVi ? ` <span class="hint">(${LANG === 'en' ? src.warnEn : src.warnVi})</span>` : ''}</p>`; }).join('')}
          <h2 style="margin-top:14px">${t('decide')}</h2>
          <label class="ctl">${t('priority')}</label>
          ${D.priorities.map(p => { const owned = (p.id === 'area' && a.area) || (p.id === 'pack' && a.pack) || (p.id === 'trace' && a.trace) || (p.id === 'freezer' && a.freezer) || (p.id === 'test' && a.test >= 2);
            return `<button type="button" class="opt ${DEC.priority === p.id ? 'on' : ''}" data-pri="${p.id}" ${owned ? 'disabled style="opacity:.5"' : ''}><b>${nm(p)}</b> · <span class="num">${D.params.priorityCost[p.id] ? money(D.params.priorityCost[p.id]) : '0'}</span><br><span class="hint">${LANG === 'en' ? p.effEn : p.effVi}</span></button>`; }).join('')}
          ${role.ownFarm ? (s.season === 'off' ? `<label class="ctl">${t('induce')}</label>
            <button type="button" class="opt ${DEC.induce ? 'on' : ''}" data-ind="1">${t('induce')}</button><button type="button" class="opt ${!DEC.induce ? 'on' : ''}" data-ind="0">${t('noInduce')}</button><p class="hint">${t('induceHint')} [CAILAY, BC0224]</p>` : '')
            : `<label class="ctl" for="linked">${t('linked')}: <span class="num" id="linkedV">${pct(DEC.linked)}</span></label>
            <input type="range" id="linked" min="0" max="100" step="10" value="${Math.round(DEC.linked * 100)}"><p class="hint">${t('linkedHint')} ${fact('traders80')}</p>`}
        </div>
        <div class="card"><h2>${t('channels')}</h2>
          ${D.channels.map(c => { const e = ok(c.id); const cap = c.cap === null ? '' : `${t('cap')} ${nf(c.id === 'BORDER' ? c.cap * (1 - (s.borderCut || 0)) : c.cap)} ${t('tons')}`;
            return `<div class="mrow"><span>${c.emoji} ${nm(c)}<br><span class="hint">${e ? cap : `<span class="lock">🔒 ${t('locked')}: ${c.needs.map(k => T[LANG].needs[k]).join(', ')}</span>`}</span></span>
            <input type="range" data-ch="${c.id}" min="0" max="100" step="5" value="${DEC.alloc[c.id] || 0}" ${e ? '' : 'disabled'}><span class="num" id="pct-${c.id}">${e ? pct(norm[c.id]) : '—'}</span></div>`; }).join('')}
          <p class="hint">${fact('sampling')}</p>
          <p style="margin-top:14px"><button class="btn" id="commitBtn" type="button">${t('commit')} ${GAME.n} →</button></p>
        </div>
      </div>
      ${last ? `<div class="card">${resultsHTML(last)}</div>` : ''}`;
    document.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => { DEC.option = +b.dataset.opt; renderPlay(); });
    document.querySelectorAll('[data-intel]').forEach(b => b.onclick = () => {
      const id = b.dataset.intel; DEC.intel = DEC.intel.includes(id) ? DEC.intel.filter(x => x !== id) : DEC.intel.concat([id]).slice(0, 2); renderPlay();
    });
    document.querySelectorAll('[data-pri]').forEach(b => b.onclick = () => { DEC.priority = b.dataset.pri; renderPlay(); });
    document.querySelectorAll('[data-ind]').forEach(b => b.onclick = () => { DEC.induce = b.dataset.ind === '1'; renderPlay(); });
    if ($('linked')) $('linked').oninput = e => { DEC.linked = +e.target.value / 100; $('linkedV').textContent = pct(DEC.linked); };
    document.querySelectorAll('[data-ch]').forEach(r => r.oninput = () => {
      DEC.alloc[r.dataset.ch] = +r.value;
      const ids = D.channels.map(c => c.id).filter(ok), n2 = E.normalizeAlloc(DEC.alloc, ids);
      ids.forEach(id => { $('pct-' + id).textContent = pct(n2[id]); });
    });
    $('commitBtn').onclick = () => {
      GAME = E.playSeason(D, GAME, JSON.parse(JSON.stringify(DEC)));
      const keepAlloc = DEC.alloc, keepLinked = DEC.linked;
      DEC = freshDec(); DEC.alloc = keepAlloc; DEC.linked = keepLinked;
      const nextOwned = GAME.assets;
      const firstFree = D.priorities.find(p => !((p.id === 'area' && nextOwned.area) || (p.id === 'pack' && nextOwned.pack) || (p.id === 'trace' && nextOwned.trace) || (p.id === 'freezer' && nextOwned.freezer) || (p.id === 'test' && nextOwned.test >= 2)));
      DEC.priority = firstFree ? firstFree.id : 'finance';
      render(); window.scrollTo(0, 0);
    };
  }

  function resultsHTML(r) {
    return `<h2>${t('results')} ${r.n}</h2>
      <div class="kpis">
        <div class="kpi"><small>${t('revenue')}</small><b class="num">${money(r.revenue)}</b></div>
        <div class="kpi"><small>${t('purchase')}</small><b class="num">${money(r.purchase)}</b></div>
        <div class="kpi"><small>${t('loss')}</small><b class="num">${pct(r.loss)}</b></div>
        <div class="kpi"><small>${t('profit')}</small><b class="num ${r.profit >= 0 ? 'pos' : 'neg'}">${money(r.profit)}</b></div></div>
      <div class="tblwrap" style="margin-top:10px"><table><tr><th>${t('channel')}</th><th>${t('qty')}</th><th>${t('price')}</th><th>${t('revenue')}</th><th>${t('status')}</th></tr>
        ${r.byChannel.filter(c => c.qty > 0.5).map(c => { const ch = D.channels.find(x => x.id === c.id); return `<tr><td>${ch.emoji} ${nm(ch)}</td><td class="num">${nf(c.qty)}</td><td class="num">${nf(c.price)}</td><td class="num">${money(c.revenue)}</td><td class="${c.status === 'ok' ? 'ok' : 'bad'}">${T[LANG].st[c.status]}</td></tr>`; }).join('')}
      </table></div>
      ${r.audit ? `<p class="note">${T[LANG].audit[r.audit]}</p>` : ''}
      ${r.notes.map(n => `<p class="note">${T[LANG].notes[n]}</p>`).join('')}`;
  }

  // ---------- màn 3 ----------
  function renderEnd() {
    const role = D.roles[GAME.roleId], S = E.summary(D, GAME);
    const B = T[LANG].badges;
    const used = new Set();
    GAME.history.forEach(r => { [r.eventId, D.seasons[r.n - 1].anchor].forEach(k => { const f = D.facts[k] || D.facts[(D.events.find(e => e.id === k) || {}).src]; if (f) used.add(f.src); }); });
    ['PROTO', 'KQTC', 'CAILAY', 'BC0224'].forEach(k => used.add(k));
    $('app').innerHTML = `
      <section class="hero"><span class="eyebrow">${role.emoji} ${nm(role)}</span><h1>${t('endTitle')}</h1></section>
      <div class="grid2">
        <div class="card"><div class="kpis" style="grid-template-columns:1fr 1fr">
          <div class="kpi"><small>${t('total')}</small><b class="num">${nf(S.total)}/100</b></div>
          <div class="kpi"><small>${t('totalProfit')}</small><b class="num ${S.profit >= 0 ? 'pos' : 'neg'}">${money(S.profit)}</b><small>${t('bench')}: ${money(S.bench)}</small></div></div>
          <h3>${t('formula')}</h3>
          ${Object.keys(D.scoreWeights).map(k => `<div class="srow"><span>${T[LANG].parts[k]} (${D.scoreWeights[k]}%)</span><div class="bar"><i style="width:${S.parts[k]}%"></i></div><span class="num">${nf(S.parts[k])}</span></div>`).join('')}
          <p style="margin-top:10px">${S.badges.map(b => `<span class="badge">${B[b]}</span>`).join('')}</p>
          <p class="small muted">${t('chUsed')}: ${S.channelsUsed.map(id => nm(D.channels.find(c => c.id === id))).join(', ')}</p></div>
        <div class="card"><h3>${t('debrief')}</h3><ol class="qa small"><li>${t('q1')}</li><li>${t('q2')}</li><li>${t('q3')}</li><li>${t('q4')}</li></ol>
          <p class="hint">${fact('share57')}</p><p class="hint">${fact('china92')}</p></div>
      </div>
      <div class="card"><h3>${t('sources')}</h3><ul class="qa small">${[...used].map(k => `<li><b>[${k}]</b> ${esc(D.sources[k])}</li>`).join('')}</ul></div>
      <p><button class="btn" id="dlBtn" type="button">${t('download')}</button> <button class="btn ghost" id="againBtn" type="button">${t('again')}</button></p>`;
    $('dlBtn').onclick = () => {
      const blob = new Blob([JSON.stringify({ game: 'ho-chieu-sau-rieng', role: GAME.roleId, summary: S, log: E.decisionLog(GAME, { cohort: COHORT || 'local' }) }, null, 2)], { type: 'application/json' });
      const el = document.createElement('a'); el.href = URL.createObjectURL(blob); el.download = 'ho-chieu-sau-rieng-nhat-ky.json'; el.click(); URL.revokeObjectURL(el.href);
    };
    $('againBtn').onclick = () => { GAME = null; render(); window.scrollTo(0, 0); };
  }

  document.documentElement.setAttribute('data-theme', store.get('durian_theme') === 'light' ? 'light' : 'dark');
  render();
})();
</script>
</body>
</html>
