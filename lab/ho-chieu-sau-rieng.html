<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hộ Chiếu Sầu Riêng · Bản lớp học</title>
<link rel="icon" href="../assets/brand/bizon-favicon.svg" type="image/svg+xml">
<meta name="description" content="Hộ Chiếu Sầu Riêng – bản lớp học: đội 5 vai (CEO, CMO, COO, CFO, SEC) điều hành chuỗi xuất khẩu sầu riêng Việt Nam qua 6 vụ, cạnh tranh với 3 đối thủ AI, mô phỏng «Nếu – Thì», hỏi Lumina, phiếu quyết định, nhật ký SEC và nhật ký sự kiện cho nghiên cứu.">
<style>
@font-face{font-family:'Plus Jakarta Sans';font-weight:400 800;font-display:swap;src:url(../assets/fonts/PlusJakartaSans-var-vietnamese.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+1EA0-1EF9,U+20AB}
@font-face{font-family:'Plus Jakarta Sans';font-weight:400 800;font-display:swap;src:url(../assets/fonts/PlusJakartaSans-var-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:'JetBrains Mono';font-weight:400 500;font-display:swap;src:url(../assets/fonts/IBMPlexMono-400-vietnamese.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+1EA0-1EF9,U+20AB}
@font-face{font-family:'JetBrains Mono';font-weight:400 500;font-display:swap;src:url(../assets/fonts/IBMPlexMono-400-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2212}
:root{--bg:#0B1220;--panel:#111F38;--panel2:#0E1B31;--grid:rgba(99,179,237,.08);--ink:#E7EEF8;--muted:#93A4BD;--faint:#6B7C97;--line:#22324A;--line2:#2C3F5C;
  --accent:#84CC16;--accent2:#EAB308;--warn:#F59E0B;--neg:#F97316;--imp:#A78BFA;--shadow:0 10px 30px rgba(0,0,0,.35);--radius:16px}
html[data-theme="light"]{--bg:#EEF3FA;--panel:#FFFFFF;--panel2:#F5F8FD;--grid:rgba(30,64,120,.07);--ink:#0F1A2E;--muted:#52617B;--faint:#8392AB;--line:#DDE7F3;--line2:#CBD8EA;
  --accent:#4D7C0F;--accent2:#A16207;--warn:#B45309;--neg:#C2410C;--imp:#7C3AED;--shadow:0 12px 30px rgba(20,40,80,.10)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
.mono,.num{font-family:'JetBrains Mono',monospace}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 56px}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.logo .mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:17px}
.logo .sub{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.spacer{flex:1}
.tbtn{border:1px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:10px;padding:7px 11px;font-weight:600;font-size:12.5px;font-family:inherit;cursor:pointer;text-decoration:none}
.lang-pill{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--panel)}
.lang-pill button{border:0;background:transparent;color:var(--muted);padding:7px 11px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit}
.lang-pill button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.hero{padding:28px 0 14px}
.eyebrow{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
h1{font-size:clamp(26px,4.4vw,38px);line-height:1.15;margin:10px 0}
.lead{color:var(--muted);max-width:800px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card h2{font-size:18px;margin-bottom:6px} .card h3{font-size:15px;margin:12px 0 6px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px} .grid2>*{min-width:0}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.prov{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;border:1px solid var(--line2);color:var(--muted);margin:4px 6px 8px 0}
.prov::before{content:'';width:8px;height:8px;border-radius:50%}
.prov.sim::before{background:var(--warn)} .prov.pub::before{background:var(--accent2)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
@media (max-width:640px){.pick{grid-template-columns:1fr}}
.pick button{text-align:left;border:2px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:14px;padding:14px;font-family:inherit;cursor:pointer}
.pick button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel2))}
.pick b{display:block;font-size:15px;margin-bottom:4px}
label.ctl{display:block;margin:12px 0 2px;font-weight:700;font-size:13px}
input[type=range]{width:100%} input[type=text],select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:7px 9px;max-width:100%}
.btn{border:0;border-radius:11px;padding:10px 16px;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line2)}
.event{border-left:4px solid var(--warn)}
.event .tag{font-size:12px;font-weight:700;color:var(--warn)}
.prog{display:flex;gap:4px;margin:6px 0 12px}
.prog span{flex:1;height:6px;border-radius:4px;background:var(--line2)} .prog span.done{background:var(--accent2)} .prog span.now{background:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:640px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi small{display:block;color:var(--muted);font-size:11.5px} .kpi b{font-size:19px}
.pos{color:var(--accent2)} .neg{color:var(--neg)}
.mrow{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.mrow .num{text-align:right}
.hint{font-size:11.5px;color:var(--muted)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-size:12px}
.note{border-left:3px solid var(--warn);padding:8px 12px;background:var(--panel2);border-radius:8px;font-size:13px;margin-top:10px}
.badge{display:inline-block;border-radius:999px;padding:4px 10px;margin:3px 6px 3px 0;font-size:12.5px;font-weight:700;background:color-mix(in srgb,var(--accent) 16%,var(--panel2));border:1px solid var(--line2)}
.qa li{margin:6px 0 6px 18px}
footer{color:var(--faint);font-size:12px;text-align:center;margin-top:24px}
[hidden]{display:none!important}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:12px;padding:10px 12px;margin:6px 0;font-family:inherit;cursor:pointer}
.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel2))}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--panel2));font-weight:700}
.chip[disabled]{opacity:.45;cursor:not-allowed}
.src{font-size:11px;color:var(--faint)}
.lock{color:var(--faint);font-size:11.5px}
.bar{height:8px;border-radius:5px;background:var(--line2);overflow:hidden} .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.srow{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.ok{color:var(--accent2)} .bad{color:var(--neg)}
/* ---- Bản lớp học ---- */
.hero-row{display:grid;grid-template-columns:1fr 220px;gap:18px;align-items:end}
@media (max-width:760px){.hero-row{grid-template-columns:1fr}.hero-row .hero-cast{display:none}}
.hero-cast{display:flex;align-items:flex-end;justify-content:center;gap:0}
.hero-cast img{height:190px;width:auto;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.hero-cast img+img{margin-left:-46px;height:170px}
.cast{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:760px){.cast{grid-template-columns:repeat(2,1fr)}}
.cast .who,.rv{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;min-width:0}
.cast .who img,.rv img{width:100%;height:110px;object-fit:contain}
.cast .who b,.rv b{display:block;font-size:13.5px;margin-top:4px}
.rvs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.rvs{grid-template-columns:1fr}}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px;padding:0;list-style:none}
.flow li{font-size:12px;border:1px solid var(--line2);border-radius:999px;padding:4px 10px;color:var(--muted);background:var(--panel2)}
.flow li b{color:var(--accent);margin-right:4px}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.flags span{font-size:12px;border-radius:10px;padding:4px 8px;border:1px solid var(--line2);background:var(--panel2)}
.flags span.win{border-color:var(--accent2)} .flags span.lose{border-color:var(--neg)} .flags span.now{border-color:var(--accent);font-weight:800}
.ops{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.timer{font-family:'JetBrains Mono',monospace;font-weight:700;border:1px solid var(--line2);border-radius:10px;padding:4px 10px;background:var(--panel2)}
.timer.late{color:var(--neg);border-color:var(--neg)}
.advice{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:760px){.advice{grid-template-columns:1fr}}
.adv{display:grid;grid-template-columns:64px 1fr;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;align-items:start}
.adv img{width:64px;height:64px;object-fit:contain}
.adv p{font-size:13px;margin:2px 0 6px}
.mini{border:1px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:10px;padding:5px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.mini[disabled]{opacity:.45;cursor:not-allowed}
.lumina{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
@media (max-width:640px){.lumina{grid-template-columns:1fr}.lumina>img{display:none}}
.lumina>img{width:120px;height:auto}
.bubble{background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:13px}
.bubble .q{font-weight:700;margin-bottom:4px}
.bubble .ask{color:var(--accent);font-style:italic;margin-top:6px}
textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;width:100%;min-height:58px;resize:vertical}
.sheet label.ctl{margin-top:10px}
.req::after{content:' *';color:var(--neg)}
.radios{display:flex;flex-wrap:wrap;gap:6px}
.wf{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0}
@media (max-width:760px){.wf{grid-template-columns:repeat(2,1fr)}}
.err{color:var(--neg);font-size:12.5px;font-weight:700;margin-top:6px}
.arena .arow{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.arena .arow .bar i.me{background:linear-gradient(90deg,var(--accent2),var(--accent))}
.arena .arow .bar i.ai{background:var(--faint)}
.lb td img{width:34px;height:34px;object-fit:contain;vertical-align:middle;margin-right:6px}
details.gv{margin-top:10px} details.gv summary{cursor:pointer;font-weight:700;font-size:13px}
.music{min-width:38px}
</style>

<body>
<div class="topbar"><div class="topbar-in">
  <div class="logo"><span class="mark">🌳</span><span><span id="brandName">Hộ Chiếu Sầu Riêng</span><span class="sub" id="brandSub"></span></span></div>
  <div class="spacer"></div>
  <button class="tbtn music" id="musicBtn" type="button" aria-pressed="false">♪</button>
  <a class="tbtn" href="../lop-hoc.html" id="backLink"></a>
  <div class="lang-pill"><button id="langVI" class="on" type="button">VI</button><button id="langEN" type="button">EN</button></div>
  <button class="tbtn" id="themeBtn" type="button"></button>
</div></div>

<main class="wrap" id="app"></main>
<audio id="bgm" src="../assets/audio/and-the-world-say-hello.mp3" preload="none" loop></audio>

<footer class="wrap">
  <p>© 2026 PGS.TS. Phan Anh Tú &amp; NCS. Đỗ Thùy Hương · Trường Kinh tế, Đại học Cần Thơ</p>
  <p id="footSrc"></p>
</footer>

<script src="ho-chieu-sau-rieng-engine.js"></script>
<script src="ho-chieu-sau-rieng-data.js"></script>
<script>
(function () {
  'use strict';
  const E = window.DurianEngine, D = window.DurianData;
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const IMG = p => '../assets/character/' + p;
  const SAVE_KEY = 'durian_class_v2';
  const MAX_WHATIF = 2, MAX_LUMINA = 3;

  let LANG = store.get('durian_lang') === 'en' ? 'en' : 'vi';
  const L = (vi, en) => (LANG === 'en' ? en : vi);
  const nm = o => (LANG === 'en' ? o.en : o.vi);
  const nf = (x, d) => (Number.isFinite(x) ? x : 0).toLocaleString(LANG === 'vi' ? 'vi-VN' : 'en-US', { maximumFractionDigits: d || 0, minimumFractionDigits: d || 0 });
  const pct = x => nf(x * 100) + '%';
  const money = x => nf(x, 2) + ' ' + L('tỷ', 'bn');
  const fact = k => { const f = D.facts[k]; return f ? `${nm(f)} <span class="src">[${f.src}]</span>` : ''; };
  const CH_IDS = D.channels.map(c => c.id);

  // ---------------- trạng thái ván (lưu cục bộ để học qua nhiều buổi) ----------------
  let APP = null;        // { cls, team, roleId, seed, timerMin, game, dec, operator, session, roundStart, events[], whatifs{}, lumina{}, sheets{}, journals{}, debriefs{}, flags[] }
  let RIVALS = null;     // tính lại từ hạt giống, không cần lưu
  let SETUP = { cls: '', team: '', roleId: 'exporter', timerMin: 0 };
  let ERR = '';

  const freshDec = () => ({ priority: 'area', linked: 0.3, induce: true, alloc: { CN: 40, BORDER: 30, FROZEN: 0, TW: 5, JP: 0, DOM: 25 }, intel: [], option: 0 });
  const owned = (a, id) => (id === 'area' && a.area) || (id === 'pack' && a.pack) || (id === 'trace' && a.trace) || (id === 'freezer' && a.freezer) || (id === 'test' && a.test >= 2);
  const save = () => { if (APP) store.set(SAVE_KEY, JSON.stringify(APP)); };
  const roundN = () => APP.game.n;                         // vụ đang quyết định
  const pendingJournal = () => APP.game.history.length > 0 && !APP.journals[APP.game.history.length];

  function logEv(type, oldV, newV, committed) {
    if (!APP) return;
    const round = pendingJournal() ? APP.game.history.length : Math.min(APP.game.n, D.seasons.length);
    APP.events.push({
      event_id: 'EV' + String(APP.events.length + 1).padStart(6, '0'),
      timestamp: new Date().toISOString(), class_id: APP.cls || 'local', team_id: APP.team || 'TEAM',
      round_id: 'R' + round, role: (APP.operator || 'ceo').toUpperCase(), event_type: type,
      old_value: oldV === undefined ? '' : (typeof oldV === 'object' ? JSON.stringify(oldV) : String(oldV)),
      new_value: newV === undefined ? '' : (typeof newV === 'object' ? JSON.stringify(newV) : String(newV)),
      device_session: APP.session, committed: committed ? 1 : 0
    });
  }

  function load() {
    const raw = store.get(SAVE_KEY);
    if (!raw) return null;
    try { const x = JSON.parse(raw); return x && x.game && x.roleId ? x : null; } catch (e) { return null; }
  }
  function boot(app) {
    APP = app;
    RIVALS = E.rivalsRun(D, APP.roleId, APP.seed);
  }

  // ---------------- khung chung ----------------
  function chrome() {
    $('brandName').textContent = L('Hộ Chiếu Sầu Riêng', 'Sầu Riêng Passport');
    document.title = L('Hộ Chiếu Sầu Riêng · Bản lớp học', 'Sầu Riêng Passport (Durian) · Classroom edition');
    $('brandSub').textContent = L('Bản lớp học · mô phỏng xuất khẩu nông sản', 'Classroom edition · agri-food export simulation');
    $('backLink').textContent = L('← Kịch bản lớp học', '← Classroom script');
    const th = document.documentElement.getAttribute('data-theme');
    $('themeBtn').textContent = th === 'dark' ? '☀️ ' + L('Sáng', 'Light') : '🌙 ' + L('Tối', 'Dark');
    $('langVI').classList.toggle('on', LANG === 'vi'); $('langEN').classList.toggle('on', LANG === 'en');
    $('musicBtn').title = L('Nhạc nền «And The World Say Hello!» (kho nhạc BizOn)', 'Background music «And The World Say Hello!» (BizOn library)');
    document.documentElement.lang = LANG;
    $('footSrc').textContent = L(
      'Quy định và sự kiện lấy từ Nghị định thư kiểm dịch MARD–GACC (2022), báo cáo thị trường rau quả của Bộ Công Thương (12/2023–02/2024), kết quả tra cứu của CESTI (04/2024) và các nghiên cứu chuỗi cung ứng tại Cai Lậy, Phong Điền, Thái Lan, Malaysia. Khối lượng, hệ số giá, xác suất và chiến lược của đối thủ AI là minh họa.',
      'Rules and events come from the MARD–GACC phytosanitary protocol (2022), Ministry of Industry and Trade fruit market reports (Dec 2023–Feb 2024), CESTI search results (Apr 2024) and supply-chain studies in Cai Lậy, Phong Điền, Thailand and Malaysia. Volumes, price ratios, probabilities and AI rival strategies are illustrative.');
  }
  $('langVI').onclick = () => { LANG = 'vi'; store.set('durian_lang', 'vi'); render(); };
  $('langEN').onclick = () => { LANG = 'en'; store.set('durian_lang', 'en'); render(); };
  $('themeBtn').onclick = () => {
    const n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', n); store.set('durian_theme', n); render();
  };
  $('musicBtn').onclick = () => {
    const a = $('bgm');
    if (a.paused) { a.volume = 0.35; const p = a.play(); if (p && p.catch) p.catch(() => {}); $('musicBtn').setAttribute('aria-pressed', 'true'); $('musicBtn').textContent = '♪ ❚❚'; }
    else { a.pause(); $('musicBtn').setAttribute('aria-pressed', 'false'); $('musicBtn').textContent = '♪'; }
  };

  function render() {
    chrome(); stopTimer();
    if (!APP) return renderSetup();
    if (pendingJournal()) return renderResult();
    if (APP.game.n > D.seasons.length) return renderEnd();
    renderPlay();
  }

  const formulaHTML = () => Object.entries(D.scoreWeights).map(([k, w]) => `<b>${w}%</b> ${partName(k)}`).join(' + ');

  // ================= đề xuất của đội (tất định, có chủ ý chưa tối ưu) =================
  function teamAdvice() {
    const g = APP.game, a = g.assets, s = D.seasons[g.n - 1], role = D.roles[g.roleId], ev = E.eventFor(D, g);
    const ok = id => E.eligible(D, g, D.channels.find(c => c.id === id));
    const out = [];
    // CMO: kênh + nguồn tin
    const alloc = { CN: 0, BORDER: 0, FROZEN: 0, TW: 0, JP: 0, DOM: 0 };
    if (ok('CN')) { alloc.CN = 50; alloc.BORDER = (s.borderCut || 0) < 0.4 ? 15 : 5; } else { alloc.BORDER = 40; }
    if (ok('FROZEN')) alloc.FROZEN = s.frozenProtocol ? 25 : 10;
    alloc.TW = 10; if (ok('JP')) alloc.JP = 5;
    alloc.DOM = Math.max(5, 100 - Object.values(alloc).reduce((x, y) => x + y, 0));
    const intel = s.cadmium || (ev && (ev.id === 'residue' || ev.id === 'pest')) ? ['moit', 'ppd'] : ['moit', 'buyer'];
    out.push({ who: 'cmo', apply: { alloc, intel },
      text: L(`Chia: ${CH_IDS.filter(k => alloc[k]).map(k => k + ' ' + alloc[k]).join(' · ')}. Mua tin: ${intel.map(i => nm(D.intel.find(x => x.id === i))).join(' + ')}.`,
        `Split: ${CH_IDS.filter(k => alloc[k]).map(k => k + ' ' + alloc[k]).join(' · ')}. Buy: ${intel.map(i => nm(D.intel.find(x => x.id === i))).join(' + ')}.`),
      why: ok('CN') ? L('Đã đủ mã, nên dồn vào chính ngạch; tiểu ngạch đang bị siết.', 'We hold both codes, so lean on official trade; border trade is tightening.')
        : L('Chưa đủ mã chính ngạch nên tạm dựa vào tiểu ngạch và nội địa.', 'No official codes yet, so rely on border and domestic trade for now.') });
    // COO: nguồn hàng
    if (role.ownFarm) {
      const induce = s.season === 'off' && g.treeHealth > 70;
      out.push({ who: 'coo', apply: { induce },
        text: s.season === 'off' ? (induce ? L('Xử lý ra hoa nghịch vụ vụ này.', 'Induce off-season flowering this season.') : L('Cho vườn nghỉ, không xử lý nghịch vụ.', 'Rest the orchard; do not induce.')) : L('Chính vụ: thu hoạch bình thường, giảm hao hụt sau thu hoạch.', 'Main season: harvest normally and cut post-harvest losses.'),
        why: L(`Sức khỏe vườn ${nf(g.treeHealth)}/100; xử lý liên tục làm giảm tuổi thọ cây 20–30%.`, `Orchard health ${nf(g.treeHealth)}/100; repeated inducing cuts tree life by 20–30%.`) });
    } else {
      const linked = a.area || (APP.dec.priority === 'area') ? 0.7 : 0.3;
      out.push({ who: 'coo', apply: { linked },
        text: L(`Mua ${pct(linked)} từ vùng liên kết có mã, phần còn lại qua thương lái.`, `Buy ${pct(linked)} from linked coded areas, the rest via traders.`),
        why: L('Chỉ hàng có mã vùng trồng mới đi chính ngạch; hàng thương lái rẻ hơn 8% nhưng rủi ro dư lượng cao hơn.', 'Only coded fruit may go official; trader fruit is 8% cheaper but carries more residue risk.') });
    }
    // CFO: ưu tiên đầu tư
    const order = role.ownFarm ? ['pack', 'area', 'test', 'trace'] : ['area', 'pack', 'test', 'trace'];
    if (role.freezer || g.n >= 4) order.push('freezer');
    const pick = order.find(p => !owned(a, p) && g.cash > (D.params.priorityCost[p] || 0) + 1) || 'finance';
    out.push({ who: 'cfo', apply: { priority: pick },
      text: L(`Ưu tiên: ${nm(D.priorities.find(p => p.id === pick))}.`, `Priority: ${nm(D.priorities.find(p => p.id === pick))}.`),
      why: g.cash < 2 ? L(`Tiền mặt chỉ còn ${money(g.cash)}; âm tiền chịu lãi 8% mỗi vụ.`, `Cash is only ${money(g.cash)}; negative cash costs 8% per season.`)
        : L('Mã số và cấp đông có hiệu lực từ vụ sau; kiểm nghiệm có tác dụng ngay.', 'Codes and freezing take effect next season; testing works immediately.') });
    // SEC: biến cố
    if (ev) {
      let best = 0, bestV = -1e9;
      ev.options.forEach((o, i) => { const e = o.eff || {}; const v = (e.rep || 0) + (e.sus || 0) + (e.adapt || 0) - (e.fraud ? 50 : 0) - (e.pestRisk ? 30 : 0) + (e.cash || 0) * 5; if (v > bestV) { bestV = v; best = i; } });
      out.push({ who: 'sec', apply: { option: best },
        text: L(`Biến cố «${nm(ev)}»: đề xuất «${nm(ev.options[best])}».`, `Event «${nm(ev)}»: suggest «${nm(ev.options[best])}».`),
        why: fact(ev.src) });
    }
    return out;
  }

  // ================= Lumina: giải thích, không ra đáp án =================
  function luminaAnswer(qid) {
    const g = APP.game, a = g.assets, s = D.seasons[g.n - 1], role = D.roles[g.roleId], ev = E.eventFor(D, g), dec = APP.dec;
    const f = E.forecast(D, g, dec);
    switch (qid) {
      case 'risk': {
        const trader = role.ownFarm ? 0 : 1 - dec.linked;
        return { a: L(`Ba nguồn rủi ro: (1) ${pct(trader)} hàng mua qua thương lái, khó kiểm soát dư lượng; (2) mức kiểm nghiệm hiện có ×${a.test}; (3) ${s.cadmium ? 'vụ này có đợt cảnh báo cadimi, rủi ro bị chặn nhân 2,5' : 'bối cảnh vụ'}${ev ? ' và biến cố «' + nm(ev) + '»' : ''}. Với phương án đang nhập, xác suất lô chính ngạch bị chặn ước khoảng ${pct(f.pBlockCN || 0)}.`,
            `Three sources of risk: (1) ${pct(trader)} of fruit bought via traders, where residues are hard to control; (2) your testing level ×${a.test}; (3) ${s.cadmium ? 'this season\'s cadmium alerts, which multiply blocking risk by 2.5' : 'the season context'}${ev ? ' and the event «' + nm(ev) + '»' : ''}. With the current plan, the chance an official lot is blocked is about ${pct(f.pBlockCN || 0)}.`),
          ask: L('Đội chấp nhận mức rủi ro này để đổi lấy điều gì? Nếu bị chặn, mã bị tạm dừng vụ sau.', 'What does the team gain by accepting this risk? If blocked, your codes are suspended next season.'), src: fact('sampling') };
      }
      case 'price': {
        const sig = E.intelSignals(D, g, dec.intel);
        return { a: sig.length ? L(`Đội đang có ${sig.length} tín hiệu giá: ${sig.map(x => nm(D.intel.find(i => i.id === x.id)) + ' ≈ ' + nf(x.price)).join('; ')} (nghìn đ/kg). Dự báo «Nếu – Thì» dùng trung bình các tín hiệu này.`,
            `You hold ${sig.length} price signals: ${sig.map(x => nm(D.intel.find(i => i.id === x.id)) + ' ≈ ' + nf(x.price)).join('; ')} (VND k/kg). The what-if uses their average.`)
            : L(`Đội chưa mua tin. Mức giá công khai ước khoảng ${nf(E.basePrice(D, g))} nghìn đ/kg, chưa tính dao động của vụ.`, `You have bought no information. The public price is about ${nf(E.basePrice(D, g))} VND k/kg, before this season's swings.`),
          ask: L('Nguồn nào có động cơ thổi giá hoặc ép giá? Hai nguồn lệch nhau thì đội tin nguồn nào, vì sao?', 'Which source has a reason to talk prices up or down? If two sources disagree, which one do you trust and why?'), src: '' };
      }
      case 'channel': {
        const okC = D.channels.filter(c => E.eligible(D, g, c)), lock = D.channels.filter(c => !E.eligible(D, g, c));
        return { a: L(`Mở: ${okC.map(c => c.emoji + ' ' + nm(c)).join(', ')}. ${lock.length ? 'Đang khóa: ' + lock.map(c => nm(c)).join(', ') + '.' : ''} Mỗi kênh có trần khối lượng; phần vượt trần tự chuyển về nội địa.`,
            `Open: ${okC.map(c => c.emoji + ' ' + nm(c)).join(', ')}. ${lock.length ? 'Locked: ' + lock.map(c => nm(c)).join(', ') + '.' : ''} Each channel has a volume cap; anything above it goes to the domestic market.`),
          ask: L('Đội đang tối ưu thị phần, lợi nhuận hay giảm phụ thuộc một thị trường?', 'Is the team optimising share, profit or reducing reliance on one market?'), src: fact('china92') };
      }
      case 'invest': {
        const miss = ['area', 'pack', 'test', 'trace', 'freezer'].filter(p => !owned(a, p));
        return { a: L(`Còn thiếu: ${miss.map(p => nm(D.priorities.find(x => x.id === p))).join(', ') || 'không'}. Mã vùng trồng, mã đóng gói và cấp đông có hiệu lực từ vụ sau; kiểm nghiệm và truy xuất có tác dụng ngay. Năng lực tích lũy chiếm 20% điểm tổng.`,

          glut: L('Quyền lực người mua và rủi ro tập trung thị trường: vì sao cần đa dạng hóa.', 'Buyer power and market-concentration risk: why diversification matters.'),
          residue: L('Giới hạn dư lượng tối đa (MRL) và tiêu chuẩn của thị trường cao cấp.', 'Maximum residue limits (MRLs) and premium-market standards.'),
          thaidrought: L('Cạnh tranh giữa các nước xuất khẩu: cú sốc nguồn cung ở đối thủ là cơ hội, nhưng giữ khách cũ cũng có giá trị.', 'Competition between exporting countries: a rival\'s supply shock is an opportunity, but loyal buyers have value too.')
        };
        return { a: ev ? (map[ev.id] || '') : L('Vụ này không có biến cố riêng.', 'No specific event this season.'),
          ask: L('Đội sẽ dẫn chứng khái niệm này thế nào trong nhật ký?', 'How will the team use this concept in the journal?'), src: ev ? fact(ev.src) : '' };
      }
    }
  }

  // ================= đồng hồ vụ =================
  let TIMER = null;
  function stopTimer() { if (TIMER) { clearInterval(TIMER); TIMER = null; } }
  function startTimer() {
    if (!APP.timerMin) return;
    const tick = () => {
      const el = $('timer'); if (!el) return stopTimer();
      const left = APP.timerMin * 60 - Math.floor((Date.now() - APP.roundStart) / 1000);
      const m = Math.floor(Math.abs(left) / 60), s = Math.abs(left) % 60;
      el.textContent = (left < 0 ? '−' : '') + m + ':' + String(s).padStart(2, '0');
      el.classList.toggle('late', left < 0);
      if (left < 0 && !APP.timing['late' + roundN()]) { APP.timing['late' + roundN()] = 1; logEv('TIMER_EXPIRED', '', APP.timerMin); save(); }
    };
    tick(); TIMER = setInterval(tick, 1000);
  }

  // ================= màn 2: một vụ =================
  function flagsHTML(nowN) {
    return `<div class="flags">${D.seasons.map((s, i) => { const f = APP.flags[i];
      return `<span class="${f ? (f.win ? 'win' : 'lose') : (i + 1 === nowN ? 'now' : '')}">${f ? (f.win ? '🟩' : '🟥') : (i + 1 === nowN ? '📍' : '⬜')} ${L('Vụ', 'S')}${i + 1}</span>`; }).join('')}</div>`;
  }
  function leaderboardHTML(upto) {
    const rows = [{ id: 'me', img: null, name: L('Đội của bạn', 'Your team') + (APP.team ? ' · ' + esc(APP.team) : ''), h: APP.game.history.slice(0, upto) }]
      .concat(RIVALS.map(r => ({ id: r.id, img: rivalInfo(r.id).img, name: esc(nm(rivalInfo(r.id))), h: r.state.history.slice(0, upto) })));
    rows.forEach(r => { r.profit = r.h.reduce((x, y) => x + y.profit, 0); });
    rows.sort((x, y) => y.profit - x.profit);
    return `<div class="tblwrap"><table class="lb"><tr><th>#</th><th>${L('Doanh nghiệp', 'Firm')}</th><th>${L('Lợi nhuận lũy kế', 'Cumulative profit')}</th><th>${L('Lô bị chặn', 'Blocked lots')}</th></tr>
      ${rows.map((r, i) => `<tr><td>${i + 1}</td><td>${r.img ? `<img src="${IMG(r.img)}" alt="">` : '⭐ '}${r.id === 'me' ? '<b>' + r.name + '</b>' : r.name}</td><td class="num ${r.profit >= 0 ? 'pos' : 'neg'}">${money(r.profit)}</td><td class="num">${r.h.filter(x => x.blockedCN).length}</td></tr>`).join('')}</table></div>`;
  }

            <button type="button" class="mini" data-adv="${i}">${L('Áp dụng đề xuất', 'Apply suggestion')}</button></div></div>`; }).join('')}</div></div>

      <div class="grid2">
        <div class="card"><h2>③ ${L('Quyết định', 'Decisions')}</h2>
          <h3>CMO · ${L('Mua tin (tối đa 2 nguồn)', 'Buy information (up to 2)')}</h3>
          <div class="chips">${D.intel.map(i => `<button type="button" class="chip ${dec.intel.includes(i.id) ? 'on' : ''}" data-intel="${i.id}" ${!dec.intel.includes(i.id) && dec.intel.length >= 2 ? 'disabled' : ''}>${nm(i)} · ${i.cost ? money(i.cost) : L('miễn phí', 'free')}</button>`).join('')}</div>

            : `<label class="ctl" for="linked">${L('Tỷ lệ mua từ vùng trồng liên kết có mã số', 'Share bought from linked, coded planting areas')}: <span class="num" id="linkedV">${pct(dec.linked)}</span></label>
              <input type="range" id="linked" min="0" max="100" step="10" value="${Math.round(dec.linked * 100)}"><p class="hint">${fact('traders80')}</p>`}
        </div>

          ${D.channels.map(c => { const e = okIds.includes(c.id); const cap = c.cap === null ? '' : `${L('tối đa', 'max')} ${nf(c.id === 'BORDER' ? c.cap * (1 - (s.borderCut || 0)) : c.cap)} ${L('tấn', 't')}`;

            <input type="range" data-ch="${c.id}" min="0" max="100" step="5" value="${dec.alloc[c.id] || 0}" ${e ? '' : 'disabled'}><span class="num" id="pct-${c.id}">${e ? pct(norm[c.id]) : '—'}</span></div>`; }).join('')}

          <h2 style="margin-top:16px">④ ${L('Nếu – Thì (CEO chạy, còn', 'What-if (CEO runs it,')} ${MAX_WHATIF - wf.length}/${MAX_WHATIF}${L(')', ' left)')}</h2>
          <p class="hint">${L('Dự báo dùng giá ước tính từ nguồn tin đã mua và rủi ro kỳ vọng. Kết quả thật còn phụ thuộc giá vựa thực tế và may rủi kiểm dịch.', 'The forecast uses the price estimated from purchased information and expected risk. Actual results also depend on the real depot price and inspection luck.')}</p>
          <p><button type="button" class="btn ghost" id="wfBtn" ${wf.length >= MAX_WHATIF ? 'disabled' : ''}>${L('Chạy mô phỏng', 'Run simulation')}</button></p>
          ${wf.map((w, i) => `<div class="bubble"><div class="q">#${i + 1} · ${esc(w.label)}</div><div class="wf">
            <div class="kpi"><small>${L('Lợi nhuận dự báo', 'Forecast profit')}</small><b class="num ${w.profit >= 0 ? 'pos' : 'neg'}">${money(w.profit)}</b></div>

            <div class="kpi"><small>${L('Khả năng bị chặn', 'Block chance')}</small><b class="num">${pct(w.pBlockCN || 0)}</b></div>
            <div class="kpi"><small>${L('Giá vựa ước', 'Est. depot')}</small><b class="num">${nf(w.depotEstimate)}</b></div>
            <div class="kpi"><small>${L('Uy tín sau vụ', 'Rep. after')}</small><b class="num">${nf(w.rep)}</b></div></div></div>`).join('')}
        </div>

      <div class="card"><h2>⑤ ${L('Hỏi Lumina', 'Ask Lumina')} (${L('còn', 'left')} ${MAX_LUMINA - lq.length}/${MAX_LUMINA})</h2>
        <div class="lumina"><img src="${IMG(lq.length ? 'lumina-ao-dai-present.webp' : 'lumina-ao-dai.webp')}" alt="Lumina"><div>
          <p class="small muted">${L('Lumina giải thích và hỏi ngược, không đưa đáp án. Ở nhật ký, đội ghi rõ dùng hay bác bỏ từng ý.', 'Lumina explains and asks back; it does not give the answer. In the journal, record whether you used or rejected each point.')}</p>
          <div class="chips">${D.luminaQuestions.map(q => `<button type="button" class="chip" data-lq="${q.id}" ${lq.length >= MAX_LUMINA || lq.some(x => x.q === q.id) ? 'disabled' : ''}>${nm(q)}</button>`).join('')}</div>
          ${lq.map(x => `<div class="bubble"><div class="q">${nm(D.luminaQuestions.find(q => q.id === x.q))}</div>${x.a}${x.src ? `<div class="hint">${x.src}</div>` : ''}<div class="ask">↪ ${x.ask}</div></div>`).join('')}

          .map(([k, v]) => `<button type="button" class="chip ${sh.goal === k ? 'on' : ''}" data-goal="${k}">${v}</button>`).join('')}</div>
        <div class="grid2"><div>
          <label class="ctl req" for="sh-assume">${L('Giả định: đội tin điều gì sẽ xảy ra?', 'Assumption: what does the team believe will happen?')}</label><textarea id="sh-assume" data-sh="assume">${esc(sh.assume)}</textarea>
          <label class="ctl" for="sh-risk">${L('Rủi ro: biến nào có thể làm dự báo sai?', 'Risk: what could make the forecast wrong?')}</label><textarea id="sh-risk" data-sh="risk">${esc(sh.risk)}</textarea>
        </div><div>
          <label class="ctl" for="sh-disagree">${L('Bất đồng: thành viên nào không đồng ý, ở điểm nào?', 'Disagreement: who disagreed, and on what?')}</label><textarea id="sh-disagree" data-sh="disagree">${esc(sh.disagree)}</textarea>
          <label class="ctl req" for="sh-ceo">${L('CEO chọn phương án nào và vì sao?', 'Which option did the CEO choose, and why?')}</label><textarea id="sh-ceo" data-sh="ceo">${esc(sh.ceo)}</textarea>

        <p class="small" style="margin-top:8px">${L('Dự báo ghi vào phiếu', 'Forecast on the sheet')}: ${wf.length ? `<b class="num">${money(wf[wf.length - 1].profit)}</b> (${L('lần «Nếu – Thì» gần nhất', 'latest what-if')})` : `<span class="muted">${L('chưa chạy «Nếu – Thì»', 'no what-if yet')}</span>`}</p>
        <p style="margin-top:14px"><button class="btn" id="commitBtn" type="button">⑦ ${L('CEO chốt vụ', 'CEO commits season')} ${n} →</button></p>
        ${ERR ? `<p class="err">${esc(ERR)}</p>` : ''}
      </div>`;

    // ---- sự kiện giao diện ----
    const rerender = () => { save(); renderPlay(); };
    document.querySelectorAll('[data-op]').forEach(b => b.onclick = () => { const o = APP.operator; APP.operator = b.dataset.op; logEv('SET_OPERATOR', o, APP.operator); rerender(); });
    document.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => { const o = dec.option; dec.option = +b.dataset.opt; logEv('CHOOSE_OPTION', o, dec.option); rerender(); });
    document.querySelectorAll('[data-intel]').forEach(b => b.onclick = () => {
      const id = b.dataset.intel, had = dec.intel.includes(id);
      dec.intel = had ? dec.intel.filter(x => x !== id) : dec.intel.concat([id]).slice(0, 2);
      logEv(had ? 'UNBUY_INTEL' : 'BUY_INTEL', '', id); rerender();
    });
    document.querySelectorAll('[data-pri]').forEach(b => b.onclick = () => { const o = dec.priority; dec.priority = b.dataset.pri; logEv('CHANGE_PRIORITY', o, dec.priority); rerender(); });
    document.querySelectorAll('[data-ind]').forEach(b => b.onclick = () => { const o = dec.induce; dec.induce = b.dataset.ind === '1'; logEv('CHANGE_INDUCE', o, dec.induce); rerender(); });
    if ($('linked')) {
      let before = dec.linked;
      $('linked').oninput = e => { dec.linked = +e.target.value / 100; $('linkedV').textContent = pct(dec.linked); };
      $('linked').onchange = () => { logEv('CHANGE_LINKED', before, dec.linked); before = dec.linked; save(); };
    }
    document.querySelectorAll('[data-ch]').forEach(r => {
      let before = dec.alloc[r.dataset.ch] || 0;
      r.oninput = () => {
        dec.alloc[r.dataset.ch] = +r.value;
        const n2 = E.normalizeAlloc(Object.fromEntries(okIds.map(id => [id, dec.alloc[id]])), okIds);
        okIds.forEach(id => { $('pct-' + id).textContent = pct(n2[id]); });
      };
      r.onchange = () => { logEv('CHANGE_ALLOC_' + r.dataset.ch, before, +r.value); before = +r.value; save(); };
    });
    document.querySelectorAll('[data-adv]').forEach(b => b.onclick = () => {
      const x = advice[+b.dataset.adv];
      Object.entries(x.apply).forEach(([k, v]) => { dec[k] = k === 'alloc' ? Object.assign({}, v) : (Array.isArray(v) ? v.slice() : v); });
      logEv('APPLY_ADVICE', x.who.toUpperCase(), x.apply); rerender();
    });
    $('wfBtn').onclick = () => {
      if ((APP.whatifs[n] || []).length >= MAX_WHATIF) return;
      const f = E.forecast(D, g, JSON.parse(JSON.stringify(dec)));
      const label = `${nm(D.priorities.find(p => p.id === dec.priority))} · ${role.ownFarm ? '' : pct(dec.linked) + ' ' + L('vùng có mã', 'coded') + ' · '}${CH_IDS.filter(id => okIds.includes(id) && dec.alloc[id] > 0).map(id => id + ' ' + (dec.alloc[id] || 0)).join('/')}`;
      APP.whatifs[n] = (APP.whatifs[n] || []).concat([{ label, profit: f.profit, cashAfter: f.cashAfter, pBlockCN: f.pBlockCN, depotEstimate: f.depotEstimate, rep: f.rep, decision: JSON.parse(JSON.stringify(dec)) }]);
      logEv('RUN_WHATIF', label, nf(f.profit, 2)); rerender();
    };
    document.querySelectorAll('[data-lq]').forEach(b => b.onclick = () => {
      if ((APP.lumina[n] || []).length >= MAX_LUMINA) return;
      const ans = luminaAnswer(b.dataset.lq);
      APP.lumina[n] = (APP.lumina[n] || []).concat([Object.assign({ q: b.dataset.lq }, ans)]);
      logEv('ASK_LUMINA', '', b.dataset.lq); rerender();
    });
    document.querySelectorAll('[data-goal]').forEach(b => b.onclick = () => { APP.sheets[n] = Object.assign({}, APP.sheets[n], { goal: b.dataset.goal }); logEv('SHEET_GOAL', '', b.dataset.goal); rerender(); });
    document.querySelectorAll('[data-sh]').forEach(t => {
      t.oninput = () => { APP.sheets[n] = Object.assign({}, APP.sheets[n], { [t.dataset.sh]: t.value }); };
      t.onchange = () => { logEv('EDIT_SHEET_' + t.dataset.sh.toUpperCase(), '', t.value.length + ' chars'); save(); };
    });
    $('commitBtn').onclick = () => commit();
    startTimer();
  }

  function commit() {
    const n = roundN(), sh = APP.sheets[n] || {};
    if (!sh.goal || !(sh.assume || '').trim() || (sh.ceo || '').trim().length < 10) {
      ERR = L('Phiếu quyết định còn thiếu: mục tiêu, giả định và lý do của CEO (tối thiểu 10 ký tự).', 'The decision sheet is incomplete: goal, assumption and the CEO\'s reason (at least 10 characters).');
      logEv('COMMIT_REJECTED', '', 'SHEET_INCOMPLETE'); save(); renderPlay();
      const el = document.querySelector('.err'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    if (!confirm(L('Chốt vụ ' + n + '? Đã chốt thì không sửa được.', 'Commit season ' + n + '? Commits are final.'))) return;
    ERR = '';
    const dec = JSON.parse(JSON.stringify(APP.dec));
    const f = E.forecast(D, APP.game, dec);
    const elapsed = Math.round((Date.now() - APP.roundStart) / 1000);
    APP.timing[n] = { start: new Date(APP.roundStart).toISOString(), commit: new Date().toISOString(), seconds: elapsed, onTime: !APP.timerMin || elapsed <= APP.timerMin * 60, operator: APP.operator };
    APP.sheets[n] = Object.assign({}, sh, { forecastFinal: f.profit, forecastWhatIf: (APP.whatifs[n] || []).length ? APP.whatifs[n][APP.whatifs[n].length - 1].profit : null, pBlockCN: f.pBlockCN });
    APP.game = E.playSeason(D, APP.game, dec);
    const r = APP.game.history[APP.game.history.length - 1];
    APP.flags[n - 1] = E.flagFor(RIVALS, r);
    logEv('COMMIT', '', JSON.stringify(dec), true);
    // giữ phương án làm điểm xuất phát vụ sau
    const next = freshDec(); next.alloc = dec.alloc; next.linked = dec.linked; next.intel = [];
    const free = D.priorities.find(p => !owned(APP.game.assets, p.id));
    next.priority = free ? free.id : 'finance';
    APP.dec = next;
    save(); render(); window.scrollTo(0, 0);
  }

  // Chỉ số thích nghi: tổng thay đổi quyết định đã chuẩn hóa về [0,1] cho từng biến
  function adaptationIndex(h, k) {
    const a = h[k - 2].decision, b = h[k - 1].decision;
    const alloc = CH_IDS.reduce((x, id) => x + Math.abs((a.alloc[id] || 0) - (b.alloc[id] || 0)), 0) / 2;
    const intelA = new Set(a.intel), intelB = new Set(b.intel), uni = new Set([...a.intel, ...b.intel]);
    const intel = uni.size ? 1 - [...intelA].filter(x => intelB.has(x)).length / uni.size : 0;
    return Math.abs(a.linked - b.linked) + (a.priority !== b.priority ? 1 : 0) + alloc + intel;
  }

  function csv(rows, cols) {
    const q = v => { const s = v === null || v === undefined ? '' : String(v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return '﻿' + [cols.join(',')].concat(rows.map(r => cols.map(c => q(r[c])).join(','))).join('\n');
  }
  function download(name, text, type) {
    const blob = new Blob([text], { type });
    const el = document.createElement('a'); el.href = URL.createObjectURL(blob); el.download = name; el.click();
    setTimeout(() => URL.revokeObjectURL(el.href), 1000);
  }

        whatif_runs: (APP.whatifs[n] || []).length, lumina_questions: (APP.lumina[n] || []).map(x => x.q).join('|'),
        goal: sh.goal, forecast_profit: sh.forecastWhatIf !== null && sh.forecastWhatIf !== undefined ? sh.forecastWhatIf : sh.forecastFinal, forecast_p_block: sh.pBlockCN,
        commit_time: tm.commit, decision_seconds: tm.seconds, on_time: tm.onTime ? 1 : 0, committed_by: (tm.operator || '').toUpperCase(),
        depot_price: r.depot, volume_t: r.volume, loss: r.loss, revenue: r.revenue, purchase: r.purchase, logistics: r.logistics, investment: r.priorityCost, intel_cost: r.intelCost, finance_cost: r.finance,
        profit: r.profit, blocked_cn: r.blockedCN ? 1 : 0, audit: r.audit || '', flag_win: fl.win ? 1 : 0,
        journal_cause: j.cause, deviation: j.deviation, adaptation_index: n > 1 ? adaptationIndex(APP.game.history, n) : ''
      };
      CH_IDS.forEach(id => { const c = r.byChannel.find(x => x.id === id); row['qty_' + id] = c ? c.qty : 0; row['status_' + id] = c ? c.status : ''; });

      Object.keys(row).forEach(k => { if (typeof row[k] === 'number' && !Number.isInteger(row[k])) row[k] = Math.round(row[k] * 10000) / 10000; });
      return row;
    });
  }

          ${roundRows().map((x, i) => `<tr><td>${i + 1}</td><td>${esc(GOALS()[x.goal] || '')}</td><td>${esc(nm(D.priorities.find(p => p.id === x.priority)))}</td><td class="num">${money(x.forecast_profit || 0)}</td><td class="num ${x.profit >= 0 ? 'pos' : 'neg'}">${money(x.profit)}</td><td>${esc(CAUSES()[x.journal_cause] || '')}</td><td class="num">${x.adaptation_index === '' ? '—' : nf(x.adaptation_index, 2)}</td><td>${x.on_time ? '✓' : '⏰'}</td><td>${x.flag_win ? '🟩' : '🟥'}</td></tr>`).join('')}
        </table></div>
        <p class="hint">${L('Chỉ số thích nghi = tổng thay đổi so với vụ trước, mỗi biến chuẩn hóa về 0–1 (tỷ lệ vùng có mã, ưu tiên, cơ cấu kênh, nguồn tin).', 'Adaptation index = total change from the previous season, each variable normalised to 0–1 (coded share, priority, channel mix, information sources).')}</p></div>

      <div class="grid2">
        <div class="card"><h3>${L('Câu hỏi thảo luận cuối kỳ', 'Final discussion questions')}</h3><ol class="qa small">
          <li>${L('Vì sao mã số vùng trồng và mã cơ sở đóng gói vừa là rào cản vừa là cơ hội? Liên hệ khái niệm rào cản kỹ thuật và vệ sinh dịch tễ (TBT/SPS).', 'Why are planting-area and packing-facility codes both a barrier and an opportunity? Relate this to technical and sanitary barriers (TBT/SPS).')}</li>
          <li>${L('Phụ thuộc 92% vào một thị trường có rủi ro gì? Đội đã đa dạng hóa kênh như thế nào?', 'What are the risks of relying on one market for 92% of exports? How did your team diversify?')}</li>
          <li>${L('Vì sao giá sầu riêng Việt Nam tại Trung Quốc thấp hơn Thái Lan dù thị phần cao hơn? Nâng cấp chuỗi giá trị nên bắt đầu từ đâu?', 'Why is Vietnamese durian cheaper than Thai durian in China despite a larger share? Where should upgrading start?')}</li>
          <li>${L('Alpha Durian chọn «dán nhãn». Nhà nước, hiệp hội và doanh nghiệp nên làm gì để giữ uy tín cho cả ngành?', 'Alpha Durian chose to relabel. What should the state, associations and firms do to protect the whole industry\'s reputation?')}</li>
          <li>${L('Ý kiến nào của Lumina đội đã bác bỏ, và vì sao?', 'Which of Lumina\'s points did the team reject, and why?')}</li></ol>
          <p class="hint">${fact('share57')}</p><p class="hint">${fact('china92')}</p></div>
        <div class="card"><h3>${L('Rubric gợi ý (kết quả game 20%)', 'Suggested rubric (game result 20%)')}</h3>
          <div class="tblwrap"><table>${D.rubric.map(r => `<tr><td>${nm(r)}</td><td class="num">${r.w}%</td></tr>`).join('')}</table></div>
          <h3>${L('Xuất dữ liệu cho giảng viên', 'Export data for the instructor')}</h3>
          <p class="small muted">${L('Dữ liệu chỉ nằm trên máy này cho đến khi đội tải về và nộp. Không có họ tên.', 'Data stays on this device until the team downloads and submits it. No names are stored.')}</p>
          <p style="margin-top:8px"><button class="btn" id="csvRounds" type="button">${L('Bảng đội – vụ (CSV)', 'Team–season table (CSV)')}</button>
            <button class="btn ghost" id="csvEvents" type="button">${L('Nhật ký sự kiện (CSV)', 'Event log (CSV)')}</button>
            <button class="btn ghost" id="jsonAll" type="button">${L('Toàn bộ (JSON)', 'Everything (JSON)')}</button></p></div>
      </div>
      <div class="card"><h3>${L('Nguồn dữ kiện', 'Sources')}</h3><ul class="qa small">${[...used].map(k => `<li><b>[${k}]</b> ${esc(D.sources[k])}</li>`).join('')}</ul></div>
      <p><button class="btn ghost" id="againBtn" type="button">${L('Chơi ván mới', 'New game')}</button></p>`;
    const base = 'ho-chieu-sau-rieng_' + (APP.cls || 'local') + '_' + (APP.team || 'team');
    $('csvRounds').onclick = () => { logEv('EXPORT', '', 'rounds_csv'); save(); const rows = roundRows(); download(base + '_doi-vu.csv', csv(rows, Object.keys(rows[0])), 'text/csv;charset=utf-8'); };
    $('csvEvents').onclick = () => { logEv('EXPORT', '', 'events_csv'); save(); download(base + '_su-kien.csv', csv(APP.events, D.eventLogColumns), 'text/csv;charset=utf-8'); };
    $('jsonAll').onclick = () => {
      logEv('EXPORT', '', 'json'); save();
      download(base + '.json', JSON.stringify({ game: 'ho-chieu-sau-rieng', edition: 'classroom-v2', class_id: APP.cls, team_id: APP.team, firm: APP.roleId, seed: APP.seed, summary: S,
        rounds: roundRows(), sheets: APP.sheets, journals: APP.journals, debriefs: APP.debriefs, lumina: APP.lumina, whatifs: APP.whatifs, events: APP.events,
        rivals: rivS.map(x => ({ id: x.id, total: x.S.total, profit: x.S.profit })), log: E.decisionLog(g, { cohort: APP.cls || 'local' }) }, null, 2), 'application/json');
    };
    $('againBtn').onclick = () => {
      if (!confirm(L('Đã tải dữ liệu chưa? Ván mới sẽ xóa ván này khỏi máy.', 'Have you downloaded the data? A new game deletes this one from the device.'))) return;
      store.del(SAVE_KEY); APP = null; RIVALS = null; render(); window.scrollTo(0, 0);
    };
  }

  document.documentElement.setAttribute('data-theme', store.get('durian_theme') === 'light' ? 'light' : 'dark');
  render();
})();
</script>
</body>
</html>
