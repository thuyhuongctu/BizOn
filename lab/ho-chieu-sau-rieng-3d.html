<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hộ Chiếu Sầu Riêng · Bản đồ 3D</title>
<link rel="icon" href="../assets/brand/bizon-favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1F3A22">
<meta name="description" content="Hộ Chiếu Sầu Riêng – bản đồ chuỗi cung ứng 3D đi lại được: khám phá các trạm chính ngạch, tiểu ngạch, đông lạnh, Đài Loan, Nhật Bản cùng Bà Sáu Lành, dùng chung dữ liệu và luật chơi với bản thẻ lớp học.">
<style>
@font-face{font-family:'Plus Jakarta Sans';font-weight:400 800;font-display:swap;src:url(../assets/fonts/PlusJakartaSans-var-vietnamese.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+1EA0-1EF9,U+20AB}
@font-face{font-family:'Plus Jakarta Sans';font-weight:400 800;font-display:swap;src:url(../assets/fonts/PlusJakartaSans-var-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:'JetBrains Mono';font-weight:400 500;font-display:swap;src:url(../assets/fonts/IBMPlexMono-400-vietnamese.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+1EA0-1EF9,U+20AB}
@font-face{font-family:'JetBrains Mono';font-weight:400 500;font-display:swap;src:url(../assets/fonts/IBMPlexMono-400-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2212}
:root{
  --bg:#FBF4E8;--panel:#FFFBF4;--panel2:#FFF6E6;--tray:#F3E6CF;
  --ink:#033337;--muted:#3E5A5C;--faint:#546869;
  --line:rgba(110,70,30,.12);--line2:rgba(110,70,30,.22);
  --durian:#4A7419;--durian-deep:#385A10;--durian-soft:#E6F0CF;
  --flesh:#F5BE2E;--flesh-soft:#FFF0C2;
  --accent:var(--durian-deep);--accent2:var(--flesh);
  --neg:#C2410C;
  --radius:22px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;overflow:hidden}
h1,h2,h3{font-family:'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:-.01em}
.mono,.num{font-family:'JetBrains Mono',monospace}
[hidden]{display:none!important}
button{font:inherit}
/* ---------- top bar ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:rgba(251,244,232,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14.5px;background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:7px 14px}
.spacer{flex:1}
.tbtn{border:1px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:10px;padding:7px 12px;font-weight:700;font-size:12.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.tbtn.on{background:var(--durian);color:#fff;border-color:var(--durian)}
.lang-pill{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--panel)}
.avatar-badge{display:none;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.avatar-badge.on{display:flex}
.avatar-badge img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.lang-pill button{border:0;background:transparent;color:var(--muted);padding:7px 11px;font-weight:700;font-size:12.5px;cursor:pointer}
.lang-pill button.on{background:var(--durian);color:#fff}
/* ---------- bản đồ 3D đi lại ---------- */
#world3d{position:fixed;inset:0;z-index:1;background:linear-gradient(#bfe3ef,#eaf6ee);touch-action:none}
#world3d canvas{display:block;touch-action:none}
#labels3d{position:fixed;inset:0;z-index:2;pointer-events:none}
.lbl3d{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.92);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;color:#174d2e;white-space:nowrap;pointer-events:auto;cursor:pointer;box-shadow:0 4px 10px -4px rgba(0,0,0,.3);transition:box-shadow .15s}
.lbl3d.near{box-shadow:0 0 0 3px var(--flesh),0 4px 10px -4px rgba(0,0,0,.4)}
.lbl3d.locked{opacity:.55;filter:grayscale(.5)}
.lbl3d.pale{opacity:.6}
.lbl3d.active{background:var(--durian-soft);box-shadow:0 0 0 2px var(--durian)}
.hint3d{position:absolute;left:14px;top:62px;background:rgba(3,40,20,.72);color:#fff;font-size:11px;padding:7px 11px;border-radius:12px;max-width:240px;z-index:3;pointer-events:none}
@media (max-width:680px){.hint3d{display:none}}
#prompt3d{position:fixed;left:50%;bottom:calc(var(--sheet-peek,68px) + 14px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:12.5px;font-weight:700;opacity:0;transition:opacity .15s,bottom .2s;pointer-events:none;z-index:15}
#prompt3d.on{opacity:1}
#joy3d{position:fixed;bottom:calc(var(--sheet-peek,68px) + 20px);left:20px;width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,.4);border:4px solid rgba(255,255,255,.75);touch-action:none;z-index:15;display:none}
#joy3d .thumb{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.2)}
@media (hover:none){#joy3d{display:block}}
.toast3d{position:fixed;top:66px;right:14px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:14px;font-size:12.5px;z-index:60;max-width:300px;box-shadow:0 10px 24px rgba(0,0,0,.3);opacity:0;transform:translateY(-10px);transition:.25s}
.toast3d.on{opacity:1;transform:none}
/* ---------- decision sheet (bottom sheet, thu gọn/mở rộng) ---------- */
.dcard{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:min(100vw,460px);max-height:min(76vh,640px);max-height:min(76dvh,640px);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;box-shadow:0 -14px 40px -18px rgba(20,40,10,.55);z-index:20;display:flex;flex-direction:column;overflow:hidden;transform:translateY(calc(100% - var(--sheet-peek,68px)));transition:transform .25s cubic-bezier(.2,.8,.3,1)}
.dcard.open{transform:translateY(0)}
.dcard .peek{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;flex-shrink:0}
.dcard .peek img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--panel2);flex-shrink:0}
.dcard .peek .pk-txt{flex:1;min-width:0}
.dcard .peek b{font-size:12.5px;display:block}
.dcard .peek small{font-size:10.5px;color:var(--muted)}
.dcard .peek .chev{font-size:13px;color:var(--muted);transition:transform .2s}
.dcard.open .peek .chev{transform:rotate(180deg)}
.dcard .body3{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-height:0}
.dcard .hd{display:flex;gap:10px;align-items:flex-start;padding:4px 16px 6px}
.dcard .hd img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--panel2);flex-shrink:0}
.dcard .hd h3{font-size:14.5px;font-weight:900;color:var(--durian-deep)}
.dcard .hd .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.prog{display:flex;gap:4px;margin:6px 0}
.prog span{flex:1;height:5px;border-radius:4px;background:var(--line2)}
.prog span.done{background:var(--durian)}.prog span.now{background:var(--flesh)}
.dcard .goal{padding:0 16px;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 16px;margin-bottom:8px}
.stats4 .s{background:var(--panel2);border-radius:10px;padding:6px 4px;text-align:center}
.stats4 .s small{display:block;font-size:9.5px;color:var(--muted)}
.stats4 .s b{font-size:13px}
.tabs3{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.tabs3 button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:11.5px;padding:9px 4px;border-bottom:3px solid transparent;cursor:pointer}
.tabs3 button.on{color:var(--durian-deep);border-color:var(--durian)}
.tabbody{flex:1;overflow-y:auto;padding:10px 16px;min-height:100px}
.tabbody h4{font-size:12.5px;margin:8px 0 3px;color:var(--durian-deep)}
.tabbody p{font-size:12.5px;margin:0 0 6px;line-height:1.5}
.src{font-size:10.5px;color:var(--faint)}
.opt3{display:block;width:100%;text-align:left;border:1.5px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:10px;padding:8px 10px;margin:4px 0;font:inherit;font-size:12px;cursor:pointer}
.opt3.on{border-color:var(--durian);background:var(--durian-soft)}
.chips3{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px}
.chip3{border:1px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:999px;padding:5px 10px;font-size:11px;cursor:pointer}
.chip3.on{border-color:var(--durian);background:var(--flesh-soft);font-weight:700}
.chip3[disabled]{opacity:.4;cursor:not-allowed}
.mrow3{display:grid;grid-template-columns:1fr 70px 36px;gap:6px;align-items:center;margin:6px 0;font-size:11.5px}
.mrow3 input[type=range]{width:100%;accent-color:var(--durian)}
.lock3{color:var(--faint);font-size:10.5px}
.dcard .ft{padding:10px 16px 14px;border-top:1px solid var(--line);background:var(--panel2);flex-shrink:0}
.dcard .ft .alloc{font-size:11px;color:var(--muted);margin-bottom:8px}
.dcard .btn{display:block;width:100%;border:0;border-radius:12px;padding:11px;font-weight:800;font-size:13.5px;color:#fff;background:var(--durian);cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.dcard .btn:hover{background:var(--durian-deep)}
.dcard .fthint{font-size:10.5px;color:var(--muted);text-align:center;margin-top:5px}
/* ---------- minimap modal ---------- */
.mmBack{position:fixed;inset:0;background:rgba(3,40,20,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.mmBox{background:var(--panel);border-radius:20px;max-width:420px;width:100%;padding:18px;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.mmBox h3{font-size:15px;margin-bottom:4px}
.mmLegend{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--muted);margin:6px 0 10px}
.mmLegend span{display:inline-flex;align-items:center;gap:4px}
.mmLegend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.mmRow{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;align-items:center;margin:6px 0;font-size:12.5px}
.mmBar{height:8px;border-radius:5px;background:var(--tray);overflow:hidden}
.mmBar i{display:block;height:100%;background:linear-gradient(90deg,var(--durian),var(--flesh))}
.mmClose{margin-top:12px;width:100%;border:0;border-radius:12px;padding:10px;background:var(--panel2);color:var(--ink);font-weight:700;cursor:pointer}
/* ---------- empty / end states ---------- */
.wrap{max-width:720px;margin:0 auto;padding:90px 16px 40px;overflow-y:auto;height:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;text-align:center}
.card h1{font-size:22px;margin-bottom:8px}
.card p{color:var(--muted);margin-bottom:14px}
.card .btn{display:inline-block;border:0;border-radius:12px;padding:11px 20px;font-weight:800;color:#fff;background:var(--durian);text-decoration:none}
.flags2{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.flags2 span{font-size:12px;border-radius:10px;padding:4px 9px;border:1px solid var(--line2);background:var(--panel2)}
.flags2 span.win{border-color:var(--durian)}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">🌳 <span id="brandName">Hộ Chiếu Sầu Riêng</span></div>
  <span class="avatar-badge" id="avatarBadge"></span>
  <div class="spacer"></div>
  <button class="tbtn" id="voiceBtn" type="button" hidden>🔊 <span id="voiceLbl"></span></button>
  <button class="tbtn" id="mapBtn" type="button" hidden>🗺️ <span id="mapLbl"></span></button>
  <a class="tbtn" href="ho-chieu-sau-rieng.html" id="cardLink">📋 Bản thẻ</a>
  <div class="lang-pill"><button id="langVI" class="on" type="button">VI</button><button id="langEN" type="button">EN</button></div>
</div>

<div id="app"></div>

<script src="ho-chieu-sau-rieng-engine.js"></script>
<script src="ho-chieu-sau-rieng-data.js"></script>
<script type="module">
import * as THREE from '../js/vendor/three.module.js';
import { P3 } from '../js/poly3d-kit.js';

(function () {
  'use strict';
  const E = window.DurianEngine, D = window.DurianData;
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const IMG = p => '../assets/character/' + p;
  const SAVE_KEY = 'durian_class_v2';

  let LANG = store.get('durian_lang') === 'en' ? 'en' : 'vi';
  const L = (vi, en) => (LANG === 'en' ? en : vi);
  const nm = o => (LANG === 'en' ? o.en : o.vi);
  const nf = (x, d) => (Number.isFinite(x) ? x : 0).toLocaleString(LANG === 'vi' ? 'vi-VN' : 'en-US', { maximumFractionDigits: d || 0, minimumFractionDigits: d || 0 });
  const pct = x => nf(x * 100) + '%';
  const money = x => nf(x, 2) + ' ' + L('tỷ', 'bn');
  const fact = k => { const f = D.facts[k]; return f ? `${nm(f)} <span class="src">[${f.src}]</span>` : ''; };
  const CH_IDS = D.channels.map(c => c.id);
  const owned = (a, id) => (id === 'area' && a.area) || (id === 'pack' && a.pack) || (id === 'trace' && a.trace) || (id === 'freezer' && a.freezer) || (id === 'test' && a.test >= 2);

  let APP = null, RIVALS = null, TAB = 'chain', sheetOpen = false;
  let world = null; // instance Three.js của bản đồ 3D hiện tại (dispose khi re-render)

  function load() {
    const raw = store.get(SAVE_KEY);
    if (!raw) return null;
    try { const x = JSON.parse(raw); return x && x.game && x.roleId ? x : null; } catch (e) { return null; }
  }
  function boot(app) {
    APP = app;
    RIVALS = E.rivalsRun(D, APP.roleId, APP.seed);
    APP.flags = APP.game.history.map(r => E.flagFor(RIVALS, r));
  }
  const save = () => { if (APP) store.set(SAVE_KEY, JSON.stringify(APP)); };

  // ---------------- khung chung ----------------
  function chrome() {
    document.title = L('Hộ Chiếu Sầu Riêng · Bản đồ 3D', 'Sầu Riêng Passport · 3D map');
    $('brandName').textContent = L('Hộ Chiếu Sầu Riêng', 'Sầu Riêng Passport');
    $('cardLink').textContent = '📋 ' + L('Bản thẻ', 'Card view');
    $('langVI').classList.toggle('on', LANG === 'vi'); $('langEN').classList.toggle('on', LANG === 'en');
    document.documentElement.lang = LANG;
    const av = APP && APP.avatarId ? D.avatars.find(a => a.id === APP.avatarId) : null;
    const badge = $('avatarBadge');
    badge.classList.toggle('on', !!av);
    badge.innerHTML = av ? `<img src="../assets/${av.img}" alt="${esc(nm(av))}"><span>${esc(nm(av))}</span>` : '';
  }
  $('langVI').onclick = () => { LANG = 'vi'; store.set('durian_lang', 'vi'); render(); };
  $('langEN').onclick = () => { LANG = 'en'; store.set('durian_lang', 'en'); render(); };

  // ---------------- giọng đọc ----------------
  const canSpeak = typeof window !== 'undefined' && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
  let speaking = false;
  function toggleVoice() {
    if (!canSpeak) { toast(L('Trình duyệt này không hỗ trợ đọc giọng nói.', 'This browser does not support voice reading.')); return; }
    if (speaking) { speechSynthesis.cancel(); speaking = false; updateVoiceBtn(); return; }
    const g = APP.game, s = D.seasons[g.n - 1], ev = E.eventFor(D, g);
    const text = [nm(s), LANG === 'en' ? s.textEn : s.textVi, ev ? (nm(ev) + '. ' + (LANG === 'en' ? ev.textEn : ev.textVi)) : ''].filter(Boolean).join('. ');
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LANG === 'en' ? 'en-US' : 'vi-VN';
    u.onend = u.onerror = () => { speaking = false; updateVoiceBtn(); };
    speechSynthesis.cancel(); speechSynthesis.speak(u); speaking = true; updateVoiceBtn();
  }
  function updateVoiceBtn() { $('voiceLbl').textContent = L(speaking ? 'Đang đọc vườn…' : 'Nghe vườn', speaking ? 'Reading…' : 'Listen'); $('voiceBtn').classList.toggle('on', speaking); }

  let toastT;
  function toast(msg) {
    let el = $('toast3d');
    if (!el) { el = document.createElement('div'); el.id = 'toast3d'; el.className = 'toast3d'; document.body.appendChild(el); }
    el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 3600);
  }

  // ---------------- minimap (phân bổ kênh %) ----------------
  function openMinimap() {
    const g = APP.game, s = D.seasons[g.n - 1];
    const okIds = CH_IDS.filter(id => E.eligible(D, g, D.channels.find(c => c.id === id)));
    const norm = E.normalizeAlloc(Object.fromEntries(okIds.map(id => [id, APP.dec.alloc[id]])), okIds);
    const back = document.createElement('div'); back.className = 'mmBack';
    back.innerHTML = `<div class="mmBox">
      <h3>🗺️ ${L('Phân bổ sản lượng theo kênh', 'Output split by channel')}</h3>
      <p class="small" style="font-size:11.5px;color:var(--muted)">${L('Vụ', 'Season')} ${g.n}/6 · ${nm(s)}</p>
      <div class="mmLegend">
        <span><i style="background:var(--durian)"></i>${L('Việt Nam · xuất phát', 'Vietnam · origin')}</span>
        <span><i style="background:var(--flesh)"></i>${L('Kênh đang chọn', 'Selected channel')}</span>
        <span><i style="background:#B9C7B9"></i>${L('Đối thủ đang hỏi mua', 'Rivals inquiring')}</span>
      </div>
      ${D.channels.map(c => { const e = okIds.includes(c.id), v = e ? norm[c.id] : 0;
        return `<div class="mmRow"><span>${c.emoji} ${nm(c)}</span><div class="mmBar"><i style="width:${Math.round(v * 100)}%"></i></div><span class="num">${e ? pct(v) : '🔒'}</span></div>`; }).join('')}
      <p class="small" style="font-size:11px;color:var(--muted);margin-top:8px">${L('Singapore (Wei Ming · Merlion Fresh) và Châu Âu (Stefan · EuroFrost) chỉ là đối thủ AI đang mua gom quanh khu vực — hai kênh này chưa mở trong 6 vụ.', 'Singapore (Wei Ming · Merlion Fresh) and Europe (Stefan · EuroFrost) are AI rivals buying nearby — these are not channels open to you in these 6 seasons.')}</p>
      <button class="mmClose" type="button">${L('Đóng', 'Close')}</button></div>`;
    document.body.appendChild(back);
    back.querySelector('.mmClose').onclick = () => back.remove();
    back.onclick = e => { if (e.target === back) back.remove(); };
  }

  // ---------------- định nghĩa trạm ----------------
  const SHORT_CH = {
    CN: ['Chính ngạch', 'Official'], BORDER: ['Biên giới', 'Border'], FROZEN: ['Đông lạnh', 'Frozen'],
    TW: ['Đài Loan', 'Taiwan'], JP: ['Nhật Bản', 'Japan'], DOM: ['Nội địa', 'Domestic']
  };
  const CH_TINT = { CN: 0xE0954A, BORDER: 0xC9A96E, FROZEN: 0x6fa3c9, TW: 0x6fae8f, JP: 0xd98fae, DOM: 0xd9955f };
  const EVENT_ICON = { break: '🙅', rain: '🌧️', salinity: '🌊', fake: '🎭', pest: '🐛', glut: '🚦', residue: '⚠️', thaidrought: '🌵' };

  function stationDef(g, s) {
    const okIds = CH_IDS.filter(id => E.eligible(D, g, D.channels.find(c => c.id === id)));
    const chStn = D.channels.map((c, i) => {
      const pos = { CN: [24, 30], BORDER: [13, 42], FROZEN: [21, 16], TW: [17, 58], JP: [41, 10], DOM: [70, 44] }[c.id] || [50, 50];
      const [vi, en] = SHORT_CH[c.id] || [c.vi, c.en];

    document.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => { dec.option = +b.dataset.opt; save(); renderCard(); });
    document.querySelectorAll('[data-intel]').forEach(b => b.onclick = () => {
      const id = b.dataset.intel, had = dec.intel.includes(id);
      dec.intel = had ? dec.intel.filter(x => x !== id) : dec.intel.concat([id]).slice(0, 2);
      save(); renderCard();
    });
    document.querySelectorAll('[data-pri]').forEach(b => b.onclick = () => { dec.priority = b.dataset.pri; save(); renderCard(); });
    document.querySelectorAll('[data-ind]').forEach(b => b.onclick = () => { dec.induce = b.dataset.ind === '1'; save(); renderCard(); });

        dec.alloc[r.dataset.ch] = +r.value;

  function buildZoneDecor(zone) {
    const g = new THREE.Group();
    const crateColors = [0xcf7a3a, 0xb5632a, 0xe0954a];
    if (zone.id === 'BORDER') {
      const b = P3.building(THREE, { w: 1.8, d: 1.6, h: 1.4, wallColor: 0xe9ecef, roofColor: zone.roof || 0xc9a96e, roofType: 'gable' });
      b.position.x = -1.6; g.add(b);
      const postMat = new THREE.MeshStandardMaterial({ color: 0xd94f4f, roughness: 0.6 });
      const post1 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.2, 8), postMat);
      post1.position.set(1.2, 0.6, -0.8); post1.castShadow = true; g.add(post1);
      const post2 = post1.clone(); post2.position.set(1.2, 0.6, 0.8); g.add(post2);
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.8, 8), postMat);
      bar.rotation.z = Math.PI / 2; bar.position.set(1.2, 1.05, 0); bar.castShadow = true; g.add(bar);
      const officer = P3.character(THREE, { shirt: 0x2f4a6b, hat: 'mũ cứng', hatColor: 0xe6b84a });
      officer.position.set(0.3, 0, -1.4); officer.rotation.y = 1.8; g.add(officer);
    } else if (zone.id === 'FROZEN') {
      const b = P3.building(THREE, { w: 2.2, d: 1.8, h: 1.6, wallColor: 0xeaf4fb, roofColor: zone.roof || 0x6fa3c9, roofType: 'flat' });
      g.add(b);
      [[1.6, 1.1], [2.0, 0.7], [1.4, 0.6]].forEach(([x, z], i) => {
        const c = P3.crate(THREE, { size: 0.42, color: [0x6fa3c9, 0x8fbfe0][i % 2] });
        c.position.set(x, 0.21, z); c.rotation.y = Math.random() * 0.5; g.add(c);
      });
      const p = P3.character(THREE, { shirt: 0x6fa3c9, hat: 'none' });
      p.position.set(-1.7, 0, 1); p.rotation.y = -0.8; g.add(p);
    } else if (zone.id === 'trader') {
      const b = P3.building(THREE, { w: 2, d: 1.7, h: 1.2, wallColor: 0xf3eee1, roofColor: zone.roof || 0xe0954a, roofType: 'flat' });
      g.add(b);
      ['Thương lái 1', 'Thương lái 2'].forEach((_, i) => {
        const p = P3.character(THREE, { shirt: [0x3f7d3a, 0xcf7a3a][i], hat: 'none' });
        p.position.set(1.6 + i * 0.7, 0, 0.9 - i * 0.6); p.rotation.y = 0.6 + i;
        g.add(p);
      });
      [[1.3, 1.5]].forEach(([x, z]) => {
        const c = P3.crate(THREE, { size: 0.4, color: crateColors[0] });
        c.position.set(x, 0.2, z); g.add(c);
      });
    } else if (zone.theme === 'city' || zone.theme === 'market' || zone.theme === 'office') {
      const roofType = zone.theme === 'office' ? 'flat' : 'gable';
      const b = P3.building(THREE, { w: 2.3, d: 1.9, h: 1.5, wallColor: 0xf3eee1, roofColor: zone.roof || 0xb5523a, roofType });
      g.add(b);

  function makeBillboard(url, fallbackUrl, h) {
    const loader = new THREE.TextureLoader();
    const mat = new THREE.SpriteMaterial({ transparent: true });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(h * 0.78, h, 1);
    sprite.position.y = h / 2;
    const apply = tex => { tex.colorSpace = THREE.SRGBColorSpace; mat.map = tex; mat.needsUpdate = true; };
    loader.load(url, apply, undefined, () => { if (fallbackUrl) loader.load(fallbackUrl, apply); });
    return sprite;
  }

  function setupWorld() {
    disposeWorld();
    const container = $('world3d'), labelsEl = $('labels3d');
    const g = APP.game, s = D.seasons[g.n - 1];
    const stns = stationDef(g, s);
    const CX = 46, CY = 34, K = 0.5;
    const ZONES = [{ id: 'sau', name: L('Bà Sáu Lành', 'Bà Sáu Lành'), x: CX, y: CY, hub: true }].concat(stns);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#bfe3ef');
    scene.fog = new THREE.Fog('#bfe3ef', 22, 75);
    const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    P3.lights(THREE, scene);
    const bigGrass = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), new THREE.MeshStandardMaterial({ color: 0x9fc27e, roughness: 1 }));
    bigGrass.rotation.x = -Math.PI / 2; bigGrass.receiveShadow = true; scene.add(bigGrass);

    ZONES.forEach(zone => {
      zone.wx = (zone.x - CX) * K; zone.wz = (zone.y - CY) * K;
      const decor = new THREE.Group();
      if (zone.hub) {
        const leafColors = [0x3f7d3a, 0x4c8f43, 0x366b33];
        for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
          const t = P3.durianTree(THREE, { scale: 0.5 + Math.random() * 0.18, leafColor: leafColors[(r + c) % 3] });
          t.position.set((c - 1) * 2.2 + (Math.random() - 0.5) * 0.4, 0, (r - 1) * 2.2 + (Math.random() - 0.5) * 0.4);
          t.rotation.y = Math.random() * Math.PI * 2;
          decor.add(t);
        }
        const mood = g.history.length ? (g.history[g.history.length - 1].profit >= 0 ? 'vui' : 'lo') : 'vui';
        decor.add(makeBillboard(`../assets/hc/cast/ba-sau-lanh-${mood}-cut.webp`, IMG('advisors/ba-sau-lanh-cut.webp'), 2.1));
      } else if (zone.rival) {
        decor.add(buildZoneDecor(zone));
        decor.add(makeBillboard(zone.img, IMG('advisors/ba-sau-lanh-cut.webp'), 1.8));
      } else {
        decor.add(buildZoneDecor(zone));
      }
      if (zone.locked || zone.pale) {
        decor.traverse(o => { if (o.material) { o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = 0.5; } });
      }
      decor.position.set(zone.wx, 0, zone.wz);
      scene.add(decor);
      zone.decor = decor;

      if (!zone.hub) {
        const dist = Math.hypot(zone.wx, zone.wz);
        if (dist > 0.1) {
          const path = P3.road(THREE, { length: dist, width: 1.1, color: 0xd8c9a6 });
          path.position.set(zone.wx / 2, 0, zone.wz / 2);
          path.rotation.y = Math.atan2(zone.wx, zone.wz);
          scene.add(path);
        }
      }

      zone.worldPos = new THREE.Vector3(zone.wx, 1.8, zone.wz);
      zone.el = document.createElement('div');
      zone.el.className = 'lbl3d' + (zone.locked ? ' locked' : '') + (zone.pale ? ' pale' : '') + (zone.active ? ' active' : '');
      zone.el.textContent = (zone.icon ? zone.icon + ' ' : '') + zone.name + (zone.locked ? ' 🔒' : '');
      zone.el.onclick = () => { if (zone === nearZone) interact(zone); };
      labelsEl.appendChild(zone.el);
    });

    refreshStationVisuals = () => {
      const okIds = CH_IDS.filter(id => E.eligible(D, g, D.channels.find(c => c.id === id)));
      ZONES.forEach(z => {
        if (z.hub || !D.channels.find(c => c.id === z.id)) return;
        const active = (APP.dec.alloc[z.id] || 0) > 0;
        z.active = active;
        z.el.classList.toggle('active', active);
      });
    };

    // nhân vật người chơi (billboard theo avatar đã chọn, hoặc hình khối mặc định)
    const player = new THREE.Group();
    const av = APP.avatarId ? D.avatars.find(a => a.id === APP.avatarId) : null;
    if (av) player.add(makeBillboard(`../assets/${av.img.replace(/\.webp$/, '-cut.webp')}`, IMG('advisors/ba-sau-lanh-cut.webp'), 1.7));
    else player.add(P3.character(THREE, { shirt: 0xd94f4f }));
    player.position.set(0, 0, 4);
    scene.add(player);

    const camOffset = new THREE.Vector3(0, 6.4, 8.8);
    function updateCamera(instant) {
      const desired = player.position.clone().add(camOffset);
      if (instant) camera.position.copy(desired); else camera.position.lerp(desired, 0.09);
      camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
    }
    updateCamera(true);

    const keys = {};
    const onKeyDown = e => { keys[e.key.toLowerCase()] = true; if (e.key.toLowerCase() === 'e' && nearZone) interact(nearZone); };
    const onKeyUp = e => { keys[e.key.toLowerCase()] = false; };
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);

    const joyEl = $('joy3d'), thumbEl = joyEl.querySelector('.thumb');
    let joyVec = { x: 0, y: 0 }, joyDrag = false, joyId = null, joyC = { x: 0, y: 0 };
    const onJoyDown = e => { joyDrag = true; joyId = e.pointerId; joyEl.setPointerCapture(joyId); const r = joyEl.getBoundingClientRect(); joyC = { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
    const onJoyMove = e => { if (!joyDrag || e.pointerId !== joyId) return; let dx = e.clientX - joyC.x, dy = e.clientY - joyC.y, d = Math.hypot(dx, dy); if (d > 40) { dx *= 40 / d; dy *= 40 / d; } thumbEl.style.transform = `translate(${dx}px,${dy}px)`; joyVec = { x: dx / 40, y: dy / 40 }; };
    const onJoyRelease = e => { if (e.pointerId !== joyId) return; joyDrag = false; joyId = null; thumbEl.style.transform = ''; joyVec = { x: 0, y: 0 }; };
    joyEl.addEventListener('pointerdown', onJoyDown);
    joyEl.addEventListener('pointermove', onJoyMove);
    joyEl.addEventListener('pointerup', onJoyRelease);
    joyEl.addEventListener('pointercancel', onJoyRelease);

    let nearZone = null;
    const promptEl = $('prompt3d');
    function interact(zone) {
      if (zone.hub) { openSheetToTab('chain'); return; }
      if (zone.rival) { rivalToast(zone.rival); return; }
      if (zone.id === 'audit') { openSheetToTab('chain'); return; }
      if (zone.id === 'trader') { openSheetToTab('invest'); toast('🤝 ' + (LANG === 'en' ? D.sourcingTheory.en : D.sourcingTheory.vi)); return; }
      const ch = D.channels.find(c => c.id === zone.id);
      if (ch) { openSheetToTab('channel', '#ch-' + ch.id); toast(`${ch.emoji} ${nm(ch)} — ${nm(D.entryModes[ch.entryMode])}`); return; }
    }

    const SPEED = 5.4;
    let playerFacing = 0, last = performance.now();
    function loop(now) {
      world.raf = requestAnimationFrame(loop);
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      let mx = 0, mz = 0;
      if (keys['w'] || keys['arrowup']) mz -= 1;
      if (keys['s'] || keys['arrowdown']) mz += 1;
      if (keys['a'] || keys['arrowleft']) mx -= 1;
      if (keys['d'] || keys['arrowright']) mx += 1;
      mx += joyVec.x; mz += joyVec.y;
      const len = Math.hypot(mx, mz);
      if (len > 0.05) {
        mx /= len || 1; mz /= len || 1;
        player.position.x += mx * SPEED * dt;
        player.position.z += mz * SPEED * dt;
        const targetFacing = Math.atan2(mx, mz);
        let diff = targetFacing - playerFacing;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        playerFacing += diff * Math.min(1, dt * 10);
        player.rotation.y = playerFacing;
      }
      player.position.x = Math.max(-34, Math.min(34, player.position.x));
      player.position.z = Math.max(-46, Math.min(10, player.position.z));
      updateCamera(false);

      let closest = null, closestD = Infinity;
      ZONES.forEach(zone => {
        const v = zone.worldPos.clone().project(camera);
        const visible = v.z < 1;
        zone.el.style.display = visible ? 'block' : 'none';
        zone.el.style.left = ((v.x * 0.5 + 0.5) * innerWidth) + 'px';
        zone.el.style.top = ((-v.y * 0.5 + 0.5) * innerHeight) + 'px';
        const d = Math.hypot(zone.wx - player.position.x, zone.wz - player.position.z);
        if (d < closestD) { closestD = d; closest = zone; }
      });
      const NEAR_R = 3.3;
      if (closest && closestD < NEAR_R) {
        if (nearZone !== closest) nearZone = closest;
        closest.el.classList.add('near');
        promptEl.textContent = `${closest.icon ? closest.icon + ' ' : ''}${closest.name} · ${L('Nhấn E / chạm nhãn để vào', 'Press E / tap label to enter')}`;
        promptEl.classList.add('on');
      } else {
        if (nearZone) nearZone.el.classList.remove('near');
        nearZone = null;
        promptEl.classList.remove('on');
      }
      ZONES.forEach(z => { if (z !== nearZone) z.el.classList.remove('near'); });

      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }
    window.addEventListener('resize', onResize);

    world = { renderer, container, labelsEl, onResize, raf: 0 };
    requestAnimationFrame(loop);
  }

  function renderEmpty() {
    disposeWorld(); chrome(); $('voiceBtn').hidden = true; $('mapBtn').hidden = true;
    $('app').innerHTML = `<div class="wrap"><div class="card">
      <h1>🌳 ${L('Chưa có đội nào đang chơi', 'No team in progress yet')}</h1>
      <p>${L('Bản đồ 3D dùng chung dữ liệu với bản thẻ — hãy lập đội và vào vụ 1 ở bản thẻ trước, rồi quay lại đây để khám phá bản đồ.', 'The 3D map shares data with the card view — set up your team and start season 1 there first, then come back here to explore the map.')}</p>
      <a class="btn" href="ho-chieu-sau-rieng.html">${L('Sang bản thẻ để lập đội →', 'Go to the card view to set up →')}</a>
    </div></div>`;
  }
  function renderPendingJournal() {
    disposeWorld(); chrome(); $('voiceBtn').hidden = true; $('mapBtn').hidden = true;
    const n = APP.game.history.length;
    $('app').innerHTML = `<div class="wrap"><div class="card">
      <h1>📝 ${L('Cần ghi nhật ký SEC trước', 'SEC journal needed first')}</h1>
      <p>${L(`Vụ ${n} đã chốt. Hãy ghi nhật ký SEC ở bản thẻ trước khi bản đồ mở sang vụ tiếp theo.`, `Season ${n} is committed. Write the SEC journal in the card view before the map opens the next season.`)}</p>
      <a class="btn" href="ho-chieu-sau-rieng.html">${L('Sang bản thẻ để ghi nhật ký →', 'Go to the card view to journal →')}</a>
    </div></div>`;
  }
  function renderDone() {
    disposeWorld(); chrome(); $('voiceBtn').hidden = true; $('mapBtn').hidden = true;
    const flagsWon = APP.flags.filter(f => f && f.win).length;
    $('app').innerHTML = `<div class="wrap"><div class="card">
      <h1>🏁 ${L('Hành trình 6 vụ đã hoàn tất', 'The 6-season journey is complete')}</h1>
      <div class="flags2">${D.seasons.map((s, i) => { const f = APP.flags[i]; return `<span class="${f && f.win ? 'win' : ''}">${f ? (f.win ? '🟩' : '🟥') : '⬜'} ${L('Vụ', 'S')}${i + 1}</span>`; }).join('')}</div>
      <p>${L(`Đội cắm ${flagsWon}/6 cờ. Xem báo cáo đầy đủ và xuất CSV ở bản thẻ.`, `Your team planted ${flagsWon}/6 flags. See the full report and export CSV in the card view.`)}</p>
      <a class="btn" href="ho-chieu-sau-rieng.html">${L('Xem báo cáo cuối →', 'See the final report →')}</a>
    </div></div>`;
  }

  function render() {
    APP = load();
    if (!APP) return renderEmpty();
    boot(APP);
    if (APP.game.history.length > 0 && !APP.journals[APP.game.history.length]) return renderPendingJournal();
    if (APP.game.n > D.seasons.length) return renderDone();
    TAB = 'chain';
    renderMap();
  }

  render();
})();
</script>
</body>
