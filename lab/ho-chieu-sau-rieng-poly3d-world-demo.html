<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo bản đồ 3D liền mạch · Hộ chiếu sầu riêng</title>
<style>
  html,body{margin:0;height:100%;background:#bfe3ef;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
  canvas{display:block;touch-action:none}
  #hud{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:3}
  #hud .pill{pointer-events:auto;background:rgba(255,255,255,.92);border-radius:14px;padding:10px 14px;font-size:13px;font-weight:700;color:#174d2e;box-shadow:0 6px 16px -8px rgba(0,0,0,.3)}
  #hud .hint{font-weight:500;color:#45604f}
  .lbl{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.92);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:800;color:#174d2e;white-space:nowrap;pointer-events:none;box-shadow:0 4px 10px -4px rgba(0,0,0,.3);transition:box-shadow .15s,transform .15s}
  .lbl.near{box-shadow:0 0 0 3px #ffb703,0 4px 10px -4px rgba(0,0,0,.4)}
  #prompt{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#174d2e;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:opacity .15s;pointer-events:none;z-index:4}
  #prompt.on{opacity:1}
  #joy{position:fixed;bottom:24px;left:24px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.35);border:4px solid rgba(255,255,255,.7);touch-action:none;z-index:4;display:none}
  #joy .thumb{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.2)}
  #toast{position:fixed;top:70px;right:14px;background:#174d2e;color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;max-width:280px;z-index:4;opacity:0;transform:translateY(-14px);transition:.25s}
  #toast.on{opacity:1;transform:none}
  @media (hover:none){#joy{display:block}}
</style>
</head>
<body>
<div id="hud">
  <div class="pill">🚶 Demo bản đồ 3D liền mạch · Hộ chiếu sầu riêng<br><span class="hint">Desktop: WASD/mũi tên di chuyển, E tương tác · Di động: joystick góc trái, chạm nhãn trạm</span></div>
</div>
<div id="labels"></div>
<div id="prompt"></div>
<div id="toast"></div>
<div id="joy"><div class="thumb"></div></div>
<script type="module">
import * as THREE from '../js/vendor/three.module.js';
import { P3 } from '../js/poly3d-kit.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color('#bfe3ef');
scene.fog = new THREE.Fog('#bfe3ef', 20, 70);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

P3.lights(THREE, scene);

// ---------- Nền lớn (bãi cỏ chung) ----------
const bigGrass = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), new THREE.MeshStandardMaterial({ color: 0x9fc27e, roughness: 1 }));
bigGrass.rotation.x = -Math.PI / 2;
bigGrass.receiveShadow = true;
scene.add(bigGrass);

// ---------- Định nghĩa các trạm (toạ độ thế giới x,z) ----------
const ZONES = [
  { id: 'sau', name: '🌳 Vườn sầu riêng', x: 0, z: 0, theme: 'farm' },
  { id: 'trader', name: '🤝 Tiểu thương', x: -11, z: -7, theme: 'market' },
  { id: 'audit', name: '🧾 Đối soát', x: 11, z: -7, theme: 'office' },
  { id: 'BORDER', name: '🛂 Biên giới', x: -11, z: -18, theme: 'border' },
  { id: 'FROZEN', name: '🧊 Kho lạnh', x: 11, z: -18, theme: 'frozen' },
  { id: 'CN', name: '🇨🇳 Trung Quốc', x: -22, z: -29, theme: 'city' },
  { id: 'TW', name: '🇹🇼 Đài Loan', x: 0, z: -29, theme: 'city' },
  { id: 'JP', name: '🇯🇵 Nhật Bản', x: 22, z: -29, theme: 'city' },
  { id: 'DOM', name: '🏠 Nội địa', x: 0, z: -40, theme: 'market' },
  { id: 'rv_sea', name: '🇸🇬 Singapore', x: -16, z: -40, theme: 'outpost' },
  { id: 'rv_eu', name: '🇪🇺 Châu Âu', x: 16, z: -40, theme: 'outpost' },
];

const roofByTheme = { farm: null, market: 0xe0954a, office: 0x6f9bb0, border: 0xb5523a, frozen: 0x6fa3c9, city: 0xc74b4b, outpost: 0x7a4fae };

function buildZoneDecor(zone) {
  const g = new THREE.Group();
  if (zone.theme === 'farm') {
    const leafColors = [0x3f7d3a, 0x4c8f43, 0x366b33];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
      const t = P3.durianTree(THREE, { scale: 0.55 + Math.random() * 0.2, leafColor: leafColors[(r + c) % 3] });
      t.position.set((c - 1) * 2.4 + (Math.random() - 0.5) * 0.4, 0, (r - 1) * 2.4 + (Math.random() - 0.5) * 0.4);
      t.rotation.y = Math.random() * Math.PI * 2;
      g.add(t);
    }
    const farmer = P3.character(THREE, { shirt: 0x5b7fae, basket: true });
    farmer.position.set(2.6, 0, 1.6); farmer.rotation.y = -0.6;
    g.add(farmer);
  } else if (zone.theme === 'market' || zone.theme === 'city' || zone.theme === 'outpost') {
    const b = P3.building(THREE, { w: 2.4, d: 2, h: 1.5, wallColor: 0xf3eee1, roofColor: roofByTheme[zone.theme], roofType: zone.theme === 'outpost' ? 'flat' : 'gable' });
    g.add(b);
    const p = P3.character(THREE, { shirt: [0x3f7d3a, 0xcf7a3a, 0x7a4fae][Math.floor(Math.random() * 3)] });
    p.position.set(1.8, 0, 1.2); p.rotation.y = Math.random() * Math.PI * 2;
    g.add(p);
  } else if (zone.theme === 'office') {
    const b = P3.building(THREE, { w: 2, d: 1.8, h: 1.7, wallColor: 0xe9ecef, roofColor: roofByTheme.office, roofType: 'flat' });
    g.add(b);
    const p = P3.character(THREE, { shirt: 0x2f4a6b, hat: 'none' });
    p.position.set(-1.6, 0, 0.8); p.rotation.y = 1.2;
    g.add(p);
  } else if (zone.theme === 'border') {
    const b = P3.building(THREE, { w: 1.8, d: 1.6, h: 1.4, wallColor: 0xe9ecef, roofColor: roofByTheme.border, roofType: 'gable' });
    b.position.x = -1.6; g.add(b);
    const postMat = new THREE.MeshStandardMaterial({ color: 0xd94f4f, roughness: 0.6 });
    const post1 = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.2, 8), postMat);
    post1.position.set(1.2, 0.6, -0.8); g.add(post1);
    const post2 = post1.clone(); post2.position.set(1.2, 0.6, 0.8); g.add(post2);
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.8, 8), postMat);
    bar.rotation.z = Math.PI / 2; bar.position.set(1.2, 1.05, 0); g.add(bar);
    const officer = P3.character(THREE, { shirt: 0x2f4a6b, hat: 'mũ cứng', hatColor: 0xe6b84a });
    officer.position.set(0.3, 0, -1.4); officer.rotation.y = 1.8; g.add(officer);
  } else if (zone.theme === 'frozen') {
    const b = P3.building(THREE, { w: 2.2, d: 1.8, h: 1.6, wallColor: 0xeaf4fb, roofColor: roofByTheme.frozen, roofType: 'flat' });
    g.add(b);
    const colors = [0x6fa3c9, 0x8fbfe0];
    [[1.6, 1.1], [2.0, 0.7], [1.4, 0.6]].forEach(([x, z], i) => {
      const c = P3.crate(THREE, { size: 0.45, color: colors[i % 2] });
      c.position.set(x, 0.225, z); g.add(c);
    });
  }
  return g;
}

ZONES.forEach(zone => {
  const decor = buildZoneDecor(zone);
  decor.position.set(zone.x, 0, zone.z);
  scene.add(decor);

  // Đường đất nhỏ nối trạm với gốc vườn (chỉ để tạo cảm giác lối đi)
  const dx = zone.x, dz = zone.z;
  const dist = Math.hypot(dx, dz);
  if (dist > 0.1) {
    const path = P3.road(THREE, { length: dist, width: 1.4, color: 0xd8c9a6 });
    path.position.set(dx / 2, 0, dz / 2);
    path.rotation.y = Math.atan2(dx, dz);
    scene.add(path);
  }

  zone.worldPos = new THREE.Vector3(zone.x, 1.6, zone.z);
  zone.el = document.createElement('div');
  zone.el.className = 'lbl';
  zone.el.textContent = zone.name;
  document.getElementById('labels').appendChild(zone.el);
});

// ---------- Nhân vật người chơi ----------
const player = P3.character(THREE, { shirt: 0xd94f4f, hat: 'none' });
player.position.set(0, 0, 4);
scene.add(player);
let playerFacing = 0;

// ---------- Camera bám sau nhân vật (third-person) ----------
const camOffset = new THREE.Vector3(0, 6.2, 8.5);
function updateCamera(instant) {
  const desired = player.position.clone().add(camOffset);
  if (instant) camera.position.copy(desired);
  else camera.position.lerp(desired, 0.08);
  camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
}
updateCamera(true);

// ---------- Điều khiển: WASD/mũi tên + joystick chạm ----------
const keys = {};
addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

const joyEl = document.getElementById('joy');
const thumbEl = joyEl.querySelector('.thumb');
let joyVec = { x: 0, y: 0 }, joyDrag = false, joyId = null, joyC = { x: 0, y: 0 };
joyEl.addEventListener('pointerdown', e => {
  joyDrag = true; joyId = e.pointerId; joyEl.setPointerCapture(joyId);
  const r = joyEl.getBoundingClientRect(); joyC = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
});
joyEl.addEventListener('pointermove', e => {
  if (!joyDrag || e.pointerId !== joyId) return;
  let dx = e.clientX - joyC.x, dy = e.clientY - joyC.y, d = Math.hypot(dx, dy);
  if (d > 42) { dx *= 42 / d; dy *= 42 / d; }
  thumbEl.style.transform = `translate(${dx}px,${dy}px)`;
  joyVec = { x: dx / 42, y: dy / 42 };
});
const joyRelease = e => { if (e.pointerId !== joyId) return; joyDrag = false; joyId = null; thumbEl.style.transform = ''; joyVec = { x: 0, y: 0 }; };
joyEl.addEventListener('pointerup', joyRelease);
joyEl.addEventListener('pointercancel', joyRelease);

// ---------- Phát hiện gần trạm + tương tác ----------
let nearZone = null;
const promptEl = document.getElementById('prompt');
const toastEl = document.getElementById('toast');
let toastT;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 2600);
}
function interact() {
  if (!nearZone) return;
  toast(`(demo) Mở trạm: ${nearZone.name} — ở bản thật sẽ hiện thẻ quyết định như hiện tại.`);
}
addEventListener('keydown', e => { if (e.key.toLowerCase() === 'e') interact(); });
document.getElementById('labels').addEventListener('pointerdown', e => {
  const z = ZONES.find(z => z.el === e.target);
  if (z && z === nearZone) interact();
});

// ---------- Vòng lặp ----------
const SPEED = 5.2;
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  let mx = 0, mz = 0;
  if (keys['w'] || keys['arrowup']) mz -= 1;
  if (keys['s'] || keys['arrowdown']) mz += 1;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  mx += joyVec.x; mz += joyVec.y;
  const len = Math.hypot(mx, mz);
  if (len > 0.05) {
    mx /= len || 1; mz /= len || 1;
    player.position.x += mx * SPEED * dt;
    player.position.z += mz * SPEED * dt;
    const targetFacing = Math.atan2(mx, mz);
    let diff = targetFacing - playerFacing;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    playerFacing += diff * Math.min(1, dt * 10);
    player.rotation.y = playerFacing;
  }
  // giới hạn trong vùng bản đồ
  player.position.x = Math.max(-34, Math.min(34, player.position.x));
  player.position.z = Math.max(-46, Math.min(10, player.position.z));

  updateCamera(false);

  // nhãn trạm: chiếu toạ độ 3D -> màn hình + phát hiện gần
  let closest = null, closestD = Infinity;
  ZONES.forEach(zone => {
    const v = zone.worldPos.clone().project(camera);
    const sx = (v.x * 0.5 + 0.5) * innerWidth;
    const sy = (-v.y * 0.5 + 0.5) * innerHeight;
    const visible = v.z < 1;
    zone.el.style.display = visible ? 'block' : 'none';
    zone.el.style.left = sx + 'px';
    zone.el.style.top = sy + 'px';
    const d = Math.hypot(zone.x - player.position.x, zone.z - player.position.z);
    if (d < closestD) { closestD = d; closest = zone; }
  });
  const NEAR_R = 3.2;
  if (closest && closestD < NEAR_R) {
    if (nearZone !== closest) { nearZone = closest; }
    closest.el.classList.add('near');
    promptEl.textContent = `${closest.name} · Nhấn E / chạm nhãn để vào`;
    promptEl.classList.add('on');
  } else {
    if (nearZone) nearZone.el.classList.remove('near');
    nearZone = null;
    promptEl.classList.remove('on');
  }
  ZONES.forEach(z => { if (z !== nearZone) z.el.classList.remove('near'); });

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
