<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo quả địa cầu 3D · BizOn lab</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 35%, #0b4a52 0%, #033337 55%, #021f22 100%); overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #stage { position: fixed; inset: 0; }
    #note { position: fixed; left: 16px; bottom: 14px; right: 16px; color: #cfe9ec; font-size: 13px; line-height: 1.5; pointer-events: none; }
    #note b { color: #ffd58a; }
  </style>
  <script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/controls/OrbitControls.js":"../vendor/three/OrbitControls.js"}}</script>
<script src="../js/capture-guard.js"></script>
</head>
<body>
  <div id="stage"></div>
  <div id="note">
    <b>Demo quả địa cầu (Three.js)</b> – chỉ để thử hiệu ứng, chưa gắn vào game. Quả cầu chỉ có lưới kinh vĩ, <b>không có dữ liệu địa hình thật</b>. Điểm sáng: Cần Thơ (10,03°B · 105,78°Đ). Kéo để xoay.
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.6, 3.6);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x0a3a40, 1.1));
    const sun = new THREE.DirectionalLight(0xfff1d6, 1.4);
    sun.position.set(3, 2, 4);
    scene.add(sun);

    const R = 1;
    // Quả cầu đất sét: màu đất nung nhạt, không dùng bản đồ thật
    // Mọi thứ gắn vào quả cầu nằm trong một nhóm để xoay cùng nhau
    const earth = new THREE.Group();
    scene.add(earth);
    const globe = new THREE.Mesh(
      new THREE.SphereGeometry(R, 96, 64),
      new THREE.MeshStandardMaterial({ color: 0xd9a46f, roughness: 0.78, metalness: 0.0 })
    );
    earth.add(globe);

    // Lưới kinh vĩ: vĩ tuyến mỗi 30°, kinh tuyến mỗi 30°
    const gridPts = [];
    const seg = 96;
    for (let lat = -60; lat <= 60; lat += 30) {
      for (let i = 0; i < seg; i++) {
        gridPts.push(latLonToVec3(lat, (i / seg) * 360 - 180, R * 1.003), latLonToVec3(lat, ((i + 1) / seg) * 360 - 180, R * 1.003));
      }
    }
    for (let lon = -180; lon < 180; lon += 30) {
      for (let i = 0; i < seg / 2; i++) {
        gridPts.push(latLonToVec3((i / (seg / 2)) * 180 - 90, lon, R * 1.003), latLonToVec3(((i + 1) / (seg / 2)) * 180 - 90, lon, R * 1.003));
      }
    }
    const grid = new THREE.LineSegments(
      new THREE.BufferGeometry().setFromPoints(gridPts),
      new THREE.LineBasicMaterial({ color: 0x033337, transparent: true, opacity: 0.3 })
    );
    earth.add(grid);

    // Chuyển (vĩ độ, kinh độ) thành toạ độ trên quả cầu
    function latLonToVec3(lat, lon, r) {
      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon + 180);
      return new THREE.Vector3(
        -r * Math.sin(phi) * Math.cos(theta),
        r * Math.cos(phi),
        r * Math.sin(phi) * Math.sin(theta)
      );
    }

    // Điểm đánh dấu Cần Thơ
    const pinPos = latLonToVec3(10.03, 105.78, R * 1.01);
    const pin = new THREE.Mesh(
      new THREE.SphereGeometry(0.035, 24, 16),
      new THREE.MeshStandardMaterial({ color: 0xf08a3c, emissive: 0xf08a3c, emissiveIntensity: 0.6 })
    );
    pin.position.copy(pinPos);
    earth.add(pin);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.06, 0.075, 48),
      new THREE.MeshBasicMaterial({ color: 0xffd58a, transparent: true, opacity: 0.9, side: THREE.DoubleSide })
    );
    ring.position.copy(pinPos);
    ring.lookAt(pinPos.clone().multiplyScalar(2));
    earth.add(ring);
    // Xoay quả cầu để Cần Thơ hướng về phía camera lúc mở trang
    earth.rotation.y = -Math.atan2(pinPos.x, pinPos.z);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.minDistance = 2;
    controls.maxDistance = 6;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const t0 = performance.now();
    renderer.setAnimationLoop(() => {
      const t = (performance.now() - t0) / 1000;
      const pulse = 1 + 0.35 * Math.sin(t * 2.4);
      ring.scale.set(pulse, pulse, pulse);
      ring.material.opacity = 0.9 - 0.5 * ((t * 2.4) % (2 * Math.PI)) / (2 * Math.PI);
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
