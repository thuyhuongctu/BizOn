<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bản đồ tiên quyết · CM &amp; CMR</title>
<meta name="description" content="Bản đồ tiên quyết của chuỗi kiến thức Số dư đảm phí: kiến thức nào cần nắm trước khi học kiến thức nào.">
<meta name="copyright" content="© 2026 Đỗ Thùy Hương & PGS.TS. Phan Anh Tú">
<link rel="icon" type="image/png" href="../assets/icons/icon-192.png">
<link rel="stylesheet" href="../css/bizon-clay-fonts.css">
<link rel="stylesheet" href="../css/bizon-clay.css">
<style>
  body{font-family:var(--clay-sans);background:var(--clay-bg);color:var(--clay-ink)}
  .pq-wrap{max-width:1160px;margin:0 auto;padding:24px clamp(16px,4vw,32px) 56px}
  .pq-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}
  .pq-top a{font-weight:800;font-size:14px;color:var(--clay-teal);text-decoration:none}
  .pq-head h1{font-size:clamp(28px,4vw,40px);color:var(--clay-ink);margin:.2rem 0 .5rem}
  .pq-head p{color:var(--clay-ink-2);max-width:62ch;line-height:1.6;margin:0}
  .pq-board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;margin-top:28px;align-items:start}
  .pq-col{display:flex;flex-direction:column;gap:14px}
  .pq-col h2{font-family:var(--clay-mono);font-size:11px;letter-spacing:.14em;color:var(--clay-sub);margin:0 0 2px;text-transform:uppercase}
  .pq-node{appearance:none;width:100%;text-align:left;cursor:pointer;padding:16px 18px;border:0;border-radius:22px;background:var(--clay-card);box-shadow:var(--clay-shadow-sm);color:var(--clay-ink);font:inherit;transition:transform .2s,box-shadow .2s,outline-color .2s;outline:3px solid transparent;outline-offset:3px}
  .pq-node:hover{transform:translateY(-2px)}
  .pq-node:focus-visible{outline-color:var(--clay-teal)}
  .pq-node .nm{display:block;font-family:var(--clay-head);font-weight:800;font-size:16px;line-height:1.3}
  .pq-node .ds{display:block;font-size:13px;line-height:1.5;color:var(--clay-ink-2);margin-top:.35rem}
  .pq-node.is-sel{outline-color:var(--clay-teal);transform:translateY(-3px)}
  .pq-node.is-need{outline-color:var(--clay-orange)}
  .pq-node.is-next{background:var(--clay-card-2,var(--clay-card));border:2px dashed rgba(3,51,55,.2)}
  .pq-panel{margin-top:30px;padding:26px;border-radius:26px;background:var(--clay-card);box-shadow:var(--clay-shadow-sm)}
  .pq-panel h2{font-size:22px;color:var(--clay-ink);margin:0 0 .4rem}
  .pq-panel .sub{color:var(--clay-ink-2);line-height:1.6;margin:0 0 1rem}
  .pq-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .pq-cols h3{font-family:var(--clay-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--clay-sub);margin:0 0 .5rem}
  .pq-cols ul{margin:0;padding-left:1.1rem;color:var(--clay-ink);line-height:1.7}
  .pq-cols li button{background:none;border:0;padding:0;font:inherit;color:var(--clay-teal);font-weight:700;cursor:pointer;text-decoration:underline}
  .pq-cols .none{color:var(--clay-sub);font-style:italic}
  .pq-lab{display:inline-block;margin-top:14px;font-weight:800;color:var(--clay-teal);text-decoration:none}
  .pq-hint{font-size:13px;color:var(--clay-sub);margin-top:18px}
  @media (max-width:900px){
    .pq-board{grid-template-columns:repeat(3,minmax(0,1fr))}
  }
  @media (max-width:560px){
    .pq-board{grid-template-columns:minmax(0,1fr)}
    .pq-cols{grid-template-columns:minmax(0,1fr)}
    .pq-panel{padding:20px}
  }
</style>
</head>
<body>
<div class="pq-wrap">
  <div class="pq-top">
    <a href="../universe.html">← Vũ trụ</a>
    <a href="cmr-lab.html">Mở CMR Lab →</a>
  </div>

  <header class="pq-head">
    <div class="clay-eyebrow">Lab · Bản đồ tiên quyết</div>
    <h1>Học theo thứ tự nào?</h1>
    <p>Mỗi ô là một kiến thức trong chuỗi Số dư đảm phí. Bấm một ô để xem những kiến thức cần nắm trước và những kiến thức mở ra sau nó.</p>
  </header>

  <div class="pq-board" id="board" role="group" aria-label="Các kiến thức trong chuỗi"></div>

  <section class="pq-panel" id="panel" aria-live="polite"></section>

  <p class="pq-hint">Bản đồ này chỉ thể hiện thứ tự học, không chấm điểm và không lưu trạng thái.</p>
</div>

<script>
  // Đồ thị tiên quyết do BizOn tự xây dựng cho chuỗi CM/CMR.
  // Không dùng dữ liệu chương trình của bên khác.
  const NODES = [
    { id: 'chi-phi',   nm: 'Phân loại chi phí',                 ds: 'Tách biến phí và định phí. Đây là điểm xuất phát của mọi phép tính.', needs: [],                         lab: null },
    { id: 'cm',        nm: 'Giá bán và số dư đảm phí (CM)',      ds: 'CM = Giá bán − Biến phí đơn vị. Phần CM trả định phí trước khi có lãi.', needs: ['chi-phi'],                lab: 'cmr-lab.html' },
    { id: 'cmr',       nm: 'Tỷ lệ CMR',                          ds: 'CMR = CM / Giá bán. Cho biết mỗi đồng doanh thu còn lại bao nhiêu để trả định phí.', needs: ['cm'],             lab: 'cmr-lab.html' },
    { id: 'bep',       nm: 'Điểm hòa vốn (BEP)',                 ds: 'BEP = Định phí / CM đơn vị. Số lượng bán để lợi nhuận bằng 0.', needs: ['cm'],                     lab: 'cvp-studio.html' },
    { id: 'an-toan',   nm: 'Vùng an toàn và đòn bẩy',            ds: 'So sánh doanh số thực với BEP. Đòn bẩy cho biết lợi nhuận nhạy thế nào khi doanh số đổi.', needs: ['cmr', 'bep'], lab: 'cmr-lab.html' },
    { id: 'thu-gia',   nm: 'Thử nghiệm giá và biến phí',         ds: 'Đổi giá hoặc biến phí rồi xem BEP và CMR thay đổi ra sao.', needs: ['bep'],                    lab: 'cvp-studio.html' },
    { id: 'loi-nhuan', nm: 'Lợi nhuận mục tiêu',                 ds: 'Tính số lượng cần bán để đạt một mức lãi đặt trước.', needs: ['bep'],                           lab: 'cvp-studio.html' },
    { id: 'chien-luoc',nm: 'Quyết định chiến lược',              ds: 'Chọn giá, quy mô và kênh bán dựa trên các chỉ số đã tính.', needs: ['an-toan', 'thu-gia', 'loi-nhuan'], lab: null },
  ];

  const byId = Object.fromEntries(NODES.map(n => [n.id, n]));

  // Các kiến thức mở ra ngay sau một kiến thức (phụ thuộc trực tiếp).
  function dependents(id) {
    return NODES.filter(n => n.needs.includes(id)).map(n => n.id);
  }

  // Toàn bộ kiến thức cần nắm trước, bắc cầu qua mọi cấp.
  function allPrereqs(id, seen = new Set()) {
    for (const p of byId[id].needs) {
      if (!seen.has(p)) { seen.add(p); allPrereqs(p, seen); }
    }
    return seen;
  }

  // Cấp của một ô = 0 nếu không có tiên quyết, còn lại = max(cấp tiên quyết) + 1.
  const level = {};
  function depth(id) {
    if (level[id] !== undefined) return level[id];
    const ps = byId[id].needs;
    return (level[id] = ps.length ? Math.max(...ps.map(depth)) + 1 : 0);
  }
  NODES.forEach(n => depth(n.id));

  const LEVEL_TITLES = ['Bắt đầu', 'Nền tảng', 'Đo lường', 'Ứng dụng', 'Ra quyết định'];
  const board = document.getElementById('board');
  const panel = document.getElementById('panel');
  let selected = null;

  function renderBoard() {
    const prereqs = selected ? allPrereqs(selected) : new Set();
    const cols = [];
    NODES.forEach(n => { (cols[level[n.id]] = cols[level[n.id]] || []).push(n); });
    board.innerHTML = cols.map((nodes, li) => `
      <div class="pq-col">
        <h2>${String(li + 1).padStart(2, '0')} · ${LEVEL_TITLES[li] || 'Cấp ' + (li + 1)}</h2>
        ${nodes.map(n => {
          const cls = ['pq-node',
            n.id === selected ? 'is-sel' : '',
            prereqs.has(n.id) ? 'is-need' : '',
            (selected && !prereqs.has(n.id) && n.id !== selected) ? 'is-next' : ''].join(' ');
          return `<button type="button" class="${cls}" data-id="${n.id}" aria-pressed="${n.id === selected}">
            <span class="nm">${n.nm}</span>
            <span class="ds">${n.ds}</span>
          </button>`;
        }).join('')}
      </div>`).join('');
  }

  function renderPanel() {
    if (!selected) {
      panel.innerHTML = `<h2>Chọn một kiến thức</h2>
        <p class="sub">Bấm một ô trên bản đồ để xem thứ tự học. Các ô đậm viền cam là những kiến thức cần nắm trước ô đang chọn.</p>`;
      return;
    }
    const n = byId[selected];
    const pre = [...allPrereqs(selected)];
    const next = dependents(selected);
    const item = id => `<li><button type="button" data-go="${id}">${byId[id].nm}</button></li>`;
    panel.innerHTML = `
      <h2>${n.nm}</h2>
      <p class="sub">${n.ds}</p>
      <div class="pq-cols">
        <div>
          <h3>Cần nắm trước</h3>
          ${pre.length ? `<ul>${pre.map(item).join('')}</ul>` : '<p class="none">Không cần kiến thức nào trước — đây là điểm bắt đầu.</p>'}
        </div>
        <div>
          <h3>Mở ra sau</h3>
          ${next.length ? `<ul>${next.map(item).join('')}</ul>` : '<p class="none">Đây là kiến thức cuối chuỗi.</p>'}
        </div>
      </div>
      ${n.lab ? `<a class="pq-lab" href="${n.lab}">Thực hành trong lab →</a>` : ''}`;
  }

  function render() { renderBoard(); renderPanel(); }

  board.addEventListener('click', e => {
    const btn = e.target.closest('.pq-node');
    if (!btn) return;
    selected = selected === btn.dataset.id ? null : btn.dataset.id;
    render();
  });

  panel.addEventListener('click', e => {
    const go = e.target.closest('[data-go]');
    if (!go) return;
    selected = go.dataset.go;
    render();
    board.querySelector(`[data-id="${selected}"]`)?.focus();
  });

  render();
</script>
</body>
</html>
