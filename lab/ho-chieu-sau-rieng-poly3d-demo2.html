<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo 3D low-poly · Trạm đóng gói & biên giới</title>
<style>
  html,body{margin:0;height:100%;background:linear-gradient(#bfe3ef,#eaf6ee);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  canvas{display:block;touch-action:none}
  #hud{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:2}
  #hud .pill{pointer-events:auto;background:rgba(255,255,255,.92);border-radius:14px;padding:10px 14px;font-size:13px;font-weight:700;color:#174d2e;box-shadow:0 6px 16px -8px rgba(0,0,0,.3)}
  #hud .hint{font-weight:500;color:#45604f}
</style>
</head>
<body>
<div id="hud">
  <div class="pill">📦 Demo cảnh 3D low-poly · Trạm đóng gói &amp; biên giới<br><span class="hint">Kéo để xoay · Lăn/chụm để zoom</span></div>
</div>
<script type="module">
import * as THREE from '../js/vendor/three.module.js';
import { P3 } from '../js/poly3d-kit.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color('#bfe3ef');
scene.fog = new THREE.Fog('#bfe3ef', 16, 36);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

P3.lights(THREE, scene);
scene.add(P3.ground(THREE, { grassColor: 0x9fc27e, soilColor: 0xd9c9a3, radius: 18, soilRadius: 11 }));

// Nhà kho đóng gói (mái đỏ dốc) + nhà văn phòng nhỏ (mái bằng)
const warehouse = P3.building(THREE, { w: 3.6, d: 2.6, h: 1.8, wallColor: 0xf3eee1, roofColor: 0xb5523a, roofType: 'gable' });
warehouse.position.set(-3.2, 0, -2.4);
warehouse.rotation.y = 0.15;
scene.add(warehouse);

const office = P3.building(THREE, { w: 1.8, d: 1.6, h: 1.5, wallColor: 0xe9ecef, roofColor: 0x6f9bb0, roofType: 'flat' });
office.position.set(1.6, 0, -3.4);
office.rotation.y = -0.1;
scene.add(office);

// Đường chính cắt qua sân
const road = P3.road(THREE, { length: 20, width: 2.2, color: 0xd8c9a6 });
road.rotation.z = -0.55;
road.position.set(0, 0, 0);
scene.add(road);

// Chồng thùng hàng (crate) cạnh kho
const crateColors = [0xcf7a3a, 0xb5632a, 0xe0954a];
const crateSpots = [[-1.6, -1.2], [-1.2, -0.7], [-1.9, -0.6], [2.6, 1.4], [3.1, 1.0]];
crateSpots.forEach(([x, z], i) => {
  const crate = P3.crate(THREE, { size: 0.5, color: crateColors[i % crateColors.length] });
  crate.position.set(x, 0.25 + (i % 2) * 0.52, z);
  crate.rotation.y = Math.random() * 0.6;
  scene.add(crate);
});

// Nhân vật: công nhân đóng gói + nhân viên hải quan (mũ cứng)
const worker1 = P3.character(THREE, { shirt: 0x3f7d3a, hat: 'none' });
worker1.position.set(-0.6, 0, -1.3); worker1.rotation.y = 0.4;
scene.add(worker1);

const worker2 = P3.character(THREE, { shirt: 0xcf7a3a, hat: 'none' });
worker2.position.set(-2.3, 0, -0.4); worker2.rotation.y = -0.9;
scene.add(worker2);

const officer = P3.character(THREE, { shirt: 0x2f4a6b, hat: 'mũ cứng', hatColor: 0xe6b84a });
officer.position.set(2.0, 0, -1.6); officer.rotation.y = 2.4;
scene.add(officer);

const trader = P3.character(THREE, { shirt: 0x7a4fae, hat: 'none' });
trader.position.set(3.6, 0, 2.2); trader.rotation.y = -1.6;
scene.add(trader);

const orbit = P3.orbitCamera(THREE, renderer, camera, { radius: 19, phi: Math.PI * 0.3, target: new THREE.Vector3(0, 0.8, -0.6) });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  orbit.tick(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
