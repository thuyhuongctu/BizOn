plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('BIZON_UPLOAD_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('BIZON_UPLOAD_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('BIZON_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = System.getenv('BIZON_UPLOAD_KEY_PASSWORD')
def hasReleaseSigning = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { value -> value != null && !value.trim().isEmpty() }
def releaseVersionCode = (System.getenv('BIZON_VERSION_CODE') ?: '1').toInteger()
def releaseVersionName = System.getenv('BIZON_VERSION_NAME') ?: '0.1.0-alpha'

android {
    namespace 'vn.bizon.simulation'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.bizon.simulation'
        minSdk 23
        targetSdk 35
        versionCode releaseVersionCode
        versionName releaseVersionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.2.0'
}
