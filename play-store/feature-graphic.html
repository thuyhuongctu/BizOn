<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1024,initial-scale=1">
  <title>BizOn feature graphic</title>
  <style>
    *{box-sizing:border-box}html,body{width:1024px;height:500px;margin:0;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;background:#07141f;color:#fff}.canvas{position:relative;width:100%;height:100%;display:flex;align-items:center;padding:64px 72px;background:radial-gradient(circle at 82% 22%,rgba(56,198,223,.34),transparent 28%),linear-gradient(135deg,#07141f 0%,#0b2d3d 58%,#07586a 100%)}.canvas:before,.canvas:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.16);border-radius:50%}.canvas:before{width:430px;height:430px;right:-60px;top:35px}.canvas:after{width:290px;height:290px;right:15px;top:105px}.copy{position:relative;z-index:2;max-width:650px}.eyebrow{margin:0 0 14px;color:#7cdeec;font-size:18px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.brand{margin:0;font-size:82px;line-height:.94;letter-spacing:-.045em}.tagline{margin:20px 0 0;max-width:610px;color:#d4e5ec;font-size:29px;line-height:1.25;font-weight:600}.mark{position:absolute;z-index:3;right:118px;top:151px;width:180px;height:180px;border-radius:46px;display:grid;place-items:center;background:linear-gradient(145deg,#38c6df,#08788d);box-shadow:0 30px 70px rgba(0,0,0,.34);font-size:104px;font-weight:900;letter-spacing:-.08em}.path{position:absolute;z-index:1;right:55px;bottom:55px;width:370px;height:120px;border-top:4px solid rgba(124,222,236,.55);border-radius:50%}.dot{position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 0 8px rgba(56,198,223,.16)}.d1{right:362px;bottom:112px}.d2{right:214px;bottom:79px}.d3{right:66px;bottom:108px}
  </style>
</head>
<body>
  <main class="canvas" aria-label="BizOn — Mô phỏng quyết định kinh doanh">
    <section class="copy">
      <p class="eyebrow">Mô phỏng · Quyết định · Phản tư</p>
      <h1 class="brand">BizOn</h1>
      <p class="tagline">Học kinh doanh bằng những lựa chọn có thể giải thích.</p>
    </section>
    <div class="mark" aria-hidden="true">B</div>
    <div class="path" aria-hidden="true"></div>
    <i class="dot d1" aria-hidden="true"></i><i class="dot d2" aria-hidden="true"></i><i class="dot d3" aria-hidden="true"></i>
  </main>
</body>
</html>
