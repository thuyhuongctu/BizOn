name: Supabase – áp migration lên production

# Bấm tay (Actions → «Supabase – áp migration lên production» → Run workflow) để áp một file
# supabase/migrations/*.sql lên dự án production qua Management API, thay cho chép SQL vào SQL Editor.
# File lấy từ nhánh «source_ref» (mặc định main) để áp được migration của một PR trước khi gộp PR đó.
# Không gõ APPLY ở «confirm» thì chỉ kiểm tra trước rồi dừng. Cần repository secret SUPABASE_ACCESS_TOKEN.
on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Tên file trong supabase/migrations (vd 20261023000000_require_student_login.sql)'
        type: string
        required: true
      source_ref:
        description: 'Nhánh chứa file migration'
        type: string
        default: main
      confirm:
        description: 'Gõ APPLY để áp thật (để trống = chỉ kiểm tra)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Lấy file migration từ nhánh nguồn
        env:
          MIGRATION: ${{ inputs.migration }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          [[ "$MIGRATION" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]] || { echo "Tên file migration không hợp lệ"; exit 1; }
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Tên nhánh không hợp lệ"; exit 1; }
          git fetch --depth=1 origin "refs/heads/$SOURCE_REF"
          git show "FETCH_HEAD:supabase/migrations/$MIGRATION" > "$RUNNER_TEMP/migration.sql"
          echo "Lấy $MIGRATION từ $SOURCE_REF ($(git rev-parse --short FETCH_HEAD)), $(wc -l < "$RUNNER_TEMP/migration.sql") dòng."
      - name: Áp migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MIGRATION_FILE: ${{ inputs.migration }}
          MIGRATION_PATH: ${{ runner.temp }}/migration.sql
          CONFIRM: ${{ inputs.confirm }}
        run: node scripts/release/apply-supabase-migration.mjs
