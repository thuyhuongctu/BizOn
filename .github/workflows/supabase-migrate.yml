name: Supabase – áp migration lên production

# Bấm tay (Actions → «Supabase – áp migration lên production» → Run workflow) để áp một file
# supabase/migrations/*.sql lên dự án production qua Management API, thay cho chép SQL vào SQL Editor.
# File lấy từ nhánh «source_ref» (mặc định main); main chưa có thì tự tìm trong nhánh các PR đang mở,
# để áp được migration của một PR trước khi gộp PR đó mà không phải điền tên nhánh.
# Không gõ APPLY ở «confirm» thì chỉ kiểm tra trước rồi dừng. Cần repository secret SUPABASE_ACCESS_TOKEN.
on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Migration cần áp (chọn trong danh sách)'
        type: choice
        options:
          - 20261024010000_normalize_survey_class_codes.sql
          - 20261024000000_add_gstudent_domain.sql
          - 20261023010000_revoke_anon_writes.sql
          - 20261023000000_require_student_login.sql
      migration_khac:
        description: 'Migration khác không có trong danh sách (tên file; để trống = dùng ô trên)'
        type: string
        required: false
      source_ref:
        description: 'Nhánh chứa file (để trống = main, main chưa có thì tự tìm trong các PR đang mở)'
        type: string
        required: false
      confirm:
        description: 'Gõ APPLY để áp thật (để trống = chỉ kiểm tra)'
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Lấy file migration
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATION: ${{ inputs.migration }}
          MIGRATION_KHAC: ${{ inputs.migration_khac }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          M="${MIGRATION_KHAC:-$MIGRATION}"
          bash scripts/release/fetch-migration.sh "$M" "$SOURCE_REF" "$RUNNER_TEMP/migration.sql"
          echo "MIGRATION_FILE=$M" >> "$GITHUB_ENV"
      - name: Áp migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MIGRATION_PATH: ${{ runner.temp }}/migration.sql
          CONFIRM: ${{ inputs.confirm }}
        run: node scripts/release/apply-supabase-migration.mjs
