name: Tests – chạy mọi bộ test

# Một workflow chạy MỌI test/*.test.js (npm test → scripts/run-tests.mjs), kể cả các bộ trước đây
# không workflow nào gọi: engine.test.js (mô phỏng, chấm điểm Bật Nghiệp), brand-passport, ie-lab,
# clay-nav-sync, press-archive, android-twa-contract. Các workflow riêng theo đường dẫn vẫn giữ nguyên.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Ghim 24.04: ubuntu-latest đang chuyển sang Ubuntu 26, nơi `playwright@1.54.1 install --with-deps` không cài được gói hệ thống
    runs-on: ubuntu-24.04
    # Bộ test đầy đủ mất ~21 phút (11/2026); 25 phút quá sát, máy chậm là bị hủy giữa chừng.
    # 19/11/2026: thêm bước cài ffmpeg (#1136) và test luật cảng (#1142), lúc máy chậm bộ test xong đúng phút 40
    # (231/231 đạt nhưng job bị hủy) → nâng lên 55; hai bước cài có giới hạn riêng để apt treo thì dừng sớm.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Bộ test Hộ Chiếu / IE Lab mở trang thật bằng Chromium (require('playwright-core'))
      - name: Cài Playwright + Chromium
        timeout-minutes: 12
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      # ffmpeg cho phần chạy thật của test/kiem-video.test.js và test/bia-trailer-bat-nghiep.test.js.
      # Máy chủ apt có lúc rất chậm: cài gọn, và nếu hết giờ thì vẫn chạy test (các test video tự bỏ qua khi thiếu ffmpeg).
      - name: Cài ffmpeg
        timeout-minutes: 8
        continue-on-error: true
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      # scripts/run-tests.mjs tự bật máy chủ tĩnh ở 127.0.0.1:8899 cho các bộ test trình duyệt
      - name: npm test
        run: npm test

      - name: Lưu ảnh chụp QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-qa
          path: |
            artifacts/
          retention-days: 7
          if-no-files-found: ignore
