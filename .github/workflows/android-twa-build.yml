name: Android TWA Build

on:
  pull_request:
    paths:
      - 'android/**'
      - 'app/**'
      - 'brand-passport-learning.html'
      - 'js/brand-passport-learning.js'
      - '.well-known/assetlinks.template.json'
      - 'test/android-twa-contract.test.js'
      - '.github/workflows/android-twa-build.yml'
  push:
    branches: ['main', 'feat/web-app-release-v1', 'feat/google-play-release-readiness-v1']
    paths:
      - 'android/**'
      - 'app/**'
      - 'brand-passport-learning.html'
      - 'js/brand-passport-learning.js'
      - '.well-known/assetlinks.template.json'
      - 'test/android-twa-contract.test.js'
      - '.github/workflows/android-twa-build.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Android and web contracts
        run: node test/android-twa-contract.test.js

      - name: Verify local PWA endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8899 --directory . >/tmp/bizon-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8899/app/release.html -o /tmp/release.html && break
            sleep 1
          done
          grep -q 'Brand Passport' /tmp/release.html
          grep -q 'Mô phỏng quyết định kinh doanh' /tmp/release.html
          curl --fail --silent http://127.0.0.1:8899/app/brand-passport.html -o /tmp/passport.html
          grep -q '../brand-passport-learning.html' /tmp/passport.html
          grep -q 'Lưu trên thiết bị' /tmp/passport.html
          curl --fail --silent http://127.0.0.1:8899/app/manifest.webmanifest -o /tmp/bizon-manifest.json
          python3 - <<'PY'
          import json
          with open('/tmp/bizon-manifest.json', encoding='utf-8') as handle:
              manifest = json.load(handle)
          assert manifest['id'] == './release.html'
          assert manifest['start_url'] == './release.html'
          assert manifest['scope'] == './'
          assert manifest['display'] == 'standalone'
          assert manifest['name'] == 'BizOn — Mô phỏng quyết định kinh doanh'
          assert next(item for item in manifest['shortcuts'] if item['short_name'] == 'Startup')['url'] == '../game.html'
          assert next(item for item in manifest['shortcuts'] if item['short_name'] == 'Passport')['url'] == './brand-passport.html'
          print('Local PWA endpoints verified')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 API 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Create debug verification bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-artifacts
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          cp "$APK" android-artifacts/BizOn-debug.apk
          DIGEST=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n 1)
          test -n "$DIGEST"
          DEBUG_DIGEST="$DIGEST" python3 - <<'PY'
          import json, os
          raw = os.environ['DEBUG_DIGEST'].replace(':', '').strip().upper()
          if len(raw) != 64 or any(char not in '0123456789ABCDEF' for char in raw):
              raise SystemExit('Invalid SHA-256 certificate digest')
          fingerprint = ':'.join(raw[index:index + 2] for index in range(0, 64, 2))
          document = [{
              'relation': ['delegate_permission/common.handle_all_urls'],
              'target': {
                  'namespace': 'android_app',
                  'package_name': 'vn.bizon.simulation',
                  'sha256_cert_fingerprints': [fingerprint],
              },
          }]
          with open('android-artifacts/assetlinks-debug.json', 'w', encoding='utf-8') as handle:
              json.dump(document, handle, ensure_ascii=False, indent=2)
              handle.write('\n')
          with open('android-artifacts/debug-certificate-sha256.txt', 'w', encoding='utf-8') as handle:
              handle.write(fingerprint + '\n')
          PY
          sha256sum android-artifacts/BizOn-debug.apk > android-artifacts/BizOn-debug.apk.sha256

      - name: Upload debug APK and verification files
        uses: actions/upload-artifact@v4
        with:
          name: bizon-android-debug
          path: android-artifacts/
          if-no-files-found: error
          retention-days: 14
