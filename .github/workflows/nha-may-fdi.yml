name: Nha may FDI

on:
  push:
    branches:
      - main
    paths:
      - 'lab/nha-may-fdi*'
      - 'test/nha-may-fdi.test.js'
      - '.github/workflows/nha-may-fdi.yml'
  pull_request:
    paths:
      - 'lab/nha-may-fdi*'
      - 'test/nha-may-fdi.test.js'
      - '.github/workflows/nha-may-fdi.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check lab/nha-may-fdi-engine.js
          node --check lab/nha-may-fdi-data.js
      - name: Engine and balance tests
        run: node test/nha-may-fdi.test.js
