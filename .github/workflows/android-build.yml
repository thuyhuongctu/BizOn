# Build Android App Bundle (.aab) từ PWA bằng Bubblewrap (Trusted Web Activity)
#
# Chạy thủ công (workflow_dispatch). Yêu cầu 4 secret của repo:
#   KEYSTORE_BASE64   — tệp android.keystore mã hóa base64 (tạo cục bộ bằng keytool, KHÔNG commit vào repo)
#   KEYSTORE_PASSWORD — mật khẩu keystore
#   KEY_ALIAS         — bí danh khóa (mặc định: bizon)
#   KEY_PASSWORD      — mật khẩu khóa
#
# Tạo keystore cục bộ (một lần, giữ tệp thật cẩn thận):
#   keytool -genkeypair -v -keystore android.keystore -alias bizon \
#     -keyalg RSA -keysize 2048 -validity 10000
#   base64 -w0 android.keystore   # dán kết quả vào secret KEYSTORE_BASE64

name: Build Android (.aab)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cài Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Khôi phục keystore từ secret
        working-directory: android
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Build .aab
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath ./android.keystore \
            --signingKeyAlias "${{ secrets.KEY_ALIAS }}"

      - name: Tải lên artifact
        uses: actions/upload-artifact@v4
        with:
          name: bizon-aab
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          if-no-files-found: error
