name: Supabase – bắt buộc đăng nhập khi nộp kết quả

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'test/sql/supabase_auth_stub.sql'
      - 'test/sql/require_student_login_smoke.sql'
      - 'test/sql/journey_passports_smoke.sql'
      - 'test/sql/explain_mode_smoke.sql'
      - '.github/workflows/supabase-student-login.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'test/sql/supabase_auth_stub.sql'
      - 'test/sql/require_student_login_smoke.sql'
      - 'test/sql/journey_passports_smoke.sql'
      - 'test/sql/explain_mode_smoke.sql'
      - '.github/workflows/supabase-student-login.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      # Áp TOÀN BỘ migration theo thứ tự thời gian (cả supabase/*.sql ngoài thư mục migrations)
      # trên CSDL trống có giả lập auth của Supabase, rồi kiểm hành vi theo từng vai.
      - name: Áp migration
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f test/sql/supabase_auth_stub.sql
          for f in $(ls supabase/migrations/*.sql supabase/*.sql | awk -F/ '{print $NF" "$0}' | sort | cut -d' ' -f2); do
            echo "::group::$f"; psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; echo "::endgroup::"
          done
      - name: Kiểm hành vi (anon bị chặn, sinh viên đúng đội nộp được, giảng viên phải được duyệt)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f test/sql/require_student_login_smoke.sql
      - name: Kiểm hành trình 3 bậc (hộ chiếu trên máy chủ, cờ hành trang của lớp, dọn dữ liệu)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f test/sql/journey_passports_smoke.sql
      - name: Kiểm nhánh hộp đen (cờ ẩn giải thích của lớp, feed ẩn danh)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f test/sql/explain_mode_smoke.sql
      # Chạy lại migration hành trình sẽ định nghĩa lại bizon_class_feed không có explain_hidden,
      # nên sau đó phải chạy lại migration hộp đen (thứ tự thời gian) rồi kiểm lại cả hai.
      - name: Áp lại hai migration theo thứ tự (phải an toàn khi chạy lại) rồi kiểm lại
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261026000000_journey_passports.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261027000000_explain_mode.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f test/sql/explain_mode_smoke.sql
