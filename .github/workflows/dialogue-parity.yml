name: Dialogue parity (VI/EN)

on:
  pull_request:
    paths:
      - 'assets/dialogue/**'
      - 'scripts/dialogue/**'
      - '.github/workflows/dialogue-parity.yml'
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Kiểm tra parity thoại Lumina VI/EN
        run: node scripts/dialogue/parity-check.mjs
