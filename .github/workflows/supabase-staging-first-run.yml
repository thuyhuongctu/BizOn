# BizOn staging CI v8.2 — automatic project/key discovery with commit status
name: BizOn Supabase Staging CI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/supabase-staging-first-run.yml'
      - 'scripts/release/verify-supabase-staging-management.mjs'
      - 'scripts/release/bootstrap-supabase-staging-key.mjs'
      - 'scripts/release/verify-supabase-staging.mjs'
      - 'scripts/release/validate-supabase-staging-template.mjs'
      - 'test/supabase-staging-key-bootstrap.test.js'
      - 'test/supabase-staging-gate.test.js'
      - 'supabase/migrations/**'
  schedule:
    # 02:30 Asia/Ho_Chi_Minh (UTC+7); GitHub schedules may start a few minutes late.
    - cron: '30 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  staging-ci:
    name: staging migration and protected smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-staging
    concurrency:
      group: bizon-supabase-staging
      cancel-in-progress: false
    env:
      SUPABASE_STAGING_PROJECT_NAME: bizon-staging
      SUPABASE_STAGING_PROJECT_REF_HINT: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_STAGING_INSTRUCTOR_KEY: ${{ secrets.SUPABASE_STAGING_INSTRUCTOR_KEY }}
      APPLY_MIGRATION: ${{ github.event_name == 'schedule' && 'false' || 'true' }}
      RUN_RETENTION_PURGE: 'true'
      BIZON_STAGING_REPORT_DIR: artifacts/supabase-staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve protected staging project and client key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo 'Missing SUPABASE_ACCESS_TOKEN for automatic staging discovery.' >&2
            exit 1
          fi

          mapfile -t RESOLUTION < <(
            PROJECT_NAME="$SUPABASE_STAGING_PROJECT_NAME" \
            PROJECT_REF_HINT="${SUPABASE_STAGING_PROJECT_REF_HINT:-}" \
            ACCESS_TOKEN="$SUPABASE_ACCESS_TOKEN" \
            node <<'NODE'
          const targetName = String(process.env.PROJECT_NAME || 'bizon-staging').trim();
          const refHint = String(process.env.PROJECT_REF_HINT || '').trim();
          const accessToken = String(process.env.ACCESS_TOKEN || '').trim();
          const productionRef = 'ceytblfelodpnudomccn';

          const normalize = value => String(value || '')
            .trim()
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '');

          const headers = {
            Authorization: `Bearer ${accessToken}`,
            Accept: 'application/json'
          };

          const projectsResponse = await fetch('https://api.supabase.com/v1/projects', { headers });
          if (!projectsResponse.ok) {
            throw new Error(`Supabase project discovery failed with HTTP ${projectsResponse.status}.`);
          }

          const projectsPayload = await projectsResponse.json();
          const projects = Array.isArray(projectsPayload) ? projectsPayload : [];
          let project = projects.find(item => String(item?.ref || '') === refHint);
          if (!project || normalize(project?.name) !== normalize(targetName)) {
            const named = projects.filter(item => normalize(item?.name) === normalize(targetName));
            if (named.length !== 1) {
              throw new Error(`Expected exactly one Supabase project named ${targetName}; found ${named.length}.`);
            }
            [project] = named;
          }

          const projectRef = String(project?.ref || '').trim();
          if (!projectRef) throw new Error('The discovered staging project has no project ref.');
          if (projectRef === productionRef) throw new Error('Production Supabase project is blocked.');

          const keysResponse = await fetch(
            `https://api.supabase.com/v1/projects/${projectRef}/api-keys?reveal=true`,
            { headers }
          );
          if (!keysResponse.ok) {
            throw new Error(`Supabase client-key discovery failed with HTTP ${keysResponse.status}.`);
          }

          const keysPayload = await keysResponse.json();
          const keys = Array.isArray(keysPayload) ? keysPayload : [];
          const legacyAnon = keys.find(item => {
            const name = normalize(item?.name);
            const type = normalize(item?.type);
            const prefix = String(item?.prefix || '').toLowerCase();
            return name === 'anon'
              || name === 'legacy-anon'
              || (type === 'legacy' && !name.includes('service') && !prefix.includes('service'));
          });
          const anonKey = String(legacyAnon?.api_key || '').trim();
          if (!anonKey) {
            throw new Error('No revealed legacy anon key was returned for the staging project.');
          }

          process.stdout.write(`${projectRef}\n`);
          process.stdout.write(`https://${projectRef}.supabase.co\n`);
          process.stdout.write(`${anonKey}\n`);
          NODE
          )

          if [[ ${#RESOLUTION[@]} -ne 3 ]]; then
            echo 'Automatic staging discovery returned an unexpected result.' >&2
            exit 1
          fi

          echo "::add-mask::${RESOLUTION[2]}"
          {
            printf 'SUPABASE_STAGING_PROJECT_REF=%s\n' "${RESOLUTION[0]}"
            printf 'CONFIRM_PROJECT_REF=%s\n' "${RESOLUTION[0]}"
            printf 'SUPABASE_STAGING_URL=%s\n' "${RESOLUTION[1]}"
            printf 'SUPABASE_STAGING_ANON_KEY=%s\n' "${RESOLUTION[2]}"
          } >> "$GITHUB_ENV"

      - name: Validate staging safety contracts
        run: |
          node --check scripts/release/verify-supabase-staging-management.mjs
          node --check scripts/release/bootstrap-supabase-staging-key.mjs
          node --check scripts/release/verify-supabase-staging.mjs
          node scripts/release/validate-supabase-staging-template.mjs
          node test/supabase-staging-key-bootstrap.test.js
          node test/supabase-staging-gate.test.js

      - name: Apply migration and run protected staging suite
        run: node scripts/release/verify-supabase-staging-management.mjs

      - name: Write staging summary
        if: always()
        shell: bash
        run: |
          {
            echo '## BizOn Supabase Staging CI'
            echo
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Project: \`${SUPABASE_STAGING_PROJECT_REF:-unresolved}\`"
            echo "- Apply migration: \`${APPLY_MIGRATION}\`"
            echo "- Retention purge: \`${RUN_RETENTION_PURGE}\`"
            echo '- Project ref: discovered from Supabase by protected project name'
            echo '- Client key: discovered from the protected staging project'
            echo '- SQL transport: Supabase Management API'
            echo '- Database password: not required'
            echo '- Production project: blocked by safety contracts'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized staging report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bizon-supabase-staging-ci-report
          path: artifacts/supabase-staging
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish staging commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) STATE='success'; DESCRIPTION='BizOn staging migration and smoke suite passed' ;;
            failure) STATE='failure'; DESCRIPTION='BizOn staging migration or smoke suite failed' ;;
            *) STATE='error'; DESCRIPTION='BizOn staging CI did not complete normally' ;;
          esac
          jq -n \
            --arg state "$STATE" \
            --arg context 'bizon/supabase-staging' \
            --arg description "$DESCRIPTION" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' \
            > staging-status.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @staging-status.json \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            > /dev/null
