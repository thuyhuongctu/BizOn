# BizOn staging CI v6 — automatic pooler discovery; production remains gated
name: BizOn Supabase Staging CI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/supabase-staging-first-run.yml'
      - 'scripts/release/bootstrap-supabase-staging-key.mjs'
      - 'scripts/release/verify-supabase-staging.mjs'
      - 'scripts/release/validate-supabase-staging-template.mjs'
      - 'test/supabase-staging-key-bootstrap.test.js'
      - 'test/supabase-staging-gate.test.js'
      - 'supabase/migrations/**'
  schedule:
    # 02:30 Asia/Ho_Chi_Minh (UTC+7); GitHub schedules may start a few minutes late.
    - cron: '30 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-ci:
    name: staging migration and protected smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-staging
    concurrency:
      group: bizon-supabase-staging
      cancel-in-progress: false
    env:
      SUPABASE_STAGING_PROJECT_REF: kdpjlbqvdlnsthrmchm
      SUPABASE_STAGING_URL: https://kdpjlbqvdlnsthrmchm.supabase.co
      SUPABASE_STAGING_DATABASE_INPUT: ${{ secrets.SUPABASE_STAGING_DATABASE_URL }}
      SUPABASE_STAGING_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
      SUPABASE_STAGING_INSTRUCTOR_KEY: ${{ secrets.SUPABASE_STAGING_INSTRUCTOR_KEY }}
      CONFIRM_PROJECT_REF: kdpjlbqvdlnsthrmchm
      APPLY_MIGRATION: ${{ github.event_name == 'schedule' && 'false' || 'true' }}
      RUN_RETENTION_PURGE: 'true'
      BIZON_STAGING_REPORT_DIR: artifacts/supabase-staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Resolve protected staging database URL
        shell: bash
        run: |
          set -euo pipefail
          INPUT="${SUPABASE_STAGING_DB_PASSWORD:-${SUPABASE_STAGING_DATABASE_INPUT:-}}"
          if [[ -z "$INPUT" ]]; then
            echo 'Missing SUPABASE_STAGING_DATABASE_URL or SUPABASE_STAGING_DB_PASSWORD.' >&2
            exit 1
          fi
          echo "::add-mask::$INPUT"
          DATABASE_URL="$(DATABASE_INPUT="$INPUT" PROJECT_REF="$SUPABASE_STAGING_PROJECT_REF" ACCESS_TOKEN="${SUPABASE_ACCESS_TOKEN:-}" node <<'NODE'
          const raw = String(process.env.DATABASE_INPUT || '').trim();
          const projectRef = String(process.env.PROJECT_REF || '').trim();
          const accessToken = String(process.env.ACCESS_TOKEN || '').trim();
          if (!raw || !projectRef) throw new Error('Missing protected staging database input or project ref.');

          let password = raw;
          let suppliedUrl = null;
          if (/^postgres(?:ql)?:\/\//i.test(raw)) {
            suppliedUrl = new URL(raw);
            password = decodeURIComponent(suppliedUrl.password || '');
          }
          if (!password) throw new Error('The supplied database value does not contain a usable staging password.');

          const isExactSessionPooler = suppliedUrl
            && suppliedUrl.hostname.endsWith('.pooler.supabase.com')
            && decodeURIComponent(suppliedUrl.username) === `postgres.${projectRef}`
            && (suppliedUrl.port || '5432') === '5432';

          let resolved = suppliedUrl;
          if (!isExactSessionPooler) {
            if (!accessToken) {
              throw new Error('SUPABASE_ACCESS_TOKEN is required once to discover the exact staging Session Pooler endpoint automatically.');
            }

            const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/config/database/pooler`, {
              headers: {
                Authorization: `Bearer ${accessToken}`,
                Accept: 'application/json'
              }
            });
            if (!response.ok) {
              throw new Error(`Supabase pooler discovery failed with HTTP ${response.status}.`);
            }
            const payload = await response.json();
            const candidates = Array.isArray(payload) ? payload : [payload];
            const session = candidates.find(item => {
              const value = String(item?.connection_string || item?.connectionString || '');
              return String(item?.pool_mode || '').toLowerCase() === 'session'
                || Number(item?.db_port) === 5432
                || /:5432(?:\/|$)/.test(value);
            });
            const template = String(session?.connection_string || session?.connectionString || '');
            if (!template) throw new Error('Supabase did not return a Session Pooler connection string for the staging project.');
            resolved = new URL(template.replace('[YOUR-PASSWORD]', encodeURIComponent(password)));
          }

          resolved.username = `postgres.${projectRef}`;
          resolved.password = password;
          resolved.port = '5432';
          resolved.pathname = '/postgres';
          resolved.searchParams.set('sslmode', 'require');
          process.stdout.write(resolved.toString());
          NODE
          )"
          echo "::add-mask::$DATABASE_URL"
          printf 'SUPABASE_STAGING_DATABASE_URL=%s\n' "$DATABASE_URL" >> "$GITHUB_ENV"

      - name: Validate staging safety contracts
        run: |
          node --check scripts/release/bootstrap-supabase-staging-key.mjs
          node --check scripts/release/verify-supabase-staging.mjs
          node scripts/release/validate-supabase-staging-template.mjs
          node test/supabase-staging-key-bootstrap.test.js
          node test/supabase-staging-gate.test.js

      - name: Bootstrap staging instructor-key verifier
        if: env.APPLY_MIGRATION == 'true'
        run: node scripts/release/bootstrap-supabase-staging-key.mjs

      - name: Apply migration and run staging smoke suite
        run: node scripts/release/verify-supabase-staging.mjs

      - name: Write staging summary
        if: always()
        shell: bash
        run: |
          {
            echo '## BizOn Supabase Staging CI'
            echo
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Project: \`${SUPABASE_STAGING_PROJECT_REF}\`"
            echo "- Apply migration: \`${APPLY_MIGRATION}\`"
            echo "- Retention purge: \`${RUN_RETENTION_PURGE}\`"
            echo '- Pooler endpoint: discovered from Supabase Management API when needed'
            echo '- Production project: blocked by safety contracts'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized staging report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bizon-supabase-staging-ci-report
          path: artifacts/supabase-staging
          if-no-files-found: ignore
          retention-days: 30
