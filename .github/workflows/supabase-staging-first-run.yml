# BizOn staging CI v7.1 — automatic project and pooler discovery; production remains gated
name: BizOn Supabase Staging CI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/supabase-staging-first-run.yml'
      - 'scripts/release/bootstrap-supabase-staging-key.mjs'
      - 'scripts/release/verify-supabase-staging.mjs'
      - 'scripts/release/validate-supabase-staging-template.mjs'
      - 'test/supabase-staging-key-bootstrap.test.js'
      - 'test/supabase-staging-gate.test.js'
      - 'supabase/migrations/**'
  schedule:
    # 02:30 Asia/Ho_Chi_Minh (UTC+7); GitHub schedules may start a few minutes late.
    - cron: '30 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-ci:
    name: staging migration and protected smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-staging
    concurrency:
      group: bizon-supabase-staging
      cancel-in-progress: false
    env:
      SUPABASE_STAGING_PROJECT_NAME: bizon-staging
      SUPABASE_STAGING_PROJECT_REF_HINT: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
      SUPABASE_STAGING_URL_HINT: ${{ vars.SUPABASE_STAGING_URL }}
      SUPABASE_STAGING_DATABASE_INPUT: ${{ secrets.SUPABASE_STAGING_DATABASE_URL }}
      SUPABASE_STAGING_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
      SUPABASE_STAGING_INSTRUCTOR_KEY: ${{ secrets.SUPABASE_STAGING_INSTRUCTOR_KEY }}
      APPLY_MIGRATION: ${{ github.event_name == 'schedule' && 'false' || 'true' }}
      RUN_RETENTION_PURGE: 'true'
      BIZON_STAGING_REPORT_DIR: artifacts/supabase-staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Resolve protected staging project and database URL
        shell: bash
        run: |
          set -euo pipefail
          INPUT="${SUPABASE_STAGING_DB_PASSWORD:-${SUPABASE_STAGING_DATABASE_INPUT:-}}"
          if [[ -z "$INPUT" ]]; then
            echo 'Missing SUPABASE_STAGING_DATABASE_URL or SUPABASE_STAGING_DB_PASSWORD.' >&2
            exit 1
          fi
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo 'Missing SUPABASE_ACCESS_TOKEN for automatic staging project discovery.' >&2
            exit 1
          fi
          echo "::add-mask::$INPUT"

          mapfile -t RESOLUTION < <(
            DATABASE_INPUT="$INPUT" \
            PROJECT_NAME="$SUPABASE_STAGING_PROJECT_NAME" \
            PROJECT_REF_HINT="${SUPABASE_STAGING_PROJECT_REF_HINT:-}" \
            ACCESS_TOKEN="$SUPABASE_ACCESS_TOKEN" \
            node <<'NODE'
          const raw = String(process.env.DATABASE_INPUT || '').trim();
          const targetName = String(process.env.PROJECT_NAME || 'bizon-staging').trim();
          const refHint = String(process.env.PROJECT_REF_HINT || '').trim();
          const accessToken = String(process.env.ACCESS_TOKEN || '').trim();
          const productionRef = 'ceytblfelodpnudomccn';

          const normalize = value => String(value || '')
            .trim()
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '');

          const headers = {
            Authorization: `Bearer ${accessToken}`,
            Accept: 'application/json'
          };

          const projectsResponse = await fetch('https://api.supabase.com/v1/projects', { headers });
          if (!projectsResponse.ok) {
            throw new Error(`Supabase project discovery failed with HTTP ${projectsResponse.status}.`);
          }
          const projectsPayload = await projectsResponse.json();
          const projects = Array.isArray(projectsPayload) ? projectsPayload : [];
          if (!projects.length) throw new Error('Supabase returned no projects for this access token.');

          let project = projects.find(item => String(item?.ref || '') === refHint);
          if (!project || normalize(project?.name) !== normalize(targetName)) {
            const named = projects.filter(item => normalize(item?.name) === normalize(targetName));
            if (named.length !== 1) {
              throw new Error(`Expected exactly one Supabase project named ${targetName}; found ${named.length}.`);
            }
            [project] = named;
          }

          const projectRef = String(project?.ref || '').trim();
          const projectName = String(project?.name || '').trim();
          if (!projectRef) throw new Error('The discovered staging project has no project ref.');
          if (projectRef === productionRef) throw new Error('Production Supabase project is blocked.');
          if (normalize(projectName) !== normalize(targetName)) {
            throw new Error('The discovered project name does not match the protected staging project name.');
          }

          let password = raw;
          if (/^postgres(?:ql)?:\/\//i.test(raw)) {
            const supplied = new URL(raw);
            password = decodeURIComponent(supplied.password || '');
          }
          if (!password) throw new Error('The supplied database value does not contain a usable staging password.');

          const poolerResponse = await fetch(
            `https://api.supabase.com/v1/projects/${projectRef}/config/database/pooler`,
            { headers }
          );
          if (!poolerResponse.ok) {
            const text = (await poolerResponse.text())
              .slice(0, 300)
              .replace(/[^a-zA-Z0-9 ._:-]/g, ' ');
            throw new Error(`Supabase pooler discovery failed with HTTP ${poolerResponse.status}: ${text}`);
          }
          const poolerPayload = await poolerResponse.json();
          const candidates = Array.isArray(poolerPayload) ? poolerPayload : [poolerPayload];
          const primary = candidates.find(item => String(item?.database_type || '').toUpperCase() === 'PRIMARY')
            || candidates[0];
          const template = String(primary?.connection_string || primary?.connectionString || '').trim();
          if (!template) throw new Error('Supabase did not return a pooler connection string for staging.');

          const passwordTokenPattern = /\[(?:YOUR[-_])?PASSWORD\]|%5B(?:YOUR[-_])?PASSWORD%5D/ig;
          const withPassword = passwordTokenPattern.test(template)
            ? template.replace(passwordTokenPattern, encodeURIComponent(password))
            : template;
          const resolved = new URL(withPassword);
          resolved.username = `postgres.${projectRef}`;
          resolved.password = password;
          resolved.port = '5432';
          resolved.pathname = '/postgres';
          resolved.searchParams.set('sslmode', 'require');

          process.stdout.write(`${projectRef}\n`);
          process.stdout.write(`https://${projectRef}.supabase.co\n`);
          process.stdout.write(`${resolved.toString()}\n`);
          NODE
          )

          if [[ ${#RESOLUTION[@]} -ne 3 ]]; then
            echo 'Automatic staging resolution returned an unexpected result.' >&2
            exit 1
          fi
          RESOLVED_PROJECT_REF="${RESOLUTION[0]}"
          RESOLVED_PROJECT_URL="${RESOLUTION[1]}"
          RESOLVED_DATABASE_URL="${RESOLUTION[2]}"

          echo "::add-mask::$RESOLVED_DATABASE_URL"
          {
            printf 'SUPABASE_STAGING_PROJECT_REF=%s\n' "$RESOLVED_PROJECT_REF"
            printf 'CONFIRM_PROJECT_REF=%s\n' "$RESOLVED_PROJECT_REF"
            printf 'SUPABASE_STAGING_URL=%s\n' "$RESOLVED_PROJECT_URL"
            printf 'SUPABASE_STAGING_DATABASE_URL=%s\n' "$RESOLVED_DATABASE_URL"
          } >> "$GITHUB_ENV"

      - name: Validate staging safety contracts
        run: |
          node --check scripts/release/bootstrap-supabase-staging-key.mjs
          node --check scripts/release/verify-supabase-staging.mjs
          node scripts/release/validate-supabase-staging-template.mjs
          node test/supabase-staging-key-bootstrap.test.js
          node test/supabase-staging-gate.test.js

      - name: Bootstrap staging instructor-key verifier
        if: env.APPLY_MIGRATION == 'true'
        run: node scripts/release/bootstrap-supabase-staging-key.mjs

      - name: Apply migration and run staging smoke suite
        run: node scripts/release/verify-supabase-staging.mjs

      - name: Write staging summary
        if: always()
        shell: bash
        run: |
          {
            echo '## BizOn Supabase Staging CI'
            echo
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Project: \`${SUPABASE_STAGING_PROJECT_REF:-unresolved}\`"
            echo "- Apply migration: \`${APPLY_MIGRATION}\`"
            echo "- Retention purge: \`${RUN_RETENTION_PURGE}\`"
            echo '- Project ref: discovered from Supabase account by protected project name'
            echo '- Pooler endpoint: discovered from Supabase Management API'
            echo '- Production project: blocked by safety contracts'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized staging report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bizon-supabase-staging-ci-report
          path: artifacts/supabase-staging
          if-no-files-found: ignore
          retention-days: 30
