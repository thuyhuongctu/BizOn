name: AIBIS Foundation

on:
  push:
    branches:
      - feat/aibis-foundation
  pull_request:
    paths:
      - 'js/aibis-*.js'
      - 'test/aibis-*.test.js'
      - 'js/backend-config.js'
      - 'supabase/migrations/*aibis*.sql'
      - 'docs/AIBIS-*.md'
      - '.github/workflows/aibis-foundation.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run existing engine tests
        run: node test/engine.test.js

      - name: Run Brand Passport tests
        run: node test/brand-passport.test.js

      - name: Run AIBIS core tests
        run: node test/aibis-core.test.js

      - name: Run AIBIS context tests
        run: node test/aibis-context.test.js

      - name: Run AIBIS telemetry tests
        run: node test/aibis-telemetry.test.js

      - name: Run AIBIS scripted validation
        run: node test/aibis-validation.test.js

      - name: Syntax-check AIBIS browser modules
        run: |
          node --check js/aibis-context.js
          node --check js/aibis-adapter.js
          node --check js/aibis-diagnostics.js
          node --check js/aibis-research-ui.js
          node --check js/aibis-parity.js
          node --check js/aibis-parameters.js
          node --check js/backend-config.js
