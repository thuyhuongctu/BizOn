name: Supabase – sao lưu định kỳ (mã hóa)

# Mỗi ngày 02:17 giờ Việt Nam (19:17 UTC) xuất cơ sở dữ liệu Supabase của BizOn (schema public + tài khoản
# auth.users/identities), mã hóa AES-256 bằng gpg rồi lưu thành artifact 90 ngày. Kho này công khai: artifact
# tải được bởi bất kỳ ai có tài khoản GitHub, nên KHÔNG BAO GIỜ tải lên bản chưa mã hóa.
# Cần 2 repository secret: SUPABASE_DB_URL (Session pooler) và BACKUP_PASSPHRASE (≥ 16 ký tự).
# Cách thêm secret, tải và khôi phục: docs/sao-luu-supabase.md. Chạy tay: Actions → workflow này → Run workflow.
on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'thuyhuongctu/BizOn'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cài pg_dump 17 (khớp Postgres của Supabase)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Xuất, kiểm tra và mã hóa
        id: bk
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          PG_BIN: /usr/lib/postgresql/17/bin
          OUT_DIR: backup-out
        run: bash scripts/supabase-backup.sh

      - name: Lưu tệp đã mã hóa (90 ngày)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bk.outputs.name }}
          path: ${{ steps.bk.outputs.file }}
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
