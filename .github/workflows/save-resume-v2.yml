name: Save Resume v2

on:
  push:
    branches:
      - feat/save-resume-v2
    paths:
      - 'js/core/game-state.js'
      - 'js/core/persistence.js'
      - 'test/persistence.test.js'
      - '.github/workflows/save-resume-v2.yml'
  pull_request:
    paths:
      - 'js/core/game-state.js'
      - 'js/core/persistence.js'
      - 'test/persistence.test.js'
      - '.github/workflows/save-resume-v2.yml'

permissions:
  contents: read

jobs:
  persistence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check js/core/game-state.js
          node --check js/core/persistence.js
      - name: Core state and seed tests
        run: node test/core-state-seed.test.js
      - name: Persistence tests
        run: node test/persistence.test.js
