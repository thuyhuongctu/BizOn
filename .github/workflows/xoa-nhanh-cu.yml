name: Dọn nhánh cũ đã gộp (chạy một lần)

# Bấm tay (Actions → «Dọn nhánh cũ đã gộp» → Run workflow), gõ XOA để xóa thật; để trống = chỉ liệt kê.
# Danh sách: .github/xoa-nhanh/danh-sach.txt, mỗi dòng «<sha> <nhánh>», lập ngày 07/11/2026 từ các PR đã gộp.
# Chỉ xóa khi đầu nhánh trên GitHub vẫn đúng sha ghi trong danh sách: nhánh có commit mới sau đó thì bỏ qua.
# Không bao giờ xóa main hay nhánh có PR đang mở. Xóa từ phiên đám mây hay bị cổng mạng cắt («remote end
# hung up»), nên chạy trên máy GitHub. Chạy xong thì gỡ workflow này và danh sách.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Gõ XOA để xóa thật (để trống = chỉ liệt kê)'
        type: string
        required: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: xoa-nhanh-cu
  cancel-in-progress: false

jobs:
  xoa:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Xóa nhánh trong danh sách
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          mo=$(gh pr list --repo "$REPO" --state open --limit 200 --json headRefName --jq '.[].headRefName')
          xoa=0; bo=0; mat=0
          while read -r sha nhanh; do
            case "$sha" in ''|'#'*) continue ;; esac
            if [ "$nhanh" = main ] || grep -qxF "$nhanh" <<<"$mo"; then echo "BỎ QUA (main hoặc PR đang mở): $nhanh"; bo=$((bo+1)); continue; fi
            hien=$(gh api "repos/$REPO/git/ref/heads/$nhanh" --jq .object.sha </dev/null 2>/dev/null || true)
            if [ -z "$hien" ]; then echo "ĐÃ KHÔNG CÒN: $nhanh"; mat=$((mat+1)); continue; fi
            if [ "$hien" != "$sha" ]; then echo "BỎ QUA (có commit mới $hien): $nhanh"; bo=$((bo+1)); continue; fi
            if [ "$CONFIRM" = XOA ]; then
              if gh api -X DELETE "repos/$REPO/git/refs/heads/$nhanh" </dev/null >/dev/null; then echo "ĐÃ XÓA: $nhanh"; else echo "LỖI KHI XÓA: $nhanh"; fi
            else
              echo "SẼ XÓA: $nhanh"
            fi
            xoa=$((xoa+1))
          done < .github/xoa-nhanh/danh-sach.txt
          echo "Tổng: ${xoa} nhánh $([ "$CONFIRM" = XOA ] && echo 'đã xóa' || echo 'sẽ xóa'), ${bo} bỏ qua, ${mat} đã không còn."
