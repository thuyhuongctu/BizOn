name: AIBIS App Engine Integration

on:
  pull_request:
    paths:
      - 'app/aibis.html'
      - 'js/aibis/**'
      - 'js/app-shell/aibis-workspace.js'
      - 'test/aibis-app-engine-integration.test.js'
      - 'test/aibis-app-workspace.test.js'
      - 'docs/architecture/AIBIS-APP-ENGINE-INTEGRATION.md'
      - '.github/workflows/aibis-app-engine-integration.yml'
  push:
    branches: ['main', 'feat/aibis-app-engine-main']

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check js/aibis/country-profile-registry.js
      - run: node --check js/aibis/country-role-view.js
      - run: node --check js/aibis/anchor-profiles.js
      - run: node --check js/aibis/entry-mode-models.js
      - run: node --check js/aibis/entry-mode-engine.js
      - run: node --check js/app-shell/aibis-workspace.js
      - run: node test/aibis-app-engine-integration.test.js
      - run: node test/aibis-app-workspace.test.js
      - run: node test/country-role-view.test.js
      - run: node test/anchor-profiles.test.js
