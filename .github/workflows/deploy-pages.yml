name: Deploy lên GitHub Pages

# Một đường deploy duy nhất: actions/deploy-pages (nguồn Pages = "GitHub Actions").
# Trước 10/2026 còn đẩy thêm cả kho lên nhánh gh-pages (≈940 MB) phòng khi nguồn Pages là
# "Deploy from a branch"; nhưng Pages đã không dựng từ gh-pages kể từ 27/07/2026, nên bước đó
# chỉ tốn thời gian. Hai bước deploy cũng đều continue-on-error nên lỗi thật bị che – nay bỏ.
# Chỉ đưa lên tệp của trang: mã kiểm thử, script, SQL, Android, cấu hình nội bộ… không lên web.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Mã băm nội dung các tệp sw.js nạp sẵn: lượt cài phiên bản CACHE mới chỉ tải tệp đã đổi.
      - name: Tạo sw-manifest.json
        run: node scripts/release/sw-manifest.mjs

      # Không trang nào tải tệp trong các thư mục này (chỉ được nhắc trong chú thích mã).
      # Giữ: kt330h/ (ứng dụng lớp KT330H), data/, vietlens/, gravity-lab/, logo/, .well-known/.
      - name: Chỉ giữ tệp của trang
        run: |
          rm -rf .github .claude docs test scripts supabase android play-store config release design node_modules
          rm -f package.json .gitignore .htmlvalidate.json .htmlvalidate-institutional.json
          for f in index.html 404.html CNAME sw.js sw-manifest.json robots.txt sitemap.xml; do
            test -e "$f" || { echo "::error::Thiếu $f trong bản deploy"; exit 1; }
          done
          du -sh . --exclude=.git

      - name: Cấu hình Pages (tự bật lại nếu bị tắt)
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy qua GitHub Actions
        id: deployment
        uses: actions/deploy-pages@v4
