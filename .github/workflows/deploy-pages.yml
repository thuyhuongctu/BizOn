name: Deploy lên GitHub Pages

# Deploy bằng cách đẩy nội dung lên branch gh-pages — GitHub tự kích hoạt
# Pages khi branch này tồn tại, không cần bật thủ công trong Settings
# (token workflow không đủ quyền gọi API tạo Pages site trực tiếp).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish lên branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,docs'
          commit_message: 'Deploy BizOn Bật Nghiệp'
