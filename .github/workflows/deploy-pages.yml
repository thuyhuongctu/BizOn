name: Deploy lên GitHub Pages

# Deploy theo HAI đường ray để chống sự cố cấu hình nguồn Pages:
#  1. Đẩy nội dung lên branch gh-pages (phục vụ nguồn "Deploy from a branch").
#  2. Deploy chính thức qua actions/deploy-pages (phục vụ nguồn "GitHub Actions").
# Nguồn Pages đang ở chế độ nào thì đường ray tương ứng sẽ xuất bản site;
# đường còn lại được phép thất bại êm (continue-on-error).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish lên branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,docs'
          commit_message: 'Deploy BizOn Bật Nghiệp'

      - name: Loại thư mục không phục vụ khỏi artifact
        run: rm -rf .github docs

      - name: Cấu hình Pages (tự bật lại nếu bị tắt)
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy qua GitHub Actions
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
