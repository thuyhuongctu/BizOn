name: Ho Chieu Sau Rieng

on:
  push:
    branches:
      - main
    paths:
      - 'lab/ho-chieu-sau-rieng*'
      - 'test/ho-chieu-sau-rieng.test.js'
      - '.github/workflows/ho-chieu-sau-rieng.yml'
  pull_request:
    paths:
      - 'lab/ho-chieu-sau-rieng*'
      - 'test/ho-chieu-sau-rieng.test.js'
      - '.github/workflows/ho-chieu-sau-rieng.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check lab/ho-chieu-sau-rieng-engine.js
          node --check lab/ho-chieu-sau-rieng-data.js
      - name: Engine and balance tests
        run: node test/ho-chieu-sau-rieng.test.js
