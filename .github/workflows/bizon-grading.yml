name: Bat Nghiep grading

on:
  pull_request:
    paths:
      - 'js/bizon-grading.js'
      - 'js/backend.js'
      - 'test/bizon-grading.test.js'
      - '.github/workflows/bizon-grading.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check js/backend.js
      - run: node test/bizon-grading.test.js
