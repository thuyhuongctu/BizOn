<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>BizOn – Nội thất, sản phẩm & linh vật</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="assets/icons/rong-xanh-192.png">
<link rel="icon" href="assets/icons/rong-xanh-192.png">
<meta name="theme-color" content="#2f8a8c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "./js/vendor/three.module.js",
  "three/addons/controls/OrbitControls.js": "./js/vendor/OrbitControls.js"
} }
</script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#efe4d2;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:#2c3552}
  #c{position:fixed;inset:0;display:block;width:100%;height:100%}
  .hud{position:fixed;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
  .hud>*{pointer-events:auto}
  #top{top:14px;left:14px;right:14px;justify-content:space-between}
  .brand{display:flex;flex-direction:column;gap:0;background:#fbf6ee;border:3px solid #e6d6bf;border-radius:18px;padding:8px 14px;box-shadow:0 4px 0 #d9c5a8}
  .brand b{font:800 18px/1.1 "Baloo 2",sans-serif;color:#1f6f8a}
  .brand span{font-size:12px;color:#6b6f7a}
  .btn{font:700 14px "Baloo 2",sans-serif;border:3px solid #e6d6bf;background:#fbf6ee;color:#2c3552;border-radius:16px;padding:8px 14px;cursor:pointer;box-shadow:0 4px 0 #d9c5a8;display:flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
  .btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #d9c5a8}
  #depts{position:fixed;z-index:5;top:76px;left:14px;right:14px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:none}
  #depts>*{pointer-events:auto}
  .chip{flex:none;font:700 12px "Baloo 2",sans-serif;border:2px solid #e6d6bf;background:#fbf6ee;color:#2c3552;border-radius:999px;padding:6px 12px;cursor:pointer}
  .chip[aria-pressed="true"]{background:#2f8a8c;border-color:#23706f;color:#fff}
  .label{position:absolute;transform:translate(-50%,-100%);background:rgba(251,246,238,.94);border:2px solid #e6d6bf;border-radius:12px;padding:3px 9px;font:700 11px "Baloo 2",sans-serif;color:#1f4a55;white-space:nowrap;pointer-events:none;max-width:200px;overflow:hidden;text-overflow:ellipsis}
  #info{position:fixed;z-index:6;left:50%;bottom:16px;transform:translateX(-50%);max-width:min(520px,92vw);background:#fbf6ee;border:3px solid #e6d6bf;border-radius:20px;padding:12px 18px;box-shadow:0 6px 0 #d9c5a8;text-align:center;display:none}
  #info b{font:800 15px "Baloo 2",sans-serif;color:#1f6f8a;display:block}
  #info span{font-size:12px;color:#6b6f7a;display:block}
  @media (max-width:640px){.brand span{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="top">
  <div class="brand"><b>🧱 Nội thất, sản phẩm & linh vật</b><span>Bộ sưu tập · BizOn Bật Nghiệp</span></div>
  <a class="btn" href="BizOn Game 3D.html">◀ Quay lại</a>
</div>
<div id="depts"></div>
<div id="info"><b id="infoName"></b><span id="infoRole"></span></div>
<div id="labels"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { makeHQ } from './bizon-hq-kit.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xefe4d2);
const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.05, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.maxPolarAngle = 1.4; controls.minDistance = 0.6; controls.maxDistance = 20;

const hemi = new THREE.HemisphereLight(0xfff4e6, 0xb58a66, 1.3); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.0); sun.position.set(6, 10, 7); scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(20, 64), new THREE.MeshStandardMaterial({ color: 0xe3d3b6, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);

const hq = makeHQ(THREE);
const DEPTS = hq.depts; // {id,label,color}[]
const byDept = id => hq.items.filter(i => i.dept === id);

const gallery = new THREE.Group(); scene.add(gallery);
const labelsBox = document.getElementById('labels');
let entries = [], labelEls = [];

function sizeOf(o) { const box = new THREE.Box3().setFromObject(o); const s = box.getSize(new THREE.Vector3()); return Math.max(s.x, s.y, s.z, 0.12); }

function buildDept(id) {
  while (gallery.children.length) gallery.remove(gallery.children[0]);
  labelEls.forEach(d => d.remove()); labelEls = []; entries = [];
  document.getElementById('info').style.display = 'none';
  const list = byDept(id);
  const cols = Math.ceil(Math.sqrt(list.length));
  const spacing = id === 'flags' ? 1.4 : 1.9;
  list.forEach((item, i) => {
    const o = item.build();
    const cx = (i % cols) - (cols - 1) / 2, cz = Math.floor(i / cols) - (Math.ceil(list.length / cols) - 1) / 2;
    o.position.set(cx * spacing, 0, cz * spacing);
    gallery.add(o);
    const d = document.createElement('div'); d.className = 'label'; d.textContent = item.label;
    labelsBox.appendChild(d); labelEls.push(d);
    entries.push({ item, o, h: sizeOf(o) });
  });
  const span = Math.max(cols, Math.ceil(list.length / cols)) * spacing;
  camera.position.set(span * 0.55, span * 0.6 + 1, span * 0.85);
  controls.target.set(0, 0.4, 0);
}

const deptsBox = document.getElementById('depts');
DEPTS.forEach((d, i) => {
  const b = document.createElement('button'); b.className = 'chip'; b.textContent = d.label; b.setAttribute('aria-pressed', 'false');
  b.onclick = () => { deptsBox.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b)); buildDept(d.id); };
  deptsBox.appendChild(b);
});
const productsChip = Array.from(deptsBox.children).find((_, i) => DEPTS[i].id === 'products') || deptsBox.children[0];
productsChip.setAttribute('aria-pressed', 'true'); buildDept(DEPTS.find(d => d.id === 'products') ? 'products' : DEPTS[0].id);

const info = document.getElementById('info'), infoName = document.getElementById('infoName'), infoRole = document.getElementById('infoRole');
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
canvas.addEventListener('pointerdown', ev => down = [ev.clientX, ev.clientY]);
canvas.addEventListener('pointerup', ev => {
  if (!down || Math.hypot(ev.clientX - down[0], ev.clientY - down[1]) > 5) return;
  ndc.set(ev.clientX / innerWidth * 2 - 1, -ev.clientY / innerHeight * 2 + 1); ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(entries.map(e => e.o), true);
  if (!hits[0]) return;
  let o = hits[0].object; while (o.parent && !entries.find(e => e.o === o)) o = o.parent;
  const e = entries.find(x => x.o === o); if (!e) return;
  infoName.textContent = e.item.label; infoRole.textContent = e.o.userData.role || '';
  info.style.display = 'block';
});

function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const tmp = new THREE.Vector3();
function tick() {
  controls.update();
  entries.forEach((e, i) => { tmp.copy(e.o.position); tmp.y += e.h + 0.15; tmp.project(camera);
    const vis = tmp.z < 1; if (labelEls[i]) { labelEls[i].style.display = vis ? 'block' : 'none';
      if (vis) { labelEls[i].style.left = (tmp.x + 1) / 2 * innerWidth + 'px'; labelEls[i].style.top = (1 - tmp.y) / 2 * innerHeight + 'px'; } } });
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
