<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trung tâm trò chơi · BizOn Bật Nghiệp</title>
<meta name="description" content="Trung tâm trò chơi BizOn Arcade: 4 game mô phỏng chính (Bến Phù Sa, Bật Nghiệp, Hộ Chiếu Thương Hiệu, Hộ Chiếu Sầu Riêng) cùng các mini-game EnQuiz, Đoán Giá Thị Trường, Đấu Trường 1v1 và game phản xạ.">
<meta name="copyright" content="© 2026 Đỗ Thùy Hương & PGS.TS. Phan Anh Tú">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/bizon-clay-fonts.css">
<link rel="stylesheet" href="css/bizon-clay.css">
<style>
  @keyframes arSpin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .ar-hero .sun,.ar-hero .art img{animation:none!important} }
  .clay-main.ar-wide{max-width:1160px}
  .ar-hero{position:relative;overflow:hidden;margin-top:28px;border-radius:40px;background:var(--clay-cream-deep);box-shadow:inset 0 -10px 0 rgba(140,80,20,.1),inset 0 6px 0 rgba(255,255,255,.7),0 30px 44px -30px rgba(110,70,30,.6)}
  .ar-hero .sun{position:absolute;right:-6%;top:-30%;width:min(560px,62%);aspect-ratio:1;border-radius:50%;background:url(assets/brand/trong-dong.svg) center/contain no-repeat;box-shadow:inset 0 -16px 0 rgba(200,110,20,.2);opacity:.85;animation:arSpin 90s linear infinite;pointer-events:none}
  .ar-hero .grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:0 24px;align-items:end;padding:clamp(24px,4vw,44px) clamp(20px,4vw,44px) 0}
  .ar-hero h1{margin:16px 0 0;font-size:clamp(42px,5.6vw,72px)}
  .ar-hero .art{position:relative;height:340px}
  .ar-hero .art img{position:absolute;left:0;right:0;margin:0 auto;bottom:28px;height:92%;max-width:100%;object-fit:contain;filter:drop-shadow(0 18px 14px rgba(30,80,40,.35));animation:clayFloat 4.5s ease-in-out infinite}
  .ar-hero .wave{position:relative;z-index:3;height:44px;margin-top:-44px;background:radial-gradient(circle at 36px 0,transparent 35px,var(--clay-teal-2) 36px) 0 0/72px 36px repeat-x,linear-gradient(var(--clay-teal-2),var(--clay-teal-2)) 0 36px/100% 100% no-repeat}
  .ar-ps{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-top:22px;padding:20px 24px;border-radius:30px;background:#033337;color:#E1F2F5;box-shadow:inset 0 -8px 0 rgba(0,0,0,.25),inset 0 5px 0 rgba(255,255,255,.08)}
  .ar-tag{font-family:var(--clay-head);font-size:16px;font-weight:700;color:var(--clay-accent)}
  .ar-title{margin:4px 0 22px;font-family:var(--clay-head);font-size:clamp(30px,3.6vw,42px);font-weight:800;line-height:1.14}
  #ar-jumps{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
  #ar-mains{display:flex;flex-direction:column;gap:20px}
  #ar-sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;margin-top:20px}
  .ar-mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;align-items:start}
  #ar-quiz{grid-column:1/-1;padding:24px;border-radius:30px;background:#D9F0F2;box-shadow:inset 0 -9px 0 rgba(0,0,0,.07),inset 0 5px 0 rgba(255,255,255,.6),0 24px 32px -24px rgba(0,60,80,.55)}
  #ar-price,#ar-h2h{padding:22px;border-radius:28px;background:var(--clay-card);box-shadow:inset 0 -8px 0 rgba(110,70,30,.08),inset 0 5px 0 #fff,0 20px 28px -22px rgba(110,70,30,.55)}
  #ar-ext{display:contents}
</style>
<meta property="og:type" content="website">
<meta property="og:title" content="Trung tâm trò chơi · BizOn Bật Nghiệp">
<meta property="og:description" content="4 game mô phỏng chính và các mini-game EnQuiz, Đoán Giá, Đấu Trường 1v1.">
<meta name="twitter:card" content="summary_large_image">
</head>
<body class="clay">

<main class="clay-main ar-wide">
  <section class="ar-hero">
    <div class="sun" aria-hidden="true"></div>
    <div class="grid">
      <div style="padding-bottom:clamp(24px,6vw,84px)">
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;font-weight:800;color:#7A4A0E">
          <a href="index.html" style="color:#7A4A0E">BizOn</a><span>›</span><span style="padding:5px 12px;border-radius:999px;background:var(--clay-card);box-shadow:inset 0 -3px 0 rgba(0,0,0,.06)">Arcade</span>
        </div>
        <h1 id="ar-h1">Trung tâm trò chơi</h1>
        <p id="ar-lead" style="margin:14px 0 0;max-width:30em;font-size:17px;line-height:1.6;color:#4A3A20;text-wrap:pretty"></p>
        <div id="ar-jumps"></div>
      </div>
      <div class="art"><img src="assets/character/rong-xanh-cup.webp" alt="" loading="lazy"></div>
    </div>
    <div class="wave" aria-hidden="true"></div>
  </section>

  <section class="ar-ps" id="ar-ps"></section>

  <section style="margin:56px 0 0">
    <div class="ar-tag" id="ar-pathtag">4 game chính · 3 game có cả bản 2D &amp; 3D</div>
    <h2 class="ar-title" id="ar-pathtitle">Đi từ bến sông ra biển lớn</h2>
    <div id="ar-mains"></div>
    <div id="ar-sides"></div>
  </section>

  <section style="margin:64px 0 72px">
    <div class="ar-tag" id="ar-minitag">Trò chơi nhỏ · demo &amp; ôn luyện</div>
    <h2 class="ar-title" id="ar-minititle">Luyện một kỹ năng trong vài phút</h2>
    <div class="ar-mini">
      <div id="ar-quiz"></div>
      <div id="ar-price"></div>
      <div id="ar-h2h"></div>
      <div id="ar-ext"></div>
    </div>
  </section>

  <noscript><p style="text-align:center;color:var(--clay-sub);margin:40px 0">Cần bật JavaScript để chơi Arcade. · Enable JavaScript to play the Arcade.</p></noscript>
</main>

<script src="js/site-vnmap.js" defer></script>
<script src="js/bizon-clay-i18n.js" defer></script>
<script src="js/quiz-bank.js" defer></script>
<script src="js/games-clay.js" defer></script>
<script src="js/bizon-clay-nav.js" defer></script>
<script src="js/bizon-clay-footer.js" defer></script>
</body>
</html>
