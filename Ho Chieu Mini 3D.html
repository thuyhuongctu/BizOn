<script>
/* Đồng bộ ngôn ngữ trước khi bảng «Ho Chieu Mini» gắn vào trang: bảng dc nhớ ngôn ngữ riêng trong
   localStorage 'bizon-hcmini-fdi'.lang (mặc định VI), còn cảnh 3D (bp3d.js) đọc 'bizon-lang'.
   Nếu bảng chưa từng chọn ngôn ngữ thì lấy theo 'bizon-lang' để hai phần không lệch nhau. */
try { var hcK = 'bizon-hcmini-fdi', hcL = localStorage.getItem('bizon-lang') === 'en' ? 'en' : 'vi', hcS = JSON.parse(localStorage.getItem(hcK) || 'null');
  if (!hcS) { if (hcL === 'en') localStorage.setItem(hcK, JSON.stringify({ lang: 'en' })); }
  else if (!hcS.lang) { hcS.lang = hcL; localStorage.setItem(hcK, JSON.stringify(hcS)); }
  else if (hcS.lang !== hcL) localStorage.setItem('bizon-lang', hcS.lang === 'en' ? 'en' : 'vi');
} catch (e) {}
</script>

  html[data-theme="dark"] #bp3d-hint { color:#d6ecf0; background:rgba(8,26,32,.85); }

  #hc-bar b { font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }
  #hc-bar a { color:#fff; font:800 12px Manrope,sans-serif; background:rgba(255,255,255,.14); border-radius:999px; padding:8px 12px; text-decoration:none; }
  @media (min-width:1024px) {
    #bp3d-stage { height:100vh; width:calc(100% - 460px); }
    #bp3d-stage::after { display:none; }
    #bp3d-col { margin-left:auto; width:460px; min-height:100vh; padding-top:52px; }
    .bp3d-tools { bottom:18px; left:18px; } #bp3d-hint { bottom:26px; }
  }
  /* Màn hình lớn toàn khung hình như Bật Nghiệp (cùng cách với Hộ Chiếu Thương Hiệu 3D):
     cảnh 3D chiếm toàn bộ khung dưới thanh điều hướng; bảng quyết định là lớp phủ

  #bp3d-col { position:fixed; left:0; right:0; bottom:0; top:auto; z-index:3; margin:0; min-height:0; max-height:50svh; overflow-y:auto; padding-top:14px; pointer-events:none;
    background:rgba(244,250,255,.94); border-radius:24px 24px 0 0; box-shadow:0 -12px 30px -12px rgba(0,60,80,.4); }
  #bp3d-col > * { pointer-events:auto; }
  html[data-theme="dark"] #bp3d-col { background:rgba(8,26,32,.92); }
  @media (min-width:1024px) {
    body #bp3d-stage { width:100%; height:100vh; }
    body #bp3d-col { box-sizing:border-box; left:auto; top:0; bottom:0; width:460px; max-height:none; height:100vh; margin-left:0; padding-top:72px; border-radius:0; box-shadow:-20px 0 40px -30px rgba(0,60,80,.4); pointer-events:auto; }
    #bp3d-full { display:none; }
  }
  /* Điện thoại/máy tính bảng: tấm quyết định trượt dưới đáy che mất thanh công cụ 3D (bottom:44px) và nút ⤢,
     nên đưa thanh công cụ lên ngay dưới thanh tiêu đề; ⤢ Mở rộng ẩn tấm quyết định để xem trọn cảnh 3D. */
  @media (max-width:1023px) {
    .bp3d-tools { top:62px; bottom:auto; }
    #bp3d-cap { top:112px; }
    #bp3d-hint { display:none !important; }
  }
  body.bp3d-full #bp3d-col { display:none !important; }
</style>

<body>
<div id="hc-bar">
  <b data-en="🎓 Passport Mini 3D">🎓 Hộ Chiếu Mini 3D</b>

</div>
<div id="bp3d-stage" aria-label="Bản đồ 3D 3 thị trường Hộ Chiếu Mini" data-en-aria="3D map of the three Passport Mini markets">
  <div id="bp3d-act" hidden></div>
  <div id="bp3d-cap" role="status" aria-live="polite"></div>
  <div class="bp3d-tools">
    <button id="bp3d-pp" type="button" data-en="🛂 Passport">🛂 Hộ chiếu</button>

<dc-import name="Ho Chieu Mini" edition="fdi" quarters="4" quarter-minutes="0" show-facilitator="false"></dc-import>

<script>
/* ---------- Cầu nối sang bp3d.js: đọc trạng thái ván Hộ Chiếu Mini (đang lưu ở localStorage bởi
   "Ho Chieu Mini.dc.html" không đổi gì) rồi dựng window.__bp tương thích để dùng lại nguyên vẹn
   cảnh 3D Vàm Thịnh của Hộ Chiếu Thương Hiệu 3D, chỉ với 3 đảo thay vì 7. ---------- */
(function () {
  var EN = function () { try { return localStorage.getItem('bizon-lang') === 'en'; } catch (e) { return false; } };
  var tr = function (vi, en) { return EN() ? en : vi; };
  var MODE_MAP = { lic: 3, jv: 4, fdi: 5 };
  var DEFAULT_MK = ['id', 'th', 'de'];
  var curG = null, curHome = 'vn';
  // Bản sao tối thiểu tên/quốc kỳ 4 thị trường của js/fdi-mini/data.js – dùng làm mặc định ngay
  // khi bp3d.js đọc window.__bp.MKTS lần đầu, vì FDIMiniData có thể chưa kịp tải qua <dc-import>.
  var MK_NAMES = {
    id: { name: 'Indonesia', nameEn: 'Indonesia', flag: '🇮🇩' }, th: { name: 'Thái Lan', nameEn: 'Thailand', flag: '🇹🇭' },
    de: { name: 'Đức (EU)', nameEn: 'Germany (EU)', flag: '🇩🇪' }, vn: { name: 'Việt Nam', nameEn: 'Vietnam', flag: '🇻🇳' },
  };

  // Chữ tĩnh của khung 3D (data-en / data-en-aria) theo ngôn ngữ hiện tại
  function applyLang() {
    var en = EN();
    document.querySelectorAll('[data-en]').forEach(function (el) { if (el.dataset.vi === undefined) el.dataset.vi = el.textContent; el.textContent = en ? el.dataset.en : el.dataset.vi; });
    document.querySelectorAll('[data-en-aria]').forEach(function (el) { if (el.dataset.viAria === undefined) el.dataset.viAria = el.getAttribute('aria-label') || ''; el.setAttribute('aria-label', en ? el.dataset.enAria : el.dataset.viAria); });
    document.documentElement.lang = en ? 'en' : 'vi';
    document.title = en ? 'Passport Mini 3D · International Investment' : 'Hộ Chiếu Mini 3D · Đầu tư quốc tế';
  }
  applyLang();
  function poll() {
    try {
      var raw = localStorage.getItem('bizon-hcmini-fdi');
      if (raw) { var s = JSON.parse(raw); curG = s.g || null; curHome = s.home || curHome;
        // Người chơi bấm VI/EN trên bảng dc → đổi luôn ngôn ngữ cảnh 3D (bp3d.js nghe 'bizon:langchange')
        var want = s.lang === 'en' ? 'en' : s.lang === 'vi' ? 'vi' : null;
        if (want && want !== (EN() ? 'en' : 'vi')) { localStorage.setItem('bizon-lang', want); window.__bp.BRAND = brand(); applyLang(); dispatchEvent(new Event('bizon:langchange')); }
      }
    } catch (e) {}
    setTimeout(poll, 700);
  }

  function marketsNow() {
    var D = window.FDIMiniData;
    var mk = (curG && curG.mk) || (D ? D.pickMarkets(curHome) : DEFAULT_MK);
    return mk.map(function (k) {
      var m = D && D.MARKETS[k], n = MK_NAMES[k];
      if (m) return { key: k, name: m.n[0], nameEn: m.n[1], icon: m.flag, trait: m.note[0], traitEn: m.note[1], img: null };
      if (n) return { key: k, name: n.name, nameEn: n.nameEn, icon: n.flag, trait: '', traitEn: '', img: null };
      return { key: k, name: k, nameEn: k, icon: '🌐', trait: '', traitEn: '', img: null };
    });
  }
  function entered() {
    var mk = (curG && curG.mk) || DEFAULT_MK;
    return mk.map(function (k) { var p = curG && curG.pos[k]; return p ? (MODE_MAP[p.mode] ?? null) : null; });
  }
  function know() {
    var mk = (curG && curG.mk) || DEFAULT_MK;
    return mk.map(function (k) { var p = curG && curG.pos[k]; return p ? Math.round((p.know || 0) * 100) : 0; });
  }

  function brand() { return { kicker: tr('Đầu tư quốc tế · phiên bản rút gọn', 'International investment · lightweight edition'), title: '🎓 ' + tr('Hộ Chiếu Mini', 'Passport Mini') }; }
  window.__bp = {
    get MKTS() { return marketsNow(); },
    get MODES() { return window.FDIMiniData ? window.FDIMiniData.MODES.map(function (m) { return { name: m.n[0], nameEn: m.n[1], icon: m.icon }; }) : []; },
    get S() {
      var g = curG, E = window.FDIMini;
      return {
        q: g ? g.q - 1 : 0, Q: g ? g.Q : 4, firm: 0, cash: g ? g.cash : 20,
        entered: entered(), know: know(), phase: g && g.done ? 'end' : undefined,
        profit: g && E ? E.value(g) - g.start : 0, rep: 50, rival: { rev: 0, in: [] }, qin: (g && g.mk || DEFAULT_MK).map(function () { return g ? g.q : 1; }),
      };
    },
    BRAND: brand(),
    LITE: true, // bp3d.js: ẩn nhiệm vụ/huy hiệu/họp cố vấn/sổ tay/biểu đồ của Hộ Chiếu Thương Hiệu (tỷ ₫, Kim Long, mua tin) – không có trong bản Mini
    scores: function () {
      var E = window.FDIMini; if (!E || !curG) return { total: 0 };
      return { total: Math.round(E.score10(curG) * 10) };
    },
  };
  poll();
})();
</script>
<script type="module" src="bp3d.js"></script>
</body>
